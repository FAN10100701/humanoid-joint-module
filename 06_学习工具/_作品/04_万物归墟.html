<script type="module">
/* ============================================================
 * 万物归墟 · SINGULARITY
 * —— 以下 ABYSS 类为「可剥离渲染核心」:未来提取为 _assets/abyss.js,
 *    供首页以待机模式复用。API:mount(canvas,opts)/setWhite/setThemeMix/
 *    setStyle/setLine/setQuality/spawnRipple/destroy
 * ============================================================ */
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const FINE = matchMedia("(hover: hover) and (pointer: fine)").matches;
const clamp = (x,a,b)=>Math.min(b,Math.max(a,x));
const smoothstep = (a,b,x)=>{ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };

/* 光谱预设:黑/白两套盘色(inner→outer) */
const STYLES = {
  amber:  { bh:[0xfff3d6,0xf0a45a], wh:[0xdfeaff,0x6d7dff] },
  violet: { bh:[0xd9e4ff,0x4a55ff], wh:[0xfff0d0,0xff9a3d] },
  jade:   { bh:[0xd2ffef,0x14b87c], wh:[0xf4ffd8,0xd8b93a] },
  crimson:{ bh:[0xffd9c4,0xe62020], wh:[0xffe8ee,0xff4d7d] },
};
/* rt = 写实黑洞主体(全屏 raymarch)的渲染分辨率比 */
const TIERS = {
  high:{ rt:.8,  steps:280, name:"高" },
  mid: { rt:.62, steps:200, name:"中" },
  low: { rt:.45, steps:130, name:"低" },
};
const TAU = Math.PI*2;
/* ---- 全屏后处理着色器:亮部提取 → 双轮高斯模糊 → 合成(真 Bloom) ---- */
const FX_VERT = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;
const FX_BRIGHT = `varying vec2 vUv; uniform sampler2D tex;
void main(){ vec3 c = texture2D(tex, vUv).rgb;
  float l = dot(c, vec3(.2126,.7156,.0722));
  gl_FragColor = vec4(c*smoothstep(.80, 1.28, l), 1.0); }`;
const FX_BLUR = `varying vec2 vUv; uniform sampler2D tex; uniform vec2 uDir;
void main(){ vec3 c = texture2D(tex,vUv).rgb*.2270270;
  c += (texture2D(tex, vUv+uDir*1.3846).rgb + texture2D(tex, vUv-uDir*1.3846).rgb)*.3162162;
  c += (texture2D(tex, vUv+uDir*3.2308).rgb + texture2D(tex, vUv-uDir*3.2308).rgb)*.0702703;
  gl_FragColor = vec4(c, 1.0); }`;
const FX_COMP = `varying vec2 vUv; uniform sampler2D tex; uniform sampler2D uBloomTex; uniform float uBloomK;
void main(){ gl_FragColor = vec4(texture2D(tex,vUv).rgb + uBloomK*texture2D(uBloomTex,vUv).rgb, 1.0); }`;
/* ---- JS 侧盘噪声烘焙:角向(cos/sin 域)低频 + 径向高频 = 拉丝流纹,一次性生成供着色器采样 ---- */
function bakeDiskTexture(T){
  const W = 1024, H = 512;
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d");
  const img = ctx.createImageData(W, H);
  const data = img.data;
  const c01 = v=>v<0?0:v>1?1:v;
  const hash = (x,y,z)=>{ const s = Math.sin(x*127.1 + y*311.7 + z*74.7)*43758.5453; return s - Math.floor(s); };
  const sm = t=>t*t*(3-2*t);
  const vn3 = (x,y,z)=>{
    const xi=Math.floor(x), yi=Math.floor(y), zi=Math.floor(z);
    const xf=x-xi, yf=y-yi, zf=z-zi, u=sm(xf), v=sm(yf), w=sm(zf);
    const l = (a,b,t)=>a+(b-a)*t;
    return l(
      l( l(hash(xi,yi,zi),   hash(xi+1,yi,zi),   u), l(hash(xi,yi+1,zi),   hash(xi+1,yi+1,zi),   u), v),
      l( l(hash(xi,yi,zi+1), hash(xi+1,yi,zi+1), u), l(hash(xi,yi+1,zi+1), hash(xi+1,yi+1,zi+1), u), v), w);
  };
  const fbm3 = (x,y,z)=> vn3(x,y,z)*.55 + vn3(x*2.1,y*2.1,z*2.1)*.28 + vn3(x*4.3,y*4.3,z*4.3)*.17;
  for(let y=0; y<H; y++){
    const rn = y/(H-1);
    for(let x=0; x<W; x++){
      const a = x/W*TAU;
      const cx = Math.cos(a)*2.4, cy = Math.sin(a)*2.4;   /* 角向走圆域:无缝 */
      /* 三通道:R 细流纹 / G 扭曲场(域扭曲用) / B 大尺度云团(柔软调制) */
      const r1 = fbm3(cx, cy, rn*15.0);
      const r2 = fbm3(cx*1.9+11.3, cy*1.9+5.1, rn*7.0);
      const r3 = fbm3(cx*.75+3.7, cy*.75+9.4, rn*3.2);
      const i = (y*W+x)*4;
      data[i]   = Math.round(c01(r1)*255);
      data[i+1] = Math.round(c01(r2)*255);
      data[i+2] = Math.round(c01(r3)*255);
      data[i+3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new T.CanvasTexture(cv);
  tex.wrapS = T.RepeatWrapping; tex.wrapT = T.ClampToEdgeWrapping;
  tex.minFilter = T.LinearFilter; tex.magFilter = T.LinearFilter; tex.generateMipmaps = false;
  return tex;
}

class Abyss{
  constructor(canvas, T){
    this.T = T;
    this.renderer = new T.WebGLRenderer({ canvas, antialias:false, powerPreference:"high-performance" });
    this.renderer.autoClear = false;
    this.aspect = 1; this.dpr = Math.min(devicePixelRatio||1, 2);
    this.tier = "mid"; this.style = "amber";
    this.white = 0; this.whiteTarget = 0;          // 0 黑洞 ↔ 1 白洞
    this.themeMix = 0; this.themeMixTarget = 0;    // 0 深色背景 ↔ 1 浅色背景
    this.lineMix = 0; this.lineMixTarget = 0;      // 0 写实 ↔ 1 引力场线稿
    this.simT = 0; this.timeScale = 1; this.lens = 1;
    this.glowK = 1; this.densK = 1;
    this.warpK = 1; this.mistK = 1; this.mistH = 1; this.starK = 1; this.expoK = 1;
    this.ptr = { x:0, y:0, k:0, kTarget:0 };
    this.rip = Array.from({length:6},()=>new T.Vector4(0,0,9,0)); this.ripI = 0;
    this.feedFlash = 0;
    this.cam = { azim: .6, elev: .055, r: 17.3, azimV: 0 };
    /* 电影运镜 + GC 零分配临时向量(每帧复用,杜绝 GC 抖动) */
    this.fov = 58; this.fovKick = 0; this.idleF = 0; this.idleNow = 0;
    this._cp = new T.Vector3(); this._cf = new T.Vector3(); this._cr = new T.Vector3(); this._cu = new T.Vector3();
    this._t1 = new T.Vector3(); this._t2 = new T.Vector3(); this._t3 = new T.Vector3(); this._up = new T.Vector3(0,1,0);
    this.waveI = 0;
    this._buildQuad();
    this._buildField();
    this.setTier("mid", true);
    this._onResize = ()=>this.resize();
    addEventListener("resize", this._onResize); this.resize();
  }
  _col(hex){ return new this.T.Color(hex); }
  _buildQuad(){
    const T = this.T;
    this.uni = {
      uTime:{value:0}, uAspect:{value:1}, uTanFov:{value:Math.tan(29*Math.PI/180)},
      uCamPos:{value:new T.Vector3()}, uCamF:{value:new T.Vector3()}, uCamR:{value:new T.Vector3()}, uCamU:{value:new T.Vector3()},
      uWhite:{value:0}, uTheme:{value:0}, uLens:{value:1}, uGlowK:{value:1}, uSteps:{value:170}, uLineMix:{value:0},
      uColDiskA:{value:this._col(STYLES.amber.bh[0])}, uColDiskB:{value:this._col(STYLES.amber.bh[1])},
      uColWhiteA:{value:this._col(STYLES.amber.wh[0])}, uColWhiteB:{value:this._col(STYLES.amber.wh[1])},
      uColBgDark:{value:new T.Color(0x05070d)}, uColBgLight:{value:new T.Color(0xeef2f7)},
      uRip:{value:this.rip}, uPointer:{value:new T.Vector2()}, uPointerK:{value:0},
      uFeedFlash:{value:0}, uDiskGain:{value:1}, uCenterOff:{value:new T.Vector2(0,.08)},
      uDiskTex:{value:bakeDiskTexture(T)},   /* 预烘焙盘噪声(一次性 ~100ms,loader 期间) */
      uWaves:{value:[new T.Vector3(9,9,0), new T.Vector3(9,9,0), new T.Vector3(9,9,0)]},
      uWarpK:{value:1}, uMistK:{value:1}, uMistH:{value:1}, uStarK:{value:1}, uExpo:{value:1.22},
    };
    this.quadScene = new T.Scene();
    this.quadCam = new T.OrthographicCamera(-1,1,1,-1,0,1);
    const mat = new T.ShaderMaterial({
      uniforms: this.uni, depthTest:false, depthWrite:false,
      vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
      fragmentShader: FRAG,
    });
    this.quadScene.add(new T.Mesh(new T.PlaneGeometry(2,2), mat));
    this.persp = new T.PerspectiveCamera(58, 1, .1, 300);
    this._buildFX();
  }
  /* ---- 真 Bloom 后期链:亮部提取 → 双轮高斯 → 合成(全部低分辨率 RT,WebGL2 HalfFloat) ---- */
  _buildFX(){
    const T = this.T;
    const opt = { type:T.HalfFloatType, depthBuffer:false, stencilBuffer:false,
      minFilter:T.LinearFilter, magFilter:T.LinearFilter, generateMipmaps:false };
    this.rtScene = new T.WebGLRenderTarget(2, 2, opt);
    this.rtBright = new T.WebGLRenderTarget(2, 2, opt);
    this.rtBlurA = new T.WebGLRenderTarget(2, 2, opt);
    this.rtBlurB = new T.WebGLRenderTarget(2, 2, opt);
    this.fxScene = new T.Scene();
    this.fxQuad = new T.Mesh(new T.PlaneGeometry(2,2), null);
    this.fxQuad.frustumCulled = false;
    this.fxScene.add(this.fxQuad);
    this.brightMat = new T.ShaderMaterial({ uniforms:{ tex:{value:null} }, vertexShader:FX_VERT, fragmentShader:FX_BRIGHT, depthTest:false, depthWrite:false });
    this.blurMat = new T.ShaderMaterial({ uniforms:{ tex:{value:null}, uDir:{value:new T.Vector2()} }, vertexShader:FX_VERT, fragmentShader:FX_BLUR, depthTest:false, depthWrite:false });
    this.compMat = new T.ShaderMaterial({ uniforms:{ tex:{value:null}, uBloomTex:{value:null}, uBloomK:{value:1} }, vertexShader:FX_VERT, fragmentShader:FX_COMP, depthTest:false, depthWrite:false });
  }
  /* 时空之兜:爱因斯坦嵌入图 —— 网格平面被质量压出"兜",物品沿面滚落被吞 */
  _buildField(){
    const T = this.T;
    this.fieldScene = new T.Scene();
    this.fUni = { uWell:{value:5.2}, uTheme:{value:0}, uFade:{value:0} };
    const gridGeo = new T.PlaneGeometry(64, 64, 128, 128);
    gridGeo.rotateX(-Math.PI/2);
    const gridMat = new T.ShaderMaterial({
      uniforms: this.fUni, transparent: true, depthWrite: false, side: T.DoubleSide,
      vertexShader: `uniform float uWell; varying vec2 vUv; varying float vR;
        void main(){ vUv = uv; vec3 p = position; float r = length(p.xz); vR = r;
          p.y += -uWell/(r+1.0);
          gl_Position = projectionMatrix*modelViewMatrix*vec4(p,1.0); }`,
      fragmentShader: `uniform float uTheme, uFade; varying vec2 vUv; varying float vR;
        float gline(float f, float w){ return 1.0 - smoothstep(0.0, w, min(f, 1.0-f)); }
        void main(){
          vec3 ink = mix(vec3(.93,.93,.96), vec3(.10,.10,.11), uTheme);
          vec2 f = fract(vUv*60.0);                     /* 每单位 0.94 格:密网才衬得出兜形 */
          float line = max(gline(f.x,.075), gline(f.y,.075));
          float mask = smoothstep(1.35, 2.2, vR) * (1.0 - smoothstep(19.0, 31.0, vR));
          float a = line*mask*uFade*.9;
          if(a < .012) discard;
          gl_FragColor = vec4(ink, a);
        }`,
    });
    this.fGrid = new T.Mesh(gridGeo, gridMat);
    this.fieldScene.add(this.fGrid);
    this.fSphereMat = new T.MeshBasicMaterial({ color:0x020204, transparent:true, opacity:0 });
    this.fSphere = new T.Mesh(new T.SphereGeometry(1.7, 48, 32), this.fSphereMat);
    this.fieldScene.add(this.fSphere);
    this.fRings = new T.Group();
    for(const [r, w] of [[2.5, .06], [2.95, .045]]){
      const rm = new T.Mesh(new T.RingGeometry(r-w, r+w, 72),
        new T.MeshBasicMaterial({ color:0x111114, transparent:true, opacity:0, side:T.DoubleSide }));
      rm.rotation.x = -Math.PI/2;
      this.fRings.add(rm);
    }
    this.fieldScene.add(this.fRings);
    this.fPulse = 0;
    /* 教学测地线:三条发光对数螺旋嵌入兜面(与兜同顶点位移),慢旋示意"为什么走螺旋" */
    this.fUni.uTime = { value:0 }; this.fUni.uGeo = { value:0 };
    this.fGeo = new T.Group();
    const geoMat = new T.ShaderMaterial({
      uniforms: this.fUni, transparent:true, depthWrite:false,
      vertexShader:`uniform float uWell; void main(){ vec3 p = position; float r = length(p.xz);
        p.y += -uWell/(r+1.0) + .12;
        gl_Position = projectionMatrix*modelViewMatrix*vec4(p,1.0); }`,
      fragmentShader:`uniform float uTheme, uFade, uGeo; void main(){
        vec3 ink = mix(vec3(.55,.78,1.0), vec3(.16,.34,.62), uTheme);
        float a = uFade*(.7+.3*uGeo);
        if(a < .01) discard;
        gl_FragColor = vec4(ink, a); }`,
    });
    for(let k=0;k<3;k++){
      const pts = [];
      for(let j=0;j<=140;j++){
        const t = j/140;
        const r = 15*Math.pow(1.5/15, t);
        const ang = k*(TAU/3) + t*4.6;
        pts.push(new T.Vector3(Math.cos(ang)*r, 0, Math.sin(ang)*r));
      }
      const line = new T.Line(new T.BufferGeometry().setFromPoints(pts), geoMat);
      this.fGeo.add(line);
    }
    this.fieldScene.add(this.fGeo);
  }
  sheetY(r){ return -this.fUni.uWell.value/(r+1.0); }
  _pushWave(){
    const w = this.uni.uWaves.value[this.waveI++ % 3];
    w.set(2.3, 0, 1.15);
  }
  setTier(t, silent){
    if(!TIERS[t]) return;
    this.tier = t;
    this.uni.uSteps.value = TIERS[t].steps;
    if(!silent) this.resize();
  }
  setStyle(name){
    const s = STYLES[name]; if(!s) return;
    this.style = name;
    this.uni.uColDiskA.value.set(s.bh[0]); this.uni.uColDiskB.value.set(s.bh[1]);
    this.uni.uColWhiteA.value.set(s.wh[0]); this.uni.uColWhiteB.value.set(s.wh[1]);
  }
  resize(){
    const w = innerWidth, h = innerHeight;
    const pr = Math.min(devicePixelRatio||1, 2);
    this.renderer.setPixelRatio(pr);
    this.renderer.setSize(w, h);
    this.aspect = w/h;
    this.uni.uAspect.value = w/h;
    this.persp.aspect = w/h; this.persp.updateProjectionMatrix();
    /* 黑洞主体(raymarch)单独降分辨率:frustum 全屏但在低分辨率 RT 上行进,再放大合成 */
    const rtW = Math.max(2, Math.floor(w*pr*TIERS[this.tier].rt));
    const rtH = Math.max(2, Math.floor(h*pr*TIERS[this.tier].rt));
    this.rtScene.setSize(rtW, rtH);
    const bw = Math.max(2, rtW>>1), bh = Math.max(2, rtH>>1);
    this.rtBright.setSize(bw, bh); this.rtBlurA.setSize(bw, bh); this.rtBlurB.setSize(bw, bh);
  }
  spawnRipple(nx, ny){
    const v = this.rip[this.ripI++ % this.rip.length];
    v.set(nx, ny, 0, 1);
  }
  frame(dt, t){
    /* 时间积分:时间流速 × 视界附近时间膨胀 × reduced-motion 降速 */
    const dila = 1 - .68*smoothstep(6.5, 2.8, this.cam.r);
    this.simT += dt * this.timeScale * dila * (RM ? .12 : 1);
    /* 形态/主题/线稿渐变 */
    this.white += (this.whiteTarget - this.white) * Math.min(1, dt*2.6);
    this.themeMix += (this.themeMixTarget - this.themeMix) * Math.min(1, dt*3.2);
    this.lineMix += (this.lineMixTarget - this.lineMix) * Math.min(1, dt*4);
    /* 相机:惯性 + 视差 + 电影运镜(闲置缓漂移/呼吸,事件 FOV 脉冲) */
    const c = this.cam;
    this.idleF += (this.idleNow - this.idleF)*Math.min(1, dt*1.2);
    this.fovKick *= Math.pow(.02, dt);
    c.azim += c.azimV + this.idleF*dt*.05*(RM?.3:1); c.azimV *= Math.pow(.06, dt);
    const par = this.parallax ? 1 : 0;
    const px = this.ptr.x*par*.045, py = -this.ptr.y*par*.03;
    const r = c.r + Math.sin(t*.11)*.7*this.idleF;
    const az = c.azim + px + t*.008*(RM?.25:1);
    const el = clamp(c.elev + py + Math.sin(t*.07)*.035*this.idleF, .04, 1.2);
    const cp = this._cp.set(r*Math.cos(el)*Math.sin(az), r*Math.sin(el), r*Math.cos(el)*Math.cos(az));
    const cf = this._cf.copy(cp).negate().normalize();
    const cr = this._cr.crossVectors(cf, this._up).normalize();
    const cu = this._cu.crossVectors(cr, cf);
    /* 自愈:任何分量异常(NaN/Infinity)时回到安全机位,防止一次脏状态毁掉后续所有帧 */
    if(!isFinite(cp.x+cp.y+cp.z+cf.x+cf.y+cf.z+cr.x+cr.y+cr.z+cu.x+cu.y+cu.z)){
      cp.set(0, 0, r || 17.3); cf.set(0, 0, -1); cr.set(1, 0, 0); cu.set(0, 1, 0);
      c.azim = .6; c.elev = .055; c.azimV = 0;
    }
    /* 指针手势衰减 */
    this.ptr.k += (this.ptr.kTarget - this.ptr.k)*Math.min(1, dt*5);
    this.ptr.kTarget *= Math.pow(.35, dt);
    this.feedFlash *= Math.pow(.04, dt);
    /* FOV:事件脉冲(吸入感)+ 闲置慢呼吸 */
    this.fov = 58 - this.fovKick*2.6 + Math.sin(t*.09)*1.3*this.idleF;
    this.uni.uTanFov.value = Math.tan(this.fov*Math.PI/360);
    this.persp.fov = this.fov; this.persp.updateProjectionMatrix();
    /* uniforms */
    this.uni.uTime.value = this.simT;
    this.uni.uCamPos.value.copy(cp); this.uni.uCamF.value.copy(cf);
    this.uni.uCamR.value.copy(cr); this.uni.uCamU.value.copy(cu);
    this.uni.uWhite.value = this.white; this.uni.uTheme.value = this.themeMix;
    this.uni.uLens.value = this.lens; this.uni.uGlowK.value = this.glowK;
    this.uni.uDiskGain.value = .55 + .45*this.densK;
    this.uni.uWarpK.value = this.warpK; this.uni.uMistK.value = this.mistK;
    this.uni.uMistH.value = this.mistH; this.uni.uStarK.value = this.starK;
    this.uni.uExpo.value = 1.22*this.expoK;
    this.uni.uPointer.value.set(this.ptr.x, this.ptr.y); this.uni.uPointerK.value = this.ptr.k;
    this.uni.uFeedFlash.value = this.feedFlash;
    for(const v of this.rip) v.z += dt;
    for(const w of this.uni.uWaves.value){ w.y += dt; if(w.y > 3.5) w.z = 0; }
    this.persp.position.copy(cp); this.persp.lookAt(0,0,0);
    /* 时空之兜 uniforms / 融合 */
    this.fUni.uWell.value = 5.2*this.lens*(1 - 1.8*this.white);   /* 黑洞下陷 / 白洞外凸 */
    this.fUni.uTheme.value = this.themeMix;
    this.fUni.uFade.value = this.lineMix;
    this.fUni.uTime.value = this.simT;
    this.fUni.uGeo.value = this.lineMix*(.85 + .15*Math.sin(t*.8));
    this.fSphereMat.color.setScalar(.02 + .96*this.white);
    this.fSphereMat.opacity = this.lineMix;
    this.fSphere.scale.setScalar(1 + .3*this.fPulse);
    this.fPulse *= Math.pow(.04, dt);
    /* 球嵌在兜底:球心略高于兜底,球顶接近兜口,兜壁完整包住球体 */
    this.fSphere.position.y = -this.fUni.uWell.value + 1.9;
    this.fRings.position.y = this.sheetY(2.72) + .05;
    this.fRings.scale.setScalar(Math.max(this.lens, .4));
    for(const rm of this.fRings.children){
      rm.material.opacity = .8*this.lineMix;
      rm.material.color.setScalar(.07 + .86*this.themeMix);   /* 浅色墨环 / 深色白环 */
    }
    this.fGeo.rotation.y += dt*.05;
    /* clearColor:写实模式永远深空(星空必须暗才成立);兜模式保留纸面 */
    if(!this._cc){ this._cc = new this.T.Color(); this._cA = new this.T.Color(0x0c0d11); this._cB = new this.T.Color(0xf9f8f4); }
    const R = this.renderer;
    if(this.lineMix > .999){
      this._cc.copy(this._cA).lerp(this._cB, this.themeMix);
      R.setClearColor(this._cc);
      R.clear();
      R.render(this.fieldScene, this.persp);
      return;
    }
    R.setClearColor(this._cA);
    /* 写实链:黑洞主体 → 低分辨率 RT → 真 Bloom(亮部/模糊/合成) */
    R.setRenderTarget(this.rtScene);
    R.clear();
    R.render(this.quadScene, this.quadCam);
    if(this.glowK > .02){
      this.fxQuad.material = this.brightMat;
      this.brightMat.uniforms.tex.value = this.rtScene.texture;
      R.setRenderTarget(this.rtBright); R.clear(); R.render(this.fxScene, this.quadCam);
      this.fxQuad.material = this.blurMat;
      const bw = this.rtBright.width, bh = this.rtBright.height;
      this.blurMat.uniforms.tex.value = this.rtBright.texture;
      this.blurMat.uniforms.uDir.value.set(1/bw, 0);
      R.setRenderTarget(this.rtBlurA); R.clear(); R.render(this.fxScene, this.quadCam);
      this.blurMat.uniforms.tex.value = this.rtBlurA.texture;
      this.blurMat.uniforms.uDir.value.set(0, 1/bh);
      R.setRenderTarget(this.rtBlurB); R.clear(); R.render(this.fxScene, this.quadCam);
      this.blurMat.uniforms.tex.value = this.rtBlurB.texture;
      this.blurMat.uniforms.uDir.value.set(2.3/bw, 0);
      R.setRenderTarget(this.rtBlurA); R.clear(); R.render(this.fxScene, this.quadCam);
      this.blurMat.uniforms.tex.value = this.rtBlurA.texture;
      this.blurMat.uniforms.uDir.value.set(0, 2.3/bh);
      R.setRenderTarget(this.rtBlurB); R.clear(); R.render(this.fxScene, this.quadCam);
    }
    R.setRenderTarget(null);
    R.clear();
    if(this.glowK > .02){
      this.fxQuad.material = this.compMat;
      this.compMat.uniforms.tex.value = this.rtScene.texture;
      this.compMat.uniforms.uBloomTex.value = this.rtBlurB.texture;
      this.compMat.uniforms.uBloomK.value = .34*this.glowK;   /* 参考图:柔和大范围泛光(阈值已降到 .80) */
      R.render(this.fxScene, this.quadCam);
    }else{
      this.fxQuad.material = this.compMat;
      this.compMat.uniforms.tex.value = this.rtScene.texture;
      this.compMat.uniforms.uBloomK.value = 0;
      R.render(this.fxScene, this.quadCam);
    }
    if(this.lineMix > .001){ R.clearDepth(); R.render(this.fieldScene, this.persp); }
  }
  destroy(){
    removeEventListener("resize", this._onResize);
    this.renderer.dispose();
  }
}

/* ---------------- 着色器 ---------------- */
/* 黑洞主体:史瓦西时空光线步进(光子测地线近似 d²x/dλ² = -3/2·h²·x/r⁵),
   吸积盘在 y=0 面程序化生成,泛光直接烘焙(无后处理),uWhite 单一参数做黑洞↔白洞形态渐变;
   uLineMix 切换爱因斯坦纯黑白引力场线稿(屏幕空间弯曲网格 + 内流引力线) */
const FRAG = `
varying vec2 vUv;
uniform float uTime, uAspect, uTanFov, uWhite, uTheme, uLens, uGlowK, uSteps, uFeedFlash, uDiskGain;
uniform float uWarpK, uMistK, uMistH, uStarK, uExpo;
uniform vec3 uCamPos, uCamF, uCamR, uCamU;
uniform vec3 uColDiskA, uColDiskB, uColWhiteA, uColWhiteB, uColBgDark, uColBgLight;
uniform vec4 uRip[6];
uniform vec2 uPointer;
uniform float uPointerK;
uniform vec2 uCenterOff;
uniform sampler2D uDiskTex;   /* 预烘焙盘噪声(角向拉丝),替代逐像素 fbm —— 最大性能项 */
uniform vec3 uWaves[3];       /* 吞噬冲击波在盘上激起的密度波 (r0, age, amp) */
#define R_IN 2.2
#define R_OUT 17.0
#define TAU 6.283185307
float h12(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
vec3 h33(vec3 p){ p = fract(p*vec3(443.897,441.423,437.195)); p += dot(p,p.yxz+19.19); return fract((p.xxy+p.yxx)*p.zyx); }
float vn2(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
  return mix(mix(h12(i),h12(i+vec2(1.,0.)),f.x), mix(h12(i+vec2(0.,1.)),h12(i+vec2(1.,1.)),f.x), f.y); }
float fbm(vec2 p){ float v = 0., a = .55; for(int i=0;i<3;i++){ v += a*vn2(p); p = p*2.13+7.7; a *= .5; } return v; }
vec3 starLayer(vec3 d, float s, float th, float spike){
  vec3 q = d*s; vec3 id = floor(q); vec3 fp = fract(q)-.5;
  vec3 h = h33(id);
  float br = smoothstep(th, 1.0, h.x);
  vec3 off = (h33(id+7.1)-.5)*.55;
  vec3 dv = fp-off;
  float dd = length(dv);
  float tw = .65+.35*sin(uTime*(1.5+h.y*2.0)+h.z*40.0);
  vec3 scol = mix(vec3(.72,.82,1.0), vec3(.88,.92,1.05), uTheme);   /* 深空背景:两种主题都用亮星 */
  float core = (1.0-smoothstep(0.0,.20,dd))*br*2.0;
  return scol*core*tw;
}
vec3 background(vec3 d){
  /* 深空底:不再跟随主题变灰——星空必须是暗的才读得出"星空" */
  vec3 col = mix(uColBgDark, uColBgDark*1.45 + vec3(.008,.014,.03), uTheme);
  /* 银河带:倾斜大圆 + 沿带湍流,给背景第一层景深 */
  vec3 bn = normalize(vec3(.34, 1.0, .18));
  float bandD = dot(d, bn);
  float band = exp(-bandD*bandD*9.0);
  float mb = fbm(d.xz*2.6 + d.y*1.3);
  vec3 bandT = mix(uColDiskB, uColDiskA, .4);
  bandT = mix(bandT, mix(uColBgDark*2.2, uColDiskB, .42), uTheme);
  col = mix(col, mix(col, bandT, .3), band*(.25+.75*mb)*mix(.42, .6, uTheme));   /* 银河带降淡:深空更净 */
  /* 双色星云:主色 + 补色 */
  float neb = fbm(d.xy*2.3 + d.z*1.7 + 3.1);
  vec3 nebT = mix(uColDiskB*.22 + vec3(.012,.02,.05), uColDiskB*.34 + vec3(.02,.03,.08), uTheme);
  col = mix(col, nebT, neb*neb*.38);
  float neb2 = fbm(d.zy*1.7 - d.x*1.1 + 9.7);
  vec3 neb2T = mix(vec3(.05,.03,.09), vec3(.08,.06,.15), uTheme);
  col = mix(col, neb2T, neb2*neb2*.36);
  /* 星场:亮层带星芒;沿银河带加密两层碎星 */
  col += starLayer(d, 26.0, .90, 0.0)*uStarK;
  col += starLayer(d, 61.0, .94, 0.0)*.75*uStarK;
  col += starLayer(d, 113.0, .96, 0.0)*(.45+band*1.2)*uStarK;
  col += starLayer(d, 87.0, .965, 0.0)*(.15+band*.9)*uStarK;
  return col;
}
vec3 diskCol(vec3 pc, vec3 dir, out float alpha){
  float r = length(pc.xz);
  float x = smoothstep(R_IN, R_IN+.4, r) * (1.0-smoothstep(R_OUT-3.6, R_OUT, r));
  float a = atan(pc.z, pc.x);
  float rn = clamp((r-R_IN)/(R_OUT-R_IN), 0., 1.);
  float w = -uTime*1.9/pow(max(r,1.0),1.5);
  /* 云雾质感:三通道纹理 + 域扭曲 —— 细流纹被扭曲场搅成云絮,再乘大尺度云团明暗 */
  vec3 t3 = texture2D(uDiskTex, vec2(fract((a-w)/TAU), rn)).rgb;
  float warp = (t3.g - .5) * .30 * uWarpK;
  float n = pow(clamp(t3.r + warp, 0., 1.), 1.25);
  float streak = mix(.22, 1.85, n) * mix(.55, 1.5, t3.b);
  float rings = .80 + .20*sin(rn*38.0 - n*6.0 + uTime*.12);
  /* 内缘热斑闪烁 */
  float flick = 1.0 + .45*pow(1.0-rn, 2.0)*sin(a*9.0 - uTime*2.3)*sin(a*5.3 + uTime*1.6);
  /* 吞噬冲击波密度波:从内缘向外跑的增亮环 */
  float wave = 0.0;
  for(int i=0;i<3;i++){
    float wr = uWaves[i].x + uWaves[i].y*3.4;
    wave += exp(-pow(r-wr,2.0)*1.7)*uWaves[i].z*max(0.0, 1.0-uWaves[i].y/3.5);
  }
  float dens = x*uDiskGain;
  float densAll = dens*(1.0+wave*1.4);
  vec3 tang = normalize(vec3(-pc.z, 0.0, pc.x));
  float dop = 1.0 - .62*dot(tang, -dir);   /* 亮侧在左,对齐参考影像 */
  float bright = min(pow(max(dop,.3), 3.0) * (R_IN*1.15/max(r,.5)), 4.5) * flick * streak * rings * (1.0+wave*2.2);
  /* Gargantua 分层色阶:白热内缘 → 奶油 → 琥珀 → 深橙棕 → 沉黑(四段过渡,参考图奶油白金调) */
  vec3 cin = mix(vec3(1.00,.99,.95), vec3(1.00,.87,.58), smoothstep(0.0,.10,rn));
  cin = mix(cin, vec3(0.99,.66,.30), smoothstep(.16,.42,rn));
  cin = mix(cin, vec3(.64,.30,.12), smoothstep(.40,.70,rn));
  cin = mix(cin, vec3(.18,.08,.04), smoothstep(.66,1.0,rn));
  vec3 cwh = mix(vec3(.99,.99,1.0), uColWhiteA, rn*.8);
  vec3 shift = mix(vec3(1.10,.90,.80), vec3(.97,1.00,1.05), clamp(dot(tang,-dir)*.5+.5, 0.0, 1.0));
  alpha = clamp(densAll*(0.55+streak*0.75), 0.0, 1.0)*mix(.85, 1.0, uWhite);
  return mix(cin, cwh, uWhite) * shift * densAll * bright * 1.45;
}
void main(){
  vec2 ndc = vUv*2.0-1.0;
  vec2 q0 = ndc;
  /* 引力波涟漪:屏幕空间环形扰动(非等比空间,与投放坐标一致) */
  for(int i=0;i<6;i++){
    vec4 rp = uRip[i];
    if(rp.w > .003){
      vec2 d = ndc - rp.xy; float ds = length(d)+1e-4;
      float ring = sin(ds*20.0-rp.z*8.0)*exp(-ds*3.2)*exp(-rp.z*2.0)*rp.w;
      ndc += (d/ds)*ring*.05;
    }
  }
  vec2 an = vec2(ndc.x*uAspect, ndc.y);
  /* 指针引力手势:局部时空放大 */
  vec2 pp = vec2(uPointer.x*uAspect, uPointer.y);
  vec2 dp = an - pp;
  an = mix(an, pp, exp(-dot(dp,dp)*2.5)*.13*uPointerK);
  an -= uCenterOff;                 /* 构图:奇点略高于画面中心(参考图) */
  vec3 rd = normalize(uCamF + uCamR*an.x*uTanFov + uCamU*an.y*uTanFov);
  vec3 p = uCamPos, v = rd;
  /* 像素级初始抖动:把体积采样的阶梯条带打散成细噪 */
  float jit = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898,78.233)))*43758.5453);
  p += v * jit * .18;
  vec3 cr0 = cross(p, v);
  float h2 = dot(cr0,cr0)*uLens*1.1;   /* 透镜略加强:参考图光弧更高地越过盘面 */
  float trans = 1.0, glow = 0.0, halo = 0.0;
  float pMin = length(uCamPos);      /* 射线近点:软边影 */
  vec3 acc = vec3(0.0);
  for(int i=0;i<260;i++){
    if(float(i) >= uSteps) break;
    float r2 = dot(p,p); float r = sqrt(r2);
    pMin = min(pMin, r);
    if(r < 1.02){ break; }
    if(r2 > 1200.0 && dot(p,v) > 0.0) break;
    /* 强场区小步长防隧穿;盘包围域内步长减半抗条带 */
    float inDisk = (r2 < 330.0 && abs(p.y) < 1.6) ? 1.0 : 0.0;
    float dt = clamp((r-.9)*.14, .018, .5);
    if(inDisk > .5) dt = min(dt, .18);
    float gd = (r-2.6)*4.5;                           /* 光子环:贴着阴影边缘的窄亮环 */
    glow = min(glow + dt*exp(-gd*gd), 1.8);
    float gd2 = (r-3.6)*.6;
    halo = min(halo + dt*exp(-gd2*gd2), 2.0);
    v += -1.5*h2*p/(r2*r2*r)*dt;
    vec3 pn = p + v*dt;
    /* 盘包围域内的体积大气:垂直高斯连续发光(纹理化噪声,大幅省算) */
    if(r2 < 330.0 && abs(p.y) < 1.6){
      float rr = r;
      if(rr > 1.9 && rr < R_OUT){
        float h2v = .05 + .008*rr;   /* Gargantua 化:剃刀薄盘,外缘更薄 */
        float yv = p.y/h2v;
        float body = smoothstep(1.9, R_IN+.6, rr)*(1.0-smoothstep(R_OUT-3.6, R_OUT, rr));
        float angA = atan(p.z, p.x);
        float wA = -uTime*1.9/pow(max(rr,1.0),1.5);
        float rnA = clamp((rr-R_IN)/(R_OUT-R_IN), 0., 1.);
        float nA = pow(clamp(texture2D(uDiskTex, vec2(fract((angA-wA)/TAU), rnA)).r
                  + (texture2D(uDiskTex, vec2(fract((angA-wA)/TAU), rnA)).g - .5)*.30*uWarpK, 0., 1.), 1.25);
        float densA = body*exp(-yv*yv)*(.15+.65*nA)*uDiskGain;
        /* 体积大气与盘面同一分层色阶(参考图配色) */
        vec3 cA = mix(vec3(1.00,.99,.95), vec3(1.00,.87,.58), smoothstep(0.0,.10,rnA));
        cA = mix(cA, vec3(0.99,.66,.30), smoothstep(.16,.42,rnA));
        cA = mix(cA, vec3(.64,.30,.12), smoothstep(.40,.70,rnA));
        cA = mix(cA, vec3(.18,.08,.04), smoothstep(.66,1.0,rnA));
        cA = mix(cA, vec3(1.0,.99,.94), pow(1.0-rnA,3.0)*.35);   /* 内缘白热(参考图标志) */
        cA = mix(cA, uColWhiteA, uWhite*.85);
        acc += cA * densA * dt * .40 * trans;
        /* 体积雾:比盘面高一个量级的软裙,给参考图的云雾光晕 */
        float yM = p.y / (h2v*(3.0 + 3.0*uMistH) + .22);
        float mistD = exp(-yM*yM) * body * (.06+.26*nA) * uMistK;
        vec3 cM = mix(vec3(.55,.34,.20), cA*.8, smoothstep(.10,.55,rnA));
        acc += cM * mistD * dt * .26 * trans;
        trans *= (1.0 - clamp(densA*dt*.7, 0.0, .5));
      }
    }
    if(p.y*pn.y < 0.0){
      float f = p.y/(p.y-pn.y);
      vec3 pc = mix(p, pn, f);
      float rc = length(pc);
      if(rc > R_IN && rc < R_OUT){
        float aA; vec3 dc = diskCol(pc, normalize(v), aA);
        acc += dc*trans;
        trans *= (1.0-aA*.9);
      }
    }
    float jr = length(p.xz);
    float jetA = atan(p.z, p.x);
    float jn = texture2D(uDiskTex, vec2(fract(jetA/TAU - uTime*.02), clamp(.5+p.y*.06,0.,1.))).r;
    float jet = exp(-jr*jr*1.4)*exp(-abs(p.y)*.28)*step(.7, abs(p.y));
    acc += uColWhiteA*(jet*(0.55+jn*.9)*uWhite)*dt*1.0;   /* 白洞双极喷流(湍流增艳) */
    if(uWhite > .01){                                      /* 白洞:周期性外扩冲击环 */
      float ringR = mod(uTime*1.8, 10.0);
      float shell = exp(-pow(r-ringR, 2.0)*5.0)*exp(-ringR*.2);
      acc += uColWhiteA*shell*uWhite*dt*.65;
    }
    if(trans < .04) break;                                 /* 已被盘完全不透明遮挡,省步数 */
    p = pn;
  }
  vec3 col = acc + background(normalize(v))*trans;
  /* 捕获分类:近点 < 光子球半径(≈1.5)的射线必然坠入;步数耗尽时 pMin 停在 1.0~1.5 也归入捕获 */
  float captured = 1.0 - smoothstep(1.02, 1.5, pMin);
  col = mix(col, vec3(0.0), captured*(1.0-uWhite));
  col += uColWhiteA*captured*uWhite*(.8 + .75*min(glow,1.4))*(1.0 - uTheme*.4);   /* 白洞亮核(浅色底下降亮) */
  float surv = 1.0 - captured*(1.0-uWhite);
  /* 光子环辉光降档:主体辉光交给真 Bloom 后期,着色器内只留窄核 */
  vec3 ringC = mix(mix(uColDiskA, vec3(1.0), .55), uColWhiteA, uWhite);   /* 光子环偏白:参考图贴阴影细亮环 */
  float ringOcc = clamp(trans*1.6, 0.0, 1.0);          /* 参考图:环的下半被盘面挡住,只留上弧 */
  col += ringC*(glow*.12 + glow*glow*.20)*ringOcc*(1.0+uFeedFlash*1.6)*uGlowK*surv;
  col += mix(uColDiskB*.7, uColWhiteA*.8, uWhite)*halo*.05*ringOcc*uGlowK*surv;
  col = 1.0 - exp(-col*uExpo);                        /* 曝光:提一档对比,亮部更白热 */
  col *= 1.0 - .34*pow(dot(q0,q0)*.55, 1.4);         /* 暗角 */
  gl_FragColor = vec4(col, 1.0);
}`;

/* ---------------- 页面编排:设置/HUD/交互 ---------------- */
const $ = s=>document.querySelector(s);
const KEY = "humanoid-abyss-settings-v1";
const DEFAULTS = { form:"auto", mode:"realistic", style:"amber", glow:100, lens:100, time:100,
  warp:100, mist:100, misth:100, star:100, expo:100, dist:173,
  parallax:true, drag:true, hum:false, clean:false, quality:"auto", panelOpen:false };
let settings = { ...DEFAULTS };
try{ Object.assign(settings, JSON.parse(localStorage.getItem(KEY)) || {}); }catch(e){}
settings.lens = clamp(settings.lens, 50, 150);   /* 旧存档兼容:透镜滑条上限已从 200 收到 150 */
const save = ()=>{ try{ localStorage.setItem(KEY, JSON.stringify(settings)); }catch(e){} };

let ABYSS = null, THREE_ = null;
let arcDark = false;          // 深色主题:白洞形态
let lastT = 0, running = true;
let camTarget = { r: 17.3, e: .055 };
const portraitFit = ()=> innerHeight > innerWidth ? 21 : 17.3;   /* 参考图构图:盘横贯出画,视界约占高三成 */
let userElev = 0;
let idleAcc = 0;
let emaDt = 16.7, lastTierSwitch = 0, upStreak = 0;   /* 帧时间滑动平均 → 自适应降/升档 */

function themeName(){ try{ return localStorage.getItem("site-theme") || "light"; }catch(e){ return "light"; } }
function applyTheme(){
  const t = themeName();
  arcDark = t === "dark";
  document.documentElement.setAttribute("data-theme", t);
  document.body.setAttribute("data-theme", t);
  $("#sgThemeBtn").textContent = t === "dark" ? "☀" : "☾";
  if(ABYSS) ABYSS.themeMixTarget = t === "light" ? 1 : 0;
  refreshWhite();
}
function refreshWhite(){
  if(!ABYSS) return;
  if(settings.form === "bh") ABYSS.whiteTarget = 0;
  else if(settings.form === "wh") ABYSS.whiteTarget = 1;
  else ABYSS.whiteTarget = arcDark ? 1 : 0;
}
function applyMode(){
  const field = settings.mode === "field";
  if(ABYSS) ABYSS.lineMixTarget = field ? 1 : 0;
  document.body.classList.toggle("sg-field", field);   /* 兜模式浅色主题下 HUD 才转墨色 */
  $("#sgGrpStyle").style.display = field ? "none" : "";
  $("#sgRowGlow").style.display = field ? "none" : "";
}
function applySettings(){
  if(!ABYSS) return;
  ABYSS.glowK = settings.glow/100;
  ABYSS.lens = settings.lens/100;
  ABYSS.timeScale = settings.time/100;
  ABYSS.warpK = settings.warp/100;
  ABYSS.mistK = settings.mist/100;
  ABYSS.mistH = settings.misth/100;
  ABYSS.starK = settings.star/100;
  ABYSS.expoK = settings.expo/100;
  ABYSS.parallax = settings.parallax;
  ABYSS.setStyle(settings.style);
  if(settings.quality !== "auto") ABYSS.setTier(settings.quality);
  document.body.classList.toggle("sg-clean", !!settings.clean);
  $("#sgPanel").classList.toggle("closed", !settings.panelOpen);
  applyMode();
  updateHum();
  refreshWhite();
  save();
}
function loop(t){
  requestAnimationFrame(loop);
  if(!running || !ABYSS) return;
  const dt = Math.min((t - lastT)/1000 || .016, .05); lastT = t;
  if(!isFinite(userElev)) userElev = 0;                 /* 防御:交互脏值自愈 */
  if(!isFinite(camTarget.r) || !isFinite(camTarget.e)) camTarget = { r: portraitFit(), e: .055 };
  emaDt += (dt*1000 - emaDt)*.05;                       /* 帧时间滑动平均 */
  ABYSS.cam.r += (camTarget.r - ABYSS.cam.r)*Math.min(1, dt*3);
  ABYSS.cam.elev += (camTarget.e + userElev - ABYSS.cam.elev)*Math.min(1, dt*3);
  ABYSS.idleNow = (idleAcc > 8 && !RM) ? 1 : 0;         /* 闲置 → 电影运镜 */
  ABYSS.frame(dt, t/1000);
  tickFps(t);
  if(humOn) humFrame();
  /* 闲置 5s:HUD 淡出 */
  idleAcc += dt;
  if(idleAcc > 5 && !document.body.classList.contains("sg-idle")) document.body.classList.add("sg-idle");
}

/* ---- FPS 表与自动画质 ---- */
let fpsN = 0, fpsT = 0, probe = { n:0, t:0, done:false };
function tickFps(t){
  fpsN++;
  if(!probe.done){ probe.n++;
    if(probe.n === 25) probe.t = t;                 /* 前 25 帧含着色器编译,不计入探测 */
    if(probe.n >= 115 && probe.t){
      probe.done = true;
      const fps = (probe.n - 25)/((t-probe.t)/1000);
      if(settings.quality === "auto"){
        const tier = fps > 48 ? "high" : fps > 28 ? "mid" : "low";
        ABYSS.setTier(tier);
      }
    }
  }
  if(t - fpsT > 600){
    $("#sgFps").textContent = Math.round(fpsN*1000/(t-fpsT)) + " FPS · " +
      (settings.quality === "auto" ? "自动·" : "") + (TIERS[ABYSS.tier]?.name || ABYSS.tier);
    fpsN = 0; fpsT = t;
    /* 帧时间自适应:带迟滞的降/升档(仅自动画质),升档需连续 3 次达标防抖 */
    if(settings.quality === "auto" && probe.done && t - lastTierSwitch > 5000){
      const order = ["low", "mid", "high"];
      const cur = order.indexOf(ABYSS.tier);
      if(emaDt > 24 && cur > 0){ ABYSS.setTier(order[cur-1]); lastTierSwitch = t; upStreak = 0; }
      else if(emaDt < 13 && cur < 2){
        if(++upStreak >= 3){ ABYSS.setTier(order[cur+1]); lastTierSwitch = t; upStreak = 0; }
      }else upStreak = 0;
    }
  }
}

/* ---- 低频嗡鸣:WebAudio 合成,零素材 ---- */
let humCtx = null, humOsc = null, humGain = null, humOn = false;
function updateHum(){
  const want = !!settings.hum;
  if(want && !humCtx){
    try{
      humCtx = new (window.AudioContext||window.webkitAudioContext)();
      humGain = humCtx.createGain(); humGain.gain.value = 0;
      const lp = humCtx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 220;
      humOsc = humCtx.createOscillator(); humOsc.type = "sine"; humOsc.frequency.value = 42;
      const o2 = humCtx.createOscillator(); o2.type = "sine"; o2.frequency.value = 43.6;
      humOsc.connect(lp); o2.connect(lp); lp.connect(humGain); humGain.connect(humCtx.destination);
      humOsc.start(); o2.start();
    }catch(e){ settings.hum = false; }
  }
  if(humCtx){
    if(humCtx.state === "suspended"){ var _rp = humCtx.resume(); if(_rp && _rp.catch) _rp.catch(function(){}); }   /* V2.1.14:自动播放策略拒绝时不抛未处理 rejection */
    humGain.gain.setTargetAtTime(want ? .05 : 0, humCtx.currentTime, .3);
  }
  humOn = want && !!humCtx;
}
function humFrame(){
  if(!humCtx) return;
  const prox = 1 - smoothstep(3.5, 15, ABYSS.cam.r);
  humGain.gain.setTargetAtTime(.03 + .06*prox, humCtx.currentTime, .2);
  humOsc.frequency.setTargetAtTime(42 - 14*prox, humCtx.currentTime, .25);
}

/* ---- 画布交互:拖拽环视 / 点击投放 / 指针手势 / 滚轮缩放 ---- */
function bindStage(canvas){
  let down = null, moved = 0, lastX = 0, lastY = 0, lastMoveT = 0, velX = 0;
  const toNDC = e=>({ x:(e.clientX/innerWidth)*2-1, y:1-(e.clientY/innerHeight)*2 });
  canvas.addEventListener("pointerdown", e=>{
    down = { x:e.clientX, y:e.clientY, t:performance.now() };
    moved = 0; velX = 0; lastX = e.clientX; lastY = e.clientY; lastMoveT = down.t;
    try{ canvas.setPointerCapture(e.pointerId); }catch(err){}   /* V2.1.14:极端时序下 pointerId 失效会抛 NotFoundError */
  });
  canvas.addEventListener("pointermove", e=>{
    const n = toNDC(e);
    ABYSS.ptr.x = n.x; ABYSS.ptr.y = n.y;
    ABYSS.ptr.kTarget = Math.min(1, ABYSS.ptr.kTarget + .06);
    if(!down) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    moved += Math.abs(dx) + Math.abs(dy);
    const now = performance.now(), mdt = Math.max(now - lastMoveT, 8);
    if(settings.drag){
      ABYSS.cam.azim -= dx*.005;
      userElev = clamp(userElev + dy*.0022, -.35, .35);
      velX = -dx/mdt;
    }
    lastX = e.clientX; lastY = e.clientY; lastMoveT = now;
  });
  const end = e=>{
    if(!down) return;
    const quick = performance.now() - down.t < 320 && moved < 7;
    if(quick){
      const n = toNDC(e);
      ABYSS.spawnRipple(n.x, n.y);
      ABYSS._pushWave();
      ABYSS.feedFlash = 1;                           /* 点击轻闪:涟漪 + 盘面密度波 */
      ABYSS.fovKick = Math.max(ABYSS.fovKick, .8);   /* 轻微吸入感 */
      if(!RM){ document.body.classList.remove("sg-shake"); void document.body.offsetWidth; document.body.classList.add("sg-shake"); }
    }else{
      ABYSS.cam.azimV = clamp(velX*.012, -.09, .09);
    }
    down = null;
  };
  canvas.addEventListener("pointerup", end);
  canvas.addEventListener("pointercancel", ()=>{ down = null; });
  canvas.addEventListener("wheel", e=>{
    e.preventDefault();
    camTarget.r = clamp(camTarget.r*(1 + e.deltaY*.001), 4.5, 26);
  }, { passive:false });
}
/* ---- 面板 / HUD 绑定 ---- */
function bindUI(canvas){
  const panel = $("#sgPanel");
  $("#sgFab").addEventListener("click", ()=>{
    if(settings.clean){
      settings.clean = false;
      document.body.classList.remove("sg-clean");
      document.querySelectorAll('.sg-tgl[data-k="clean"]').forEach(t=>t.classList.remove("on"));
    }
    settings.panelOpen = true;
    panel.classList.remove("closed");
    save();
  });
  $("#sgCollapse").addEventListener("click", ()=>{
    settings.panelOpen = false;
    panel.classList.add("closed");
    save();
  });
  document.querySelectorAll(".sg-seg").forEach(seg=>{
    seg.addEventListener("click", e=>{
      const b = e.target.closest("button"); if(!b) return;
      seg.querySelectorAll("button").forEach(x=>x.classList.toggle("on", x===b));
      const k = seg.dataset.k, v = b.dataset.v;
      if(k === "form"){ settings.form = v; refreshWhite(); }
      else if(k === "quality"){ settings.quality = v; if(v !== "auto") ABYSS.setTier(v); }
      else if(k === "mode"){
        settings.mode = v;
        if(v === "field"){                        /* 兜要俯视才看得到:切到偏高机位 */
          camTarget.e = .5;
          userElev = Math.min(userElev, .12);
        }else{
          camTarget.e = .055;
        }
        applyMode();
      }
      else settings[k] = v;
      save();
    });
  });
  document.querySelectorAll(".sg-tgl").forEach(tg=>{
    tg.addEventListener("click", ()=>{
      const k = tg.dataset.k;
      settings[k] = !settings[k];
      tg.classList.toggle("on", settings[k]);
      if(k === "clean") document.body.classList.toggle("sg-clean", settings.clean);
      if(k === "hum") updateHum();
      save();
    });
  });
  document.querySelectorAll("input[type=range]").forEach(inp=>{
    inp.addEventListener("input", ()=>{
      const k = inp.dataset.k;
      settings[k] = +inp.value;
      document.querySelector(`output[data-o="${k}"]`).textContent = inp.value + (k === "dist" ? "" : "%");
      if(k === "time") ABYSS.timeScale = settings.time/100;
      if(k === "lens") ABYSS.lens = settings.lens/100;
      if(k === "glow") ABYSS.glowK = settings.glow/100;
      if(k === "warp") ABYSS.warpK = settings.warp/100;
      if(k === "mist") ABYSS.mistK = settings.mist/100;
      if(k === "misth") ABYSS.mistH = settings.misth/100;
      if(k === "star") ABYSS.starK = settings.star/100;
      if(k === "expo") ABYSS.expoK = settings.expo/100;
      if(k === "dist") camTarget.r = settings.dist/10;
      save();
    });
  });
  $("#sgReset").addEventListener("click", ()=>{
    settings = { ...DEFAULTS };
    save();
    location.reload();
  });
  /* 初始控件状态回填 */
  document.querySelectorAll(".sg-seg").forEach(seg=>{
    seg.querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.v === String(settings[seg.dataset.k])));
  });
  document.querySelectorAll(".sg-tgl").forEach(tg=>tg.classList.toggle("on", !!settings[tg.dataset.k]));
  document.querySelectorAll("input[type=range]").forEach(inp=>{
    inp.value = settings[inp.dataset.k];
    document.querySelector(`output[data-o="${inp.dataset.k}"]`).textContent = settings[inp.dataset.k] + (inp.dataset.k === "dist" ? "" : "%");
  });
  /* 主题切换(写全站键,其他页面同步) */
  $("#sgThemeBtn").addEventListener("click", ()=>{
    const t = themeName() === "dark" ? "light" : "dark";
    try{ localStorage.setItem("site-theme", t); }catch(e){}
    applyTheme();
  });
  addEventListener("storage", e=>{ if(e.key === "site-theme") applyTheme(); });
  /* 键盘:H 纯净 / 空格 凝固 / R 复位 */
  addEventListener("keydown", e=>{
    if(e.target.tagName === "INPUT") return;
    if(e.key === "h" || e.key === "H"){
      settings.clean = !settings.clean;
      document.body.classList.toggle("sg-clean", settings.clean);
      document.querySelectorAll('.sg-tgl[data-k="clean"]').forEach(t=>t.classList.toggle("on", settings.clean));
      save();
    }
    if(e.code === "Space"){ e.preventDefault(); ABYSS.timeScale = ABYSS.timeScale === 0 ? (settings.time/100 || 1) : 0; }
    if(e.key === "r" || e.key === "R"){ userElev = 0; ABYSS.cam.azimV = 0; camTarget = { r: portraitFit(), e: .055 }; ABYSS.cam.azim = .6; }
    if(e.key === "Escape"){ settings.panelOpen = false; panel.classList.add("closed"); save(); }
  });
  /* 闲置检测:任何输入唤醒 HUD */
  ["pointermove","pointerdown","keydown","wheel"].forEach(ev=>
    addEventListener(ev, ()=>{ idleAcc = 0; document.body.classList.remove("sg-idle"); }, { passive:true }));
  /* 离屏暂停(站内纪律) */
  document.addEventListener("visibilitychange", ()=>{
    running = !document.hidden;
    if(running){ lastT = performance.now(); }
  });
  bindStage(canvas);
}

/* ---- 启动 ---- */
async function boot(){
  const canvas = $("#sgStage");
  let T = null;
  try{ T = await OrbitKit.loadThree($("#sgLoadTxt")); }
  catch(e){
    $("#sgLoader").classList.add("hide");
    $("#sgFail").style.display = "block";
    return;
  }
  THREE_ = T;
  try{ ABYSS = new Abyss(canvas, T); }
  catch(e){
    $("#sgLoader").classList.add("hide");
    $("#sgFail").style.display = "block";
    return;
  }
  window.ABYSS = ABYSS;   /* ← API 边界:未来提取 abyss.js 后由首页以低强度待机模式复用 */
  applyTheme();
  applySettings();
  if(innerWidth < 700){   /* 小屏默认收回控制台(不写入记忆,桌面端不受影响) */
    $("#sgPanel").classList.add("closed");
  }
  camTarget.r = portraitFit();
  ABYSS.cam.r = camTarget.r;
  bindUI(canvas);
  $("#sgLoader").classList.add("hide");
  lastT = performance.now();
  requestAnimationFrame(loop);
}
boot();
</script>
