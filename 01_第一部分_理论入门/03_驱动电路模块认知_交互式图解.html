let activeModule = null;

function showDetail(id) {
  // 移除之前的active
  if (activeModule) {
    document.getElementById('mod-' + activeModule).classList.remove('active');
  }
  activeModule = id;
  document.getElementById('mod-' + id).classList.add('active');
  
  const data = moduleData[id];
  const panel = document.getElementById('detailPanel');
  
  let chipsHtml = data.chips.map(c => `
    <div class="chip-item">
      <div class="chip-name">${c.name}</div>
      <div class="chip-desc">${c.desc}</div>
    </div>
  `).join('');
  
  let keyPointsHtml = data.keyPoints.map(k => `<li>${k}</li>`).join('');
  
  let linksHtml = data.links && data.links.length > 0 
    ? data.links.map(l => `<a class="link-item" href="${l.url}" target="_blank"><span class="link-type">${l.type}</span>${l.text}</a>`).join('')
    : '<div style="font-size:12px;color:#64748b;padding:8px 0">暂无专题参考链接，查看参考资料库页面获取更多资源</div>';
  
  let tagsHtml = data.tags.map((t, i) => `<span class="tag ${t}">${data.tagLabels[i]}</span>`).join('');
  
  // 参数表格
  let paramsHtml = '';
  if (data.params && data.params.length > 1) {
    let rows = data.params.map((row, idx) => {
      if (idx === 0) {
        return `<tr>${row.map(c => `<th>${c}</th>`).join('')}</tr>`;
      }
      return `<tr>${row.map(c => `<td>${c}</td>`).join('')}</tr>`;
