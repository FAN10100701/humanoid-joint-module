<style>

}

  font-size:10px;font-weight:700;color:var(--dim);text-transform:uppercase;

}

}
.nav-item:hover{background:var(--bg3);color:var(--text);}
.nav-item.on{
  background:var(--accent-g);color:var(--accent2);font-weight:600;
}
.nav-item.on::before{
  content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);

}

  font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;
  background:var(--bg4);color:var(--dim);flex-shrink:0;
}
.nav-item.on .tag{background:var(--accent);color:#fff;}
.nav-item.hot .tag{background:var(--orange);color:#000;}
.nav-item.new .tag{background:var(--green);color:#000;}

.sidebar-footer{padding:12px;border-top:1px solid var(--border);margin-top:auto;}
.sys-info{font-size:10px;color:var(--dim);line-height:1.6;}
.sys-info b{color:var(--muted);font-weight:600;}

/* ===== 内容区域 ===== */
.content{flex:1;position:relative;overflow:hidden;background:var(--bg);}
.content iframe{
  width:100%;height:100%;border:none;position:absolute;inset:0;
  background:var(--bg);
}
.welcome{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:40px;text-align:center;
}
.welcome.hidden{display:none;}
.welcome .hero-icon{
  width:80px;height:80px;border-radius:20px;
  background:linear-gradient(135deg,var(--accent),var(--purple));
  display:flex;align-items:center;justify-content:center;font-size:40px;margin-bottom:20px;
  box-shadow:0 12px 40px rgba(59,130,246,.3);
}
.welcome h1{font-size:28px;font-weight:800;margin-bottom:8px;background:linear-gradient(135deg,#fff,var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.welcome p{color:var(--muted);font-size:14px;max-width:500px;line-height:1.7;margin-bottom:24px;}
.welcome .quick-links{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.ql-btn{
  padding:10px 20px;border-radius:10px;border:1px solid var(--border);
  background:var(--bg2);color:var(--text);font-size:13px;font-weight:600;
  cursor:pointer;transition:.15s;font-family:inherit;display:flex;align-items:center;gap:8px;
}
.ql-btn:hover{border-color:var(--accent);background:var(--accent-g);color:var(--accent2);transform:translateY(-2px);box-shadow:var(--shadow);}
.ql-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.ql-btn.primary:hover{background:var(--accent2);}

/* 加载提示 */
.loading{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  display:none;flex-direction:column;align-items:center;gap:12px;color:var(--muted);font-size:13px;
}
.loading.show{display:flex;}
.spinner{
  width:36px;height:36px;border:3px solid var(--bg4);border-top-color:var(--accent);
  border-radius:50%;animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* ===== 底部状态栏 ===== */
.footer{
  height:28px;background:var(--bg2);border-top:1px solid var(--border);
  display:flex;align-items:center;padding:0 14px;gap:16px;font-size:11px;color:var(--dim);flex-shrink:0;
}
.footer .item{display:flex;align-items:center;gap:5px;}
.footer .item b{color:var(--muted);font-weight:600;}
.footer .sep{width:1px;height:14px;background:var(--border);}
.footer-right{margin-left:auto;display:flex;gap:12px;}

/* 响应式 */
@media(max-width:768px){
  .sidebar{position:fixed;left:0;top:52px;bottom:28px;width:200px;z-index:50;transform:translateX(-100%);transition:transform .25s;}
  .sidebar.open{transform:translateX(0);}
  .model-switch{display:none;}
}
</style>
</head>
<body>

<div class="header">

<div class="app">
  <nav class="sidebar" id="sidebar">
    <!-- 导航由JS动态生成 -->
    <div class="sidebar-footer">

        <b>💡 使用说明</b><br>
        双击本文件即可直接打开，无需启动服务器。<br>

        所有页面均可离线使用（除3D页面首次加载外）。
      </div>
    </div>
  </nav>

  <main class="content" id="content">
    <div class="welcome" id="welcome">
      <div class="hero-icon">🎓</div>
      <h1>欢迎使用关节模组教学系统</h1>
      <p>从零基础到独立画板，系统学习人形机器人关节伺服驱动器的完整知识体系。左侧选择模块开始学习，建议按顺序进行。</p>
      <div class="quick-links">
        <button class="ql-btn primary" data-nav="3d">🧊 开始：3D解剖可视化</button>
        <button class="ql-btn" data-nav="mindmap">🗺️ 知识框架</button>
        <button class="ql-btn" data-nav="anim">🎬 原理动画</button>
      </div>

    <div class="loading" id="loading"><div class="spinner"></div><span>加载中...</span></div>
    <iframe id="mainFrame" style="display:none;"></iframe>
  </main>
</div>

<div class="footer">
  <div class="item">📄 当前页面：<b id="curPage">欢迎页</b></div>
  <div class="sep"></div>
  <div class="item">📦 包含 <b>10</b> 个教学模块</div>
  <div class="footer-right">
    <div class="item">✅ 支持双击直接打开（无需服务器）</div>
    <div class="sep"></div>
    <div class="item">🔄 换电脑拷贝整个文件夹即可运行</div>
  </div>
</div>

<script>
/* ========== 页面导航配置 ========== */
var PAGES=[
  {group:'核心入口',num:'0',items:[
    {id:'3d',name:'3D解剖式知识可视化',ic:'🧊',path:'00_解剖式知识可视化/人形机器人解剖式知识可视化.html',tag:'核心',hot:true,desc:'交互式3D机器人模型，点击任意部件查看详细技术参数与原理'},
  ]},
  {group:'第一部分：理论入门',num:'1',items:[
    {id:'mindmap',name:'整体知识框架·思维导图',ic:'🗺️',path:'01_第一部分_理论入门/01_整体知识框架_思维导图.html',tag:'导图',desc:'全局知识体系梳理'},
    {id:'anim',name:'核心原理动画演示',ic:'🎬',path:'01_第一部分_理论入门/02_核心原理动画演示_FOC_三环_减速器.html',tag:'动画',desc:'FOC、三环控制、减速器原理动画'},
    {id:'circuit',name:'驱动电路模块认知',ic:'⚡',path:'01_第一部分_理论入门/03_驱动电路模块认知_交互式图解.html',tag:'电路',desc:'交互式电路模块图解'},
  ]},
  {group:'第二部分：硬件基础',num:'2',items:[
    {id:'pitfalls',name:'硬件设计避坑指南',ic:'⚠️',path:'02_第二部分_硬件基础/04_硬件设计通用要点_避坑指南.html',tag:'必看',hot:true,desc:'硬件设计常见坑点与经验总结'},
    {id:'refs',name:'参考资料汇总',ic:'📚',path:'02_第二部分_硬件基础/05_参考资料汇总_视频_开源项目.html',tag:'资料',desc:'视频教程、开源项目、数据手册汇总'},
  ]},
  {group:'第三部分：项目实操',num:'3',items:[
    {id:'hdrive',name:'Hdrive融合方案指南',ic:'🔧',path:'03_第三部分_项目实操/06_本次项目核心_Hdrive融合方案完整指南.html',tag:'方案',new:true,desc:'本次项目核心方案完整指南'},
    {id:'lceda',name:'立创EDA逐模块绘制',ic:'📐',path:'03_第三部分_项目实操/07_立创EDA逐模块绘制步骤.html',tag:'实操',desc:'手把手教你在立创EDA中绘制驱动板'},
    {id:'manual',name:'完整学习手册',ic:'📖',path:'03_第三部分_项目实操/08_完整学习手册_备查用.html',tag:'手册',desc:'备查用完整学习手册（八大章节完整排版）'},
  ]},
  {group:'第四部分：升级进阶',num:'4',items:[
    {id:'advanced',name:'通信与控制算法升级',ic:'🚀',path:'04_第四部分_升级进阶/09_通信与控制算法升级路线.html',tag:'进阶',desc:'EtherCAT总线、MPC、ADRC等高级算法路线'},
  ]},
];

var sidebar=document.getElementById('sidebar');
var mainFrame=document.getElementById('mainFrame');
var welcome=document.getElementById('welcome');
var loading=document.getElementById('loading');
var curPage=document.getElementById('curPage');
var statusText=document.getElementById('statusText');
var currentPageId=null;

/* 颜色表 */
var GROUP_COLORS=['#3b82f6','#10b981','#f59e0b','#ef4444','#a371f7','#39d2c0'];

/* 渲染导航 */
function renderNav(){
  var html='';
  PAGES.forEach(function(grp,gi){
    var color=GROUP_COLORS[gi%GROUP_COLORS.length];
    html+='<div class="nav-group">';
    html+='<div class="nav-group-title"><span class="num" style="background:'+color+'">'+grp.num+'</span>'+grp.group+'</div>';
    grp.items.forEach(function(item){
      var cls='nav-item';
      if(item.hot)cls+=' hot';
      if(item.new)cls+=' new';
      html+='<div class="'+cls+'" data-id="'+item.id+'" title="'+(item.desc||item.name)+'">';
      html+='<span class="ic">'+item.ic+'</span>';
      html+='<span class="lbl">'+item.name+'</span>';
      if(item.tag)html+='<span class="tag">'+item.tag+'</span>';
      html+='</div>';
    });
    html+='</div>';
  });
  /* 插入到footer之前 */
  var footer=sidebar.querySelector('.sidebar-footer');
  sidebar.insertBefore(document.createRange().createContextualFragment(html),footer);

  /* 绑定点击 */
  sidebar.querySelectorAll('.nav-item').forEach(function(el){
    el.addEventListener('click',function(){
      navigateTo(el.dataset.id);
    });
  });
}

/* 查找页面配置 */
function findPage(id){
  for(var g=0;g<PAGES.length;g++){
    for(var i=0;i<PAGES[g].items.length;i++){
      if(PAGES[g].items[i].id===id)return PAGES[g].items[i];
    }
  }
  return null;
}

/* 导航到指定页面 */
function navigateTo(id){
  var page=findPage(id);
  if(!page)return;
  currentPageId=id;

  /* 更新导航高亮 */
  sidebar.querySelectorAll('.nav-item').forEach(function(el){
    el.classList.toggle('on',el.dataset.id===id);
  });

  /* 显示加载态 */
  welcome.classList.add('hidden');
  loading.classList.add('show');
  mainFrame.style.display='none';
  curPage.textContent=page.name;
  statusText.textContent='加载中...';

  /* 加载iframe */
  mainFrame.src=page.path;
  mainFrame.onload=function(){
    loading.classList.remove('show');
    mainFrame.style.display='block';
    statusText.textContent='就绪';
  };
  mainFrame.onerror=function(){
    loading.classList.remove('show');
    statusText.textContent='加载失败';
  };

  /* 超时处理（3秒后强制显示，避免loading一直转） */
  setTimeout(function(){
    if(loading.classList.contains('show')){
      loading.classList.remove('show');
      mainFrame.style.display='block';
    }
  },5000);
}

/* 返回首页 */
document.getElementById('btnHome').addEventListener('click',function(){
  currentPageId=null;
  sidebar.querySelectorAll('.nav-item').forEach(function(el){el.classList.remove('on');});
  mainFrame.style.display='none';
  mainFrame.src='';
  welcome.classList.remove('hidden');
  loading.classList.remove('show');
  curPage.textContent='欢迎页';
  statusText.textContent='就绪';
});

/* 刷新 */
document.getElementById('btnRefresh').addEventListener('click',function(){
  if(currentPageId){
    navigateTo(currentPageId);
  }
});

/* 新窗口打开 */
document.getElementById('btnOpenNew').addEventListener('click',function(){
  var page=findPage(currentPageId);
  if(page){
    window.open(page.path,'_blank');
  }
});

/* 快捷入口按钮 */
document.querySelectorAll('.ql-btn').forEach(function(btn){
  btn.addEventListener('click',function(){
    navigateTo(btn.dataset.nav);
  });
});

/* 机型切换按钮（目前仅作为视觉标记，后续可联动3D页面） */
document.querySelectorAll('.model-switch button').forEach(function(btn){
  btn.addEventListener('click',function(){
    document.querySelectorAll('.model-switch button').forEach(function(b){b.classList.remove('on');});
    btn.classList.add('on');
  });
});

/* 初始化 */
renderNav();

/* 自动检测file://协议并提示 */
if(location.protocol==='file:'){
  console.log('[教学系统] 运行在file://协议下，双击直接打开模式');
}
</script>
</body>
</html>
