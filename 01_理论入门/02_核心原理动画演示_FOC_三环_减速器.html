// ================= 绘图函数 =================

function drawStructure(t) {
  const W = canvas.width, H = canvas.height;
  const cy = H / 2;
  ctx.clearRect(0,0,W,H);

  // 背景网格
  ctx.strokeStyle = '#1e3a5f';
  ctx.lineWidth = 0.5;
  for (let x=0;x<W;x+=30) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y=0;y<H;y+=30) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  const motorAngle = t * 8; // 电机高速旋转
  const outputAngle = t * 8 / 100; // 输出端低速旋转

  // 外壳
  ctx.fillStyle = '#1e293b';
  ctx.strokeStyle = '#475569';
  ctx.lineWidth = 2;
  roundRect(ctx, 80, cy-110, 780, 220, 16);
  ctx.fill(); ctx.stroke();

  // 标签
  ctx.fillStyle = '#64748b';
  ctx.font = '11px Consolas';
  const labels = [['电机端编码器', 140], ['无框力矩电机', 300], ['谐波减速器', 490], ['输出编码器', 640], ['输出法兰', 740], ['抱闸', 810]];
  labels.forEach(([l,x]) => {
    ctx.fillText(l, x-30, cy-125);
    ctx.beginPath(); ctx.moveTo(x, cy-118); ctx.lineTo(x, cy-110); ctx.strokeStyle='#475569'; ctx.stroke();
  });

  // === 电机端编码器（绿色）===
  ctx.fillStyle = '#065f46';
  ctx.beginPath(); ctx.arc(140, cy, 25, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#10b981'; ctx.lineWidth=2; ctx.stroke();
  // 编码器码盘线
  ctx.save(); ctx.translate(140,cy); ctx.rotate(motorAngle);
  ctx.strokeStyle = '#34d399'; ctx.lineWidth=1.5;
  for (let i=0;i<12;i++) {
    const a = i * Math.PI/6;
    ctx.beginPath(); ctx.moveTo(Math.cos(a)*10, Math.sin(a)*10); ctx.lineTo(Math.cos(a)*20, Math.sin(a)*20); ctx.stroke();
  }
  ctx.restore();

  // === 无框力矩电机 ===
  // 定子（红色外圈）
  ctx.fillStyle = '#7f1d1d';
  ctx.beginPath(); ctx.arc(300, cy, 70, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#ef4444'; ctx.lineWidth=3; ctx.stroke();
  // 定子齿
  ctx.strokeStyle = '#fca5a5'; ctx.lineWidth=2;
  for (let i=0;i<12;i++) {
    const a = i * Math.PI/6;
    ctx.beginPath();
    ctx.moveTo(300+Math.cos(a)*55, cy+Math.sin(a)*55);
    ctx.lineTo(300+Math.cos(a)*68, cy+Math.sin(a)*68);
    ctx.stroke();
  }
  // 转子（红色内圈，永磁体）
  ctx.save(); ctx.translate(300,cy); ctx.rotate(motorAngle);
  ctx.fillStyle = '#dc2626';
  ctx.beginPath(); ctx.arc(0,0,45,0,Math.PI*2); ctx.fill();
  // N/S极标识
  for (let i=0;i<8;i++) {
    const a = i * Math.PI/4;
    ctx.fillStyle = i%2===0 ? '#fca5a5' : '#991b1b';
    ctx.beginPath(); ctx.arc(Math.cos(a)*35, Math.sin(a)*35, 10, 0, Math.PI*2); ctx.fill();
  }
  // 旋转箭头
  ctx.strokeStyle = '#fbbf24'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(0,0,55,0,Math.PI*1.5); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(55,0); ctx.lineTo(48,-8); ctx.lineTo(48,8); ctx.closePath();
  ctx.fillStyle = '#fbbf24'; ctx.fill();
  ctx.restore();

  // 电机到减速器 传动轴
  ctx.fillStyle = '#475569';
  ctx.fillRect(370, cy-8, 75, 16);

  // === 驱动板（蓝色，位于电机下方，环绕/紧贴电机布置）===
  ctx.fillStyle = '#1e3a5f';
  roundRect(ctx, 245, cy+95, 110, 50, 8);
  ctx.fill();
  ctx.strokeStyle = '#60a5fa'; ctx.lineWidth=2; ctx.stroke();
  ctx.fillStyle = '#93c5fd'; ctx.font='11px sans-serif'; ctx.textAlign='center';
  ctx.fillText('驱动板', 300, cy+115);
  ctx.fillText('FOC·PWM·采样', 300, cy+132);
  // 驱动板到电机的连接线（中空走线示意）
  ctx.strokeStyle = '#60a5fa'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(300, cy+70); ctx.lineTo(300, cy+95); ctx.stroke();

  // === 谐波减速器（橙色）===
  ctx.fillStyle = '#7c2d12';
  ctx.beginPath(); ctx.arc(490, cy, 60, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#f97316'; ctx.lineWidth=3; ctx.stroke();
  // 刚轮（外圈固定）
  ctx.strokeStyle = '#3b82f6'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(490, cy, 55, 0, Math.PI*2); ctx.stroke();
  // 柔轮（椭圆形，随波发生器旋转）
  ctx.save(); ctx.translate(490,cy); ctx.rotate(motorAngle*0.3);
  ctx.fillStyle = 'rgba(249,115,22,0.5)';
  ctx.beginPath(); ctx.ellipse(0,0,48,35,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#fdba74'; ctx.lineWidth=2; ctx.stroke();
  // 波发生器（内部椭圆高速旋转）
  ctx.save(); ctx.rotate(motorAngle);
  ctx.fillStyle = '#ef4444';
  ctx.beginPath(); ctx.ellipse(0,0,30,20,0,0,Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.restore();

  // === 输出端编码器（绿色）===
  ctx.fillStyle = '#065f46';
  ctx.beginPath(); ctx.arc(640, cy, 22, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#10b981'; ctx.lineWidth=2; ctx.stroke();
  ctx.save(); ctx.translate(640,cy); ctx.rotate(outputAngle);
  ctx.strokeStyle = '#34d399'; ctx.lineWidth=1.5;
  for (let i=0;i<8;i++) {
    const a = i * Math.PI/4;
    ctx.beginPath(); ctx.moveTo(Math.cos(a)*8, Math.sin(a)*8); ctx.lineTo(Math.cos(a)*18, Math.sin(a)*18); ctx.stroke();
  }
  ctx.restore();

  // === 输出法兰（蓝色）===
  ctx.save(); ctx.translate(740,cy); ctx.rotate(outputAngle);
  ctx.fillStyle = '#1e40af';
  ctx.beginPath(); ctx.arc(0,0,40,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#3b82f6'; ctx.lineWidth=3; ctx.stroke();
  // 安装孔
  ctx.fillStyle = '#60a5fa';
  for (let i=0;i<6;i++) {
    const a = i * Math.PI/3;
    ctx.beginPath(); ctx.arc(Math.cos(a)*28, Math.sin(a)*28, 5, 0, Math.PI*2); ctx.fill();
  }
  // 输出轴
  ctx.fillStyle = '#93c5fd';
  ctx.fillRect(40, -8, 30, 16);
  ctx.restore();

  // === 制动器（紫色）===
  ctx.fillStyle = '#4c1d95';
  roundRect(ctx, 785, cy-35, 35, 70, 4);
  ctx.fill();
  ctx.strokeStyle = '#8b5cf6'; ctx.lineWidth=2; ctx.stroke();
  // 制动片
  ctx.fillStyle = '#a78bfa';
  ctx.fillRect(790, cy-25+Math.sin(t*3)*5, 25, 8);
  ctx.fillRect(790, cy+17-Math.sin(t*3)*5, 25, 8);
}

function drawFOC(t) {
  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2;
  ctx.clearRect(0,0,W,H);

  // 背景
  ctx.strokeStyle = '#1e3a5f'; ctx.lineWidth = 0.5;
  for (let x=0;x<W;x+=30) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y=0;y<H;y+=30) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  const theta = t * 2; // 转子电角度
  // 绘制电机截面（定子+三相绕组+转子）
  const R = 130;
  // 定子外圈
  ctx.fillStyle = '#1e293b';
  ctx.beginPath(); ctx.arc(cx-180, cy, R, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#475569'; ctx.lineWidth=3; ctx.stroke();
  // 三相绕组
  const phases = [
    {angle: 0, color: '#ef4444', name: 'A', current: Math.sin(theta)},
    {angle: Math.PI*2/3, color: '#10b981', name: 'B', current: Math.sin(theta - Math.PI*2/3)},
    {angle: Math.PI*4/3, color: '#3b82f6', name: 'C', current: Math.sin(theta - Math.PI*4/3)}
  ];
  phases.forEach(p => {
    const x = cx-180 + Math.cos(p.angle)*(R-25);
    const y = cy + Math.sin(p.angle)*(R-25);
    // 绕组线圈
    ctx.fillStyle = p.color;
    ctx.globalAlpha = 0.4 + 0.5*Math.abs(p.current);
    ctx.beginPath(); ctx.arc(x, y, 18+10*Math.abs(p.current), 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = p.color; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font='bold 14px sans-serif'; ctx.textAlign='center';
    ctx.fillText(p.name, x, y+5);
  });
  // 转子（永磁体）
  ctx.save(); ctx.translate(cx-180, cy); ctx.rotate(theta);
  // N极（黄色）
  ctx.fillStyle = '#fbbf24';
  ctx.beginPath(); ctx.arc(0,0,45,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#1e293b'; ctx.font='bold 16px sans-serif'; ctx.textAlign='center';
  ctx.fillText('N', 0, -20); ctx.fillText('S', 0, 28);
  // 磁场方向箭头
  ctx.strokeStyle = '#fbbf24'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(0,-55); ctx.lineTo(0,-75); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,-75); ctx.lineTo(-6,-67); ctx.lineTo(6,-67); ctx.closePath();
  ctx.fillStyle='#fbbf24'; ctx.fill();
  ctx.restore();

  // 右侧：波形图
  const waveX = cx + 100, waveY = cy-80, waveW = 280, waveH = 160;
  ctx.fillStyle = 'rgba(15,23,42,0.8)';
  roundRect(ctx, waveX-10, waveY-10, waveW+20, waveH+50, 8); ctx.fill();
  ctx.strokeStyle = '#334155'; ctx.lineWidth=1; ctx.stroke();
  // 坐标轴
  ctx.strokeStyle = '#475569'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(waveX, waveY+waveH/2); ctx.lineTo(waveX+waveW, waveY+waveH/2); ctx.stroke();
  // 三相电流波形
  const waveOffset = t * 0.8;
  phases.forEach(p => {
    ctx.strokeStyle = p.color; ctx.lineWidth=2;
    ctx.beginPath();
    for (let i=0;i<waveW;i++) {
      const val = Math.sin(i*0.03 - waveOffset - p.angle);
      const y = waveY + waveH/2 - val * (waveH/2 - 10);
      if (i===0) ctx.moveTo(waveX+i, y); else ctx.lineTo(waveX+i, y);
    }
    ctx.stroke();
    ctx.fillStyle = p.color; ctx.font='12px sans-serif'; ctx.textAlign='left';
    ctx.fillText('I'+p.name, waveX+waveW-30, waveY+waveH+20+phases.indexOf(p)*16);
  });
  ctx.fillStyle='#94a3b8'; ctx.font='11px sans-serif';
  ctx.fillText('三相正弦电流波形', waveX, waveY-5);

  // d/q 坐标系图示
  const dqX = cx + 100, dqY = cy + 110;
  ctx.fillStyle = 'rgba(15,23,42,0.8)';
  roundRect(ctx, dqX-10, dqY-60, 280, 90, 8); ctx.fill();
  ctx.strokeStyle = '#334155'; ctx.stroke();
  ctx.save(); ctx.translate(dqX+80, dqY); ctx.rotate(theta);
  // d轴（直轴-沿转子磁场方向）
  ctx.strokeStyle = '#f59e0b'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(-40,0); ctx.lineTo(40,0); ctx.stroke();
  ctx.fillStyle='#f59e0b'; ctx.font='bold 12px sans-serif'; ctx.textAlign='center';
  ctx.fillText('d轴(Id=0)', 0, -8);
  // q轴（交轴-垂直d轴，产生力矩）
  ctx.strokeStyle = '#10b981'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,-40); ctx.lineTo(0,40); ctx.stroke();
  ctx.fillStyle='#10b981';
  ctx.fillText('q轴(Iq)', -20, 30);
  // 电流矢量（沿q轴）
  ctx.strokeStyle = '#ef4444'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-35); ctx.stroke();
  ctx.beginPath(); ctx.arc(0,-35,4,0,Math.PI*2); ctx.fillStyle='#ef4444'; ctx.fill();
  ctx.restore();
  ctx.fillStyle='#94a3b8'; ctx.font='11px sans-serif'; ctx.textAlign='left';
  ctx.fillText('d/q旋转坐标系', dqX+140, dqY-40);
  ctx.fillStyle='#10b981'; ctx.font='12px sans-serif';
  ctx.fillText('● Iq=5A (产生力矩)', dqX+140, dqY-20);
  ctx.fillStyle='#f59e0b';
  ctx.fillText('● Id=0A (去磁/弱磁)', dqX+140, dqY-5);

  // 更新数值
  const angleDeg = ((theta * 180/Math.PI) % 360).toFixed(0);
  const ea = document.getElementById('elecAngle');
  if (ea) ea.textContent = angleDeg + '°';
}

function drawThreeLoop(t) {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle = '#1e3a5f'; ctx.lineWidth = 0.5;
  for (let x=0;x<W;x+=30) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y=0;y<H;y+=30) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  // 三环框图
  const cy = H/2;
  const blockW = 110, blockH = 55;

  // 输入：位置指令
  drawBlock(50, cy-130, blockW, blockH, '#1e3a8a', '#3b82f6', '位置指令\nθ*', '#fff');

  // 位置环
  drawBlock(220, cy-130, blockW, blockH, '#1e3a8a', '#3b82f6', '位置环\nPID', '#fff');

  // 速度环
  drawBlock(420, cy-130, blockW, blockH, '#78350f', '#f59e0b', '速度环\nPID', '#fff');

  // 电流环
  drawBlock(620, cy-130, blockW, blockH, '#7f1d1d', '#ef4444', '电流环\nPID+FOC', '#fff');

  // 电机/关节
  drawBlock(780, cy-130, 100, blockH, '#064e3b', '#10b981', '关节\n电机', '#fff');

  // 输出
  drawBlock(900-20, cy-130, blockW-20, blockH, '#1e3a8a', '#3b82f6', '输出\nθ/ω/I', '#fff');

  // 连线
  ctx.strokeStyle = '#94a3b8'; ctx.lineWidth=2; ctx.setLineDash([]);
  drawArrow(160, cy-130+blockH/2, 220, cy-130+blockH/2);
  drawArrow(330, cy-130+blockH/2, 420, cy-130+blockH/2);
  drawArrow(530, cy-130+blockH/2, 620, cy-130+blockH/2);
  drawArrow(730, cy-130+blockH/2, 780, cy-130+blockH/2);
  drawArrow(880, cy-130+blockH/2, 880+20, cy-130+blockH/2);

  // 反馈路径
  ctx.strokeStyle = '#60a5fa'; ctx.lineWidth=2; ctx.setLineDash([6,4]);
  // 位置反馈
  drawArrow(890, cy-130+blockH, 890, cy-40, '#3b82f6');
  drawArrow(890, cy-40, 275, cy-40, '#3b82f6');
  drawArrow(275, cy-40, 275, cy-130, '#3b82f6');
  ctx.fillStyle='#3b82f6'; ctx.font='11px sans-serif'; ctx.textAlign='center';
  ctx.fillText('位置反馈 θ', 550, cy-48);

  // 速度反馈
  ctx.strokeStyle = '#fbbf24';
  drawArrow(830, cy-130+blockH, 830, cy+30, '#f59e0b');
  drawArrow(830, cy+30, 475, cy+30, '#f59e0b');
  drawArrow(475, cy+30, 475, cy-130, '#f59e0b');
  ctx.fillStyle='#f59e0b'; ctx.fillText('速度反馈 ω', 630, cy+22);

  // 电流反馈
  ctx.strokeStyle = '#f87171';
  drawArrow(680, cy-130+blockH, 680, cy+80, '#ef4444');
  drawArrow(680, cy+80, 675, cy+80, '#ef4444');
  drawArrow(675, cy+80, 675, cy-130, '#ef4444');
  ctx.fillStyle='#ef4444'; ctx.fillText('电流反馈 I', 720, cy+72);

  ctx.setLineDash([]);

  // 信号流动态指示点
  const pulse = (t * 2) % 1;
  ctx.fillStyle = '#3b82f6';
  drawPulse(160 + (220-160)*pulse, cy-130+blockH/2);
  ctx.fillStyle = '#f59e0b';
  drawPulse(330 + (420-330)*pulse, cy-130+blockH/2);
  ctx.fillStyle = '#ef4444';
  drawPulse(530 + (620-530)*pulse, cy-130+blockH/2);

  // 下方波形展示区
  const waveY = cy + 110;
  // 位置响应
  ctx.fillStyle = 'rgba(15,23,42,0.8)';
  roundRect(ctx, 40, waveY-40, 880, 80, 8); ctx.fill();
  ctx.strokeStyle = '#334155'; ctx.stroke();
  ctx.strokeStyle = '#475569';
  ctx.beginPath(); ctx.moveTo(40, waveY); ctx.lineTo(920, waveY); ctx.stroke();
  // 指令（方波/正弦）
  const cmd = Math.sin(t*0.5)*0.7;
  const act = Math.sin(t*0.5 - 0.15)*0.65;
  // 指令曲线
  ctx.strokeStyle = '#60a5fa'; ctx.lineWidth=1.5; ctx.setLineDash([4,3]);
  ctx.beginPath();
  for (let x=0;x<880;x++) {
    const val = Math.sin(t*0.5 - 2 + x*0.02)*0.7;
    const y = waveY - val*30;
    if (x===0) ctx.moveTo(40+x,y); else ctx.lineTo(40+x,y);
  }
  ctx.stroke();
  ctx.setLineDash([]);
  // 实际曲线
  ctx.strokeStyle = '#34d399'; ctx.lineWidth=2;
  ctx.beginPath();
  for (let x=0;x<880;x++) {
    const val = Math.sin(t*0.5 - 2 + x*0.02 - 0.15)*0.65;
    const y = waveY - val*30;
    if (x===0) ctx.moveTo(40+x,y); else ctx.lineTo(40+x,y);
  }
  ctx.stroke();
  ctx.fillStyle='#94a3b8'; ctx.font='11px sans-serif'; ctx.textAlign='left';
  ctx.fillText('位置指令 vs 实际响应（蓝色虚线=指令，绿色实线=实际）', 55, waveY-25);
  ctx.fillStyle='#60a5fa'; ctx.fillText('● 指令', 700, waveY-25);
  ctx.fillStyle='#34d399'; ctx.fillText('● 实际', 770, waveY-25);

  // 更新数值
  const posCmdEl = document.getElementById('posCmd');
  const posActEl = document.getElementById('posAct');
  const velActEl = document.getElementById('velAct');
  const curActEl = document.getElementById('curAct');
  if (posCmdEl) {
    posCmdEl.textContent = (cmd*90).toFixed(1)+'°';
    posActEl.textContent = (act*90).toFixed(1)+'°';
    velActEl.textContent = (Math.cos(t*0.5)*0.65*90*2).toFixed(0)+'°/s';
    curActEl.textContent = (Math.sin(t*0.5 - 0.15)*3+2).toFixed(1)+' A';
  }
}

function drawHarmonic(t) {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle = '#1e3a5f'; ctx.lineWidth=0.5;
  for (let x=0;x<W;x+=30) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y=0;y<H;y+=30) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  const cx = W/2 - 100, cy = H/2;
  const waveSpeed = t * 3;

  // 刚轮（固定，蓝色外圈）
  ctx.fillStyle = '#1e3a8a';
  ctx.beginPath(); ctx.arc(cx, cy, 140, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#3b82f6'; ctx.lineWidth=4; ctx.stroke();
  // 刚轮内齿
  ctx.fillStyle = '#3b82f6';
  const ringTeeth = 202; // 示意用，实际用大一点的齿形模拟
  for (let i=0;i<40;i++) {
    const a = i * Math.PI*2/40;
    const x = cx + Math.cos(a)*135;
    const y = cy + Math.sin(a)*135;
    ctx.save(); ctx.translate(x,y); ctx.rotate(a);
    ctx.fillRect(-3,-10,6,12);
    ctx.restore();
  }

  // 柔轮（橙色，弹性变形椭圆，输出低速反向）
  const flexAngle = t * 3 / 100; // 柔轮低速反向旋转
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(flexAngle);
  ctx.fillStyle = 'rgba(249,115,22,0.7)';
  ctx.beginPath(); ctx.ellipse(0,0,115,95,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#fdba74'; ctx.lineWidth=2; ctx.stroke();
  // 柔轮外齿
  ctx.fillStyle = '#fb923c';
  for (let i=0;i<40;i++) {
    const a = i * Math.PI*2/40;
    // 椭圆半径
    const r = 115*95/Math.sqrt(Math.pow(95*Math.cos(a),2)+Math.pow(115*Math.sin(a),2));
    const x = Math.cos(a)*r;
    const y = Math.sin(a)*r;
    ctx.save(); ctx.translate(x,y); ctx.rotate(a);
    ctx.fillRect(-2,-8,4,10);
    ctx.restore();
  }

  // 波发生器（红色椭圆，高速旋转输入）
  ctx.save(); ctx.rotate(waveSpeed);
  ctx.fillStyle = '#dc2626';
  ctx.beginPath(); ctx.ellipse(0,0,85,60,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#fca5a5'; ctx.lineWidth=3; ctx.stroke();
  // 柔性轴承滚珠
  ctx.fillStyle = '#fbbf24';
  for (let i=0;i<16;i++) {
    const a = i * Math.PI*2/16;
    const r = 85*60/Math.sqrt(Math.pow(60*Math.cos(a),2)+Math.pow(85*Math.sin(a),2));
    ctx.beginPath(); ctx.arc(Math.cos(a)*r, Math.sin(a)*r, 5, 0, Math.PI*2); ctx.fill();
  }
  // 输入轴
  ctx.fillStyle = '#991b1b';
  ctx.beginPath(); ctx.arc(0,0,15,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fca5a5'; ctx.font='bold 11px sans-serif'; ctx.textAlign='center';
  ctx.fillText('输入', 0, 4);
  ctx.restore();
  ctx.restore();

  // 旋转方向箭头
  // 波发生器高速（顺时针）
  drawRotArrow(cx+160, cy-100, 25, '#ef4444', '输入(高速)');
  ctx.save(); ctx.translate(cx+160, cy-100); ctx.rotate(waveSpeed*2);
  ctx.strokeStyle='#ef4444'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(0,0,18,0,Math.PI*1.3); ctx.stroke();
  ctx.restore();

  // 柔轮输出低速（逆时针）
  ctx.save(); ctx.translate(cx-160, cy+120); ctx.rotate(-flexAngle*2);
  ctx.strokeStyle='#f97316'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(0,0,18,Math.PI*0.3,Math.PI*1.8,true); ctx.stroke();
  ctx.restore();
  ctx.fillStyle='#f97316'; ctx.font='12px sans-serif'; ctx.textAlign='center';
  ctx.fillText('输出(低速反向)', cx-160, cy+155);

  // 右侧：运动示意/齿数说明
  const infoX = W - 220;
  ctx.fillStyle = 'rgba(15,23,42,0.9)';
  roundRect(ctx, infoX-20, cy-170, 230, 340, 10); ctx.fill();
  ctx.strokeStyle = '#334155'; ctx.lineWidth=1; ctx.stroke();
  ctx.fillStyle = '#f8fafc'; ctx.font='bold 15px sans-serif'; ctx.textAlign='left';
  ctx.fillText('⚙️ 工作原理', infoX-5, cy-145);
  ctx.font='12px sans-serif'; ctx.fillStyle='#94a3b8';
  const lines = [
    '',
    '1. 波发生器(红色椭圆)',
    '   由电机带动高速旋转',
    '',
    '2. 柔轮(橙色)被挤压变形',
    '   长轴处齿与刚轮啮合',
    '   短轴处齿完全脱离',
    '',
    '3. 柔轮比刚轮少2齿',
    '   → 波发生器转1圈',
    '   → 柔轮反向转2齿',
    '   → 减速比 = 柔轮齿数/2',
    '',
    '4. 特点:',
    '   ✓ 零背隙',
    '   ✓ 大减速比(30~160)',
    '   ✓ 体积小/扭矩大',
    '   ✗ 柔轮易疲劳损坏'
  ];
  lines.forEach((line,i) => {
    if (line.startsWith('✓')) ctx.fillStyle = '#34d399';
    else if (line.startsWith('✗')) ctx.fillStyle = '#f87171';
    else ctx.fillStyle = '#cbd5e1';
    ctx.fillText(line, infoX-5, cy-125+i*16);
  });
}

// ============ 行星减速器原理动画（新增） ============
// 齿轮参数：太阳轮Zs=12、行星轮Zp=18、内齿圈Zr=Zs+2*Zp=48，减速比 i=1+Zr/Zs=5
function drawPlanetary(t) {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);
  // 背景网格（与其他页签一致）
  ctx.strokeStyle = '#1e3a5f'; ctx.lineWidth=0.5;
  for (let x=0;x<W;x+=30) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y=0;y<H;y+=30) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  const cx = W/2 - 100, cy = H/2;
  const Zs=12, Zp=18, Zr=Zs+2*Zp;   // 齿数（模数相同，节圆半径比=齿数比）
  const rs=30, rp=45, rr=rs+2*rp;   // 节圆半径(px)：中心距=rs+rp
  const sunA = t * 2.0;                        // 太阳轮角速度(高速输入)
  const carrierA = sunA * Zs/(Zs+Zr);          // 行星架角速度 = 输入/i (i=1+Zr/Zs=5)
  const planetA = carrierA - (sunA-carrierA)*Zs/Zp; // 行星轮自转(相对世界系)

  // ---- 内齿圈（蓝色，固定不动）----
  ctx.fillStyle = '#1e3a8a';
  ctx.beginPath(); ctx.arc(cx, cy, rr+16, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#3b82f6'; ctx.lineWidth=4;
  ctx.beginPath(); ctx.arc(cx, cy, rr+16, 0, Math.PI*2); ctx.stroke();
  // 内齿：从内壁向圆心方向的齿块
  ctx.fillStyle = '#3b82f6';
  for (let i=0;i<Zr;i++) {
    const a = i * Math.PI*2/Zr;
    const x = cx + Math.cos(a)*(rr+12);
    const y = cy + Math.sin(a)*(rr+12);
    ctx.save(); ctx.translate(x,y); ctx.rotate(a);
    ctx.fillRect(-2.2,-8,4.4,9); // 内齿块
    ctx.restore();
  }

  // ---- 行星架（绿色，低速同向输出，画在行星轮下方连接销轴）----
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(carrierA);
  ctx.strokeStyle = '#10b981'; ctx.lineWidth=9; ctx.lineCap='round';
  for (let k=0;k<3;k++) {
    const a = k * Math.PI*2/3;
    ctx.beginPath(); ctx.moveTo(0,0);
    ctx.lineTo(Math.cos(a)*(rs+rp), Math.sin(a)*(rs+rp));
    ctx.stroke();
    // 行星销轴
    ctx.fillStyle='#065f46';
    ctx.beginPath();
    ctx.arc(Math.cos(a)*(rs+rp), Math.sin(a)*(rs+rp), 8, 0, Math.PI*2);
    ctx.fill();
  }
  // 行星架中心输出圆盘
  ctx.fillStyle = '#065f46';
  ctx.beginPath(); ctx.arc(0,0,17,0,Math.PI*2); ctx.fill();
  ctx.restore();

  // ---- 行星轮×3（橙色，公转+自转）----
  for (let k=0;k<3;k++) {
    const a = carrierA + k * Math.PI*2/3;
    const px = cx + Math.cos(a)*(rs+rp);
    const py = cy + Math.sin(a)*(rs+rp);
    ctx.save(); ctx.translate(px,py); ctx.rotate(planetA);
    ctx.fillStyle = 'rgba(249,115,22,0.85)';
    ctx.beginPath(); ctx.arc(0,0,rp-4,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#fdba74'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(0,0,rp-4,0,Math.PI*2); ctx.stroke();
    // 行星轮外齿
    ctx.fillStyle = '#fb923c';
    for (let i=0;i<Zp;i++) {
      const ga = i * Math.PI*2/Zp;
      ctx.save(); ctx.rotate(ga);
      ctx.fillRect(-2.4,-rp+1,4.8,6);
      ctx.restore();
    }
    // 自转指示标记（辐条，让自转可见）
    ctx.strokeStyle='#7c2d12'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-rp+8); ctx.stroke();
    ctx.restore();
  }

  // ---- 太阳轮（红色，高速输入，最后画在中心最上层）----
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(sunA);
  ctx.fillStyle = '#dc2626';
  ctx.beginPath(); ctx.arc(0,0,rs-4,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#fca5a5'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(0,0,rs-4,0,Math.PI*2); ctx.stroke();
  // 太阳轮外齿
  ctx.fillStyle = '#ef4444';
  for (let i=0;i<Zs;i++) {
    const ga = i * Math.PI*2/Zs;
    ctx.save(); ctx.rotate(ga);
    ctx.fillRect(-3,-rs+1,6,7);
    ctx.restore();
  }
  ctx.restore();
  // 输入轴标识（不随旋转，覆盖在中心）
  ctx.fillStyle = '#991b1b';
  ctx.beginPath(); ctx.arc(cx,cy,11,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fca5a5'; ctx.font='bold 11px sans-serif'; ctx.textAlign='center';
  ctx.fillText('输入', cx, cy+4);

  // ---- 输入/输出转速指示 ----
  drawRotArrow(cx+165, cy-105, 25, '#ef4444', '输入(高速)');
  ctx.save(); ctx.translate(cx+165, cy-105); ctx.rotate(sunA*0.35);
  ctx.strokeStyle='#ef4444'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(0,0,18,0,Math.PI*1.3); ctx.stroke();
  ctx.restore();
  drawRotArrow(cx-160, cy+125, 25, '#10b981', '输出(低速同轴)');
  ctx.save(); ctx.translate(cx-160, cy+125); ctx.rotate(carrierA*0.35);
  ctx.strokeStyle='#10b981'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(0,0,18,Math.PI*0.3,Math.PI*1.8,true); ctx.stroke();
  ctx.restore();
  // 同轴输出轴（从中心向右下延伸的绿色轴，示意行星架输出）
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(carrierA);
  ctx.strokeStyle='#10b981'; ctx.lineWidth=4; ctx.setLineDash([8,6]);
  ctx.beginPath(); ctx.moveTo(rr+18,0); ctx.lineTo(rr+52,0); ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();

  // ---- 右侧原理说明面板 ----
  const infoX = W - 220;
  ctx.fillStyle = 'rgba(15,23,42,0.9)';
  roundRect(ctx, infoX-20, cy-170, 230, 340, 10); ctx.fill();
  ctx.strokeStyle = '#334155'; ctx.lineWidth=1; ctx.stroke();
  ctx.fillStyle = '#f8fafc'; ctx.font='bold 15px sans-serif'; ctx.textAlign='left';
  ctx.fillText('🪐 工作原理', infoX-5, cy-145);
  ctx.font='12px sans-serif';
  const lines = [
    '',
    '1. 太阳轮(红色)',
    '   电机带动高速旋转',
    '',
    '2. 行星轮(橙色)×3',
    '   绕太阳轮公转+自转',
    '   载荷均分到多路啮合',
    '',
    '3. 内齿圈(蓝色)固定',
    '   行星架(绿色)同轴输出',
    '   减速比 i = 1 + Z圈/Z阳',
    '   本例 1+48/12 = 5',
    '',
    '4. 特点:',
    '   ✓ 扭矩大·多齿分担',
    '   ✓ 同轴输出·紧凑',
    '   ✓ 效率高(>97%)',
    '   ✓ 低减速比反驱好',
    '   ✗ 单级减速比小(3~10)',
    '',
    '案例: 小米CyberGear 3.5:1',
    '      智元PowerFlow准直驱'
  ];
  lines.forEach((line,i) => {
    if (line.startsWith('✓')) ctx.fillStyle = '#34d399';
    else if (line.startsWith('✗')) ctx.fillStyle = '#f87171';
    else if (line.startsWith('案例')) ctx.fillStyle = '#22d3ee';
    else ctx.fillStyle = '#cbd5e1';
    ctx.fillText(line, infoX-5, cy-125+i*16);
  });
}

// ============ 辅助函数 ============
function drawBlock(x,y,w,h,fill,stroke,text,tc) {
  ctx.fillStyle = fill;
  roundRect(ctx, x,y,w,h,8); ctx.fill();
  ctx.strokeStyle = stroke; ctx.lineWidth=2; ctx.stroke();
  ctx.fillStyle = tc; ctx.font='bold 13px sans-serif'; ctx.textAlign='center';
  const lines = text.split('\n');
  lines.forEach((l,i) => ctx.fillText(l, x+w/2, y+h/2 - (lines.length-1)*8 + i*18));
}
function drawArrow(x1,y1,x2,y2,color) {
  ctx.strokeStyle = color || '#94a3b8';
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  const ang = Math.atan2(y2-y1, x2-x1);
  ctx.fillStyle = color || '#94a3b8';
  ctx.beginPath();
  ctx.moveTo(x2,y2);
  ctx.lineTo(x2-10*Math.cos(ang-0.3), y2-10*Math.sin(ang-0.3));
  ctx.lineTo(x2-10*Math.cos(ang+0.3), y2-10*Math.sin(ang+0.3));
  ctx.closePath(); ctx.fill();
}
function drawPulse(x,y) {
  ctx.beginPath(); ctx.arc(x,y,4,0,Math.PI*2); ctx.fill();
}
function drawRotArrow(x,y,r,color,label) {
  ctx.fillStyle=color; ctx.font='12px sans-serif'; ctx.textAlign='center';
  ctx.fillText(label, x, y-r-10);
}
function roundRect(ctx,x,y,w,h,r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

// ============ 主循环 ============
function animate(now) {
  const dt = (now - lastTime) / 1000;
  lastTime = now;
  if (playing) {
    animTime += dt * speed;
  } else if (stepPending) {
    animTime += STEP_DT * speed; // 单步：只推进一帧
    stepPending = false;
  }
  if (currentTab === 'structure') drawStructure(animTime);
  else if (currentTab === 'foc') drawFOC(animTime);
  else if (currentTab === 'threeloop') drawThreeLoop(animTime);
  else if (currentTab === 'harmonic') drawHarmonic(animTime);
  else if (currentTab === 'planetary') drawPlanetary(animTime);
  requestAnimationFrame(animate);
}

// ============ 统一播放控制条（速度 / 暂停 / 单步） ============
var STEP_DT = 1 / 60;      // 单步前进一帧（按 60fps 的单帧时间）
var stepPending = false;   // 单步标志：true 时下一帧只推进一帧

function syncPlayUI() {
  var pb = document.getElementById('playBtn');
  var ab = document.getElementById('aniPlayBtn');
  var sb = document.getElementById('aniStepBtn');
  if (playing) {
    if (pb) { pb.textContent = '⏸ 暂停动画'; pb.classList.remove('paused'); }
    if (ab) { ab.textContent = '⏸ 暂停'; ab.classList.remove('paused'); ab.title = '暂停动画'; }
    if (sb) { sb.disabled = true; sb.title = '单步（仅暂停时可用）'; }
  } else {
    if (pb) { pb.textContent = '▶ 播放动画'; pb.classList.add('paused'); }
    if (ab) { ab.textContent = '▶ 继续'; ab.classList.add('paused'); ab.title = '继续动画'; }
    if (sb) { sb.disabled = false; sb.title = '单步：每点一次前进一帧'; }
  }
}

function syncSpeedUI() {
  var i, btns = document.querySelectorAll('.ani-speed-btn');
  for (i = 0; i < btns.length; i++) {
    if (parseFloat(btns[i].getAttribute('data-speed')) === speed) {
      btns[i].classList.add('active');
    } else {
      btns[i].classList.remove('active');
    }
  }
  var sv = document.getElementById('aniSpeedVal');
  if (sv) sv.textContent = speed + 'x';
  var oldSv = document.getElementById('speedVal');
  if (oldSv) oldSv.textContent = speed + 'x';
  var slider = document.querySelector('.speed-control input[type=range]');
  if (slider && parseFloat(slider.value) !== speed) slider.value = speed;
}

function setSpeedBtn(v) {
  speed = parseFloat(v);
  syncSpeedUI();
}

function stepOnce() {
  if (playing) return;   // 仅在暂停时生效
  stepPending = true;
}

updateInfo();
syncPlayUI();
syncSpeedUI();
requestAnimationFrame(animate);
</script>
