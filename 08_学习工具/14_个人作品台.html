<script type="module">
/* 星尘背景:漂浮微粒 + 鼠标视差(简约不加戏) */
async function boot(){
  let THREE = null;
  try{ THREE = await import("../../00_3D解剖/lib/three.module.js"); }catch(e){
    try{ THREE = await import("https://registry.npmmirror.com/three/0.160.0/files/build/three.module.js"); }catch(e2){
      const tip = document.createElement("div");
      tip.style.cssText = "position:fixed;inset:auto 0 40% 0;text-align:center;color:#fca5a5;font-size:13px;z-index:30";
      tip.textContent = "星尘背景加载失败:请先运行 _本地工具/启动教学页面.bat 再刷新";
      document.body.appendChild(tip);
      return;
    }
  }
  const c = document.getElementById("stars");
  const r = new THREE.WebGLRenderer({ canvas:c, antialias:true, alpha:true });
  r.setPixelRatio(Math.min(devicePixelRatio, 2));
  const s = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(60, 1, 0.1, 60); cam.position.z = 12;
  const pos = new Float32Array(650*3);
  for(let i = 0; i < 650; i++){ pos[i*3]=(Math.random()-0.5)*36; pos[i*3+1]=(Math.random()-0.5)*22; pos[i*3+2]=(Math.random()-0.5)*14; }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(pos,3));
  s.add(new THREE.Points(g, new THREE.PointsMaterial({ color:0x9fc2ff, size:0.05, transparent:true, opacity:0.65 })));
  function on(){ r.setSize(innerWidth, innerHeight); cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix(); }
  addEventListener("resize", on); on();
  let mx = 0, my = 0;
  addEventListener("pointermove", e=>{ mx = e.clientX/innerWidth-0.5; my = e.clientY/innerHeight-0.5; });
  (function loop(){
    requestAnimationFrame(loop);
    r.render(s, cam);
    c.style.transform = "translate(" + (mx*-12) + "px," + (my*-9) + "px)";
  })();
}
boot();
</script>
