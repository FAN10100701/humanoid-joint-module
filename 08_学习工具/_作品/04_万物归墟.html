<script type="module">
/* ============================================================
 * 万物归墟 · SINGULARITY
 * —— 以下 ABYSS 类为「可剥离渲染核心」:未来提取为 _assets/abyss.js,
 *    供首页以待机模式复用。API:mount(canvas,opts)/setWhite/setThemeMix/
 *    setStyle/setLine/setQuality/spawnRipple/spawnItemFromRay/destroy
 * ============================================================ */
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const FINE = matchMedia("(hover: hover) and (pointer: fine)").matches;
const clamp = (x,a,b)=>Math.min(b,Math.max(a,x));
const smoothstep = (a,b,x)=>{ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };

/* 光谱预设:黑/白两套盘色(inner→outer) */
const STYLES = {
  amber:  { bh:[0xfff3d6,0xff7a18], wh:[0xdfeaff,0x6d7dff] },
  violet: { bh:[0xd9e4ff,0x4a55ff], wh:[0xfff0d0,0xff9a3d] },
  jade:   { bh:[0xd2ffef,0x14b87c], wh:[0xf4ffd8,0xd8b93a] },
  crimson:{ bh:[0xffd9c4,0xe62020], wh:[0xffe8ee,0xff4d7d] },
};
/* 天外来客:随机被吞噬的过客 */
const ITEM_KINDS = ["🪨","🚀","🛰️","🧑‍🚀","🐋","🐘","🦕","🏢"];
const TIERS = {
  high:{ scale:1.0, steps:280, pts:9000, name:"高" },
  mid: { scale:.78, steps:200, pts:5200, name:"中" },
  low: { scale:.6,  steps:130, pts:2600, name:"低" },
};

class Abyss{
  constructor(canvas, T){
    this.T = T;
    this.renderer = new T.WebGLRenderer({ canvas, antialias:false, powerPreference:"high-performance" });
    this.renderer.autoClear = false;
    this.aspect = 1; this.dpr = Math.min(devicePixelRatio||1, 2);
    this.tier = "mid"; this.style = "amber";
    this.white = 0; this.whiteTarget = 0;          // 0 黑洞 ↔ 1 白洞
    this.themeMix = 0; this.themeMixTarget = 0;    // 0 深色背景 ↔ 1 浅色背景
    this.lineMix = 0; this.lineMixTarget = 0;      // 0 写实 ↔ 1 引力场线稿
    this.simT = 0; this.timeScale = 1; this.lens = 1;
    this.glowK = 1; this.densK = 1;
    this.ptr = { x:0, y:0, k:0, kTarget:0 };
    this.rip = Array.from({length:6},()=>new T.Vector4(0,0,9,0)); this.ripI = 0;
    this.feedFlash = 0;
    this.cam = { azim: .6, elev: .18, r: 13.5, azimV: 0 };
    this._buildQuad();
    this._buildItems();
    this._buildField();
    this.setTier("mid", true);
    this._onResize = ()=>this.resize();
    addEventListener("resize", this._onResize); this.resize();
  }
  _col(hex){ return new this.T.Color(hex); }
  _buildQuad(){
    const T = this.T;
    this.uni = {
      uTime:{value:0}, uAspect:{value:1}, uTanFov:{value:Math.tan(29*Math.PI/180)},
      uCamPos:{value:new T.Vector3()}, uCamF:{value:new T.Vector3()}, uCamR:{value:new T.Vector3()}, uCamU:{value:new T.Vector3()},
      uWhite:{value:0}, uTheme:{value:0}, uLens:{value:1}, uGlowK:{value:1}, uSteps:{value:170}, uLineMix:{value:0},
      uColDiskA:{value:this._col(STYLES.amber.bh[0])}, uColDiskB:{value:this._col(STYLES.amber.bh[1])},
      uColWhiteA:{value:this._col(STYLES.amber.wh[0])}, uColWhiteB:{value:this._col(STYLES.amber.wh[1])},
      uColBgDark:{value:new T.Color(0x05070d)}, uColBgLight:{value:new T.Color(0xeef2f7)},
      uRip:{value:this.rip}, uPointer:{value:new T.Vector2()}, uPointerK:{value:0},
      uFeedFlash:{value:0}, uDiskGain:{value:1}, uCenterOff:{value:new T.Vector2(0,-.08)},
    };
    this.quadScene = new T.Scene();
    this.quadCam = new T.OrthographicCamera(-1,1,1,-1,0,1);
    const mat = new T.ShaderMaterial({
      uniforms: this.uni, depthTest:false, depthWrite:false,
      vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
      fragmentShader: FRAG,
    });
    this.quadScene.add(new T.Mesh(new T.PlaneGeometry(2,2), mat));
    /* 粒子层:position 打包 (r0, 角0, 倾角),aExtra = (seed, size) */
    this.ptScene = new T.Scene();
    this.persp = new T.PerspectiveCamera(58, 1, .1, 300);
    this.ptUni = {
      uTime:{value:0}, uWhite:{value:0}, uGrav:{value:1}, uDens:{value:1}, uPx:{value:1}, uTheme:{value:0},
      uTanFov:{value:Math.tan(29*Math.PI/180)},
      uCamR:{value:new T.Vector3()}, uCamU:{value:new T.Vector3()},
      uColIn:{value:this.uni.uColDiskA.value}, uColOut:{value:this.uni.uColDiskB.value},
      uColInW:{value:this.uni.uColWhiteA.value}, uColOutW:{value:this.uni.uColWhiteB.value},
      uPointer:{value:this.uni.uPointer}, uPointerK:{value:0},
    };
    this.ptMat = new T.ShaderMaterial({
      uniforms: this.ptUni, transparent:true, depthTest:false, depthWrite:false, blending:T.AdditiveBlending,
      vertexShader: PT_VERT, fragmentShader: PT_FRAG,
    });
    this._buildPoints(TIERS.mid.pts);
  }
  _buildPoints(n){
    const T = this.T;
    if(this.points){ this.ptScene.remove(this.points); this.points.geometry.dispose(); }
    const pos = new Float32Array(n*3), ext = new Float32Array(n*2);
    for(let i=0;i<n;i++){
      pos[i*3]   = 2.7 + Math.pow(Math.random(), .72)*6.6;   // 起始半径
      pos[i*3+1] = Math.random()*Math.PI*2;                  // 初始角
      pos[i*3+2] = Math.random();                            // 倾角种子
      ext[i*2]   = Math.random();                            // seed
      ext[i*2+1] = .6 + Math.random()*1.9;                   // size
    }
    const g = new T.BufferGeometry();
    g.setAttribute("position", new T.BufferAttribute(pos,3));
    g.setAttribute("aExtra", new T.BufferAttribute(ext,2));
    this.points = new T.Points(g, this.ptMat);
    this.points.frustumCulled = false;
    this.points.renderOrder = 1;
    this.ptScene.add(this.points);
  }
  /* ---------- 天外来客:程序化低多边形 3D 网格(带光照着色,真立体) + plunge 轨道 + 潮汐拉伸 ---------- */
  _buildItems(){
    this.itemScene = new this.T.Scene();
    this._addLights(this.itemScene);
    this.items = [];
    this.fieldItems = [];
    this._matCache = {};
    this.itemT = 2.5;
  }
  _addLights(scene){
    const T = this.T;
    scene.add(new T.HemisphereLight(0xffffff, 0x3a4658, 1.15));
    const d = new T.DirectionalLight(0xffffff, 1.7); d.position.set(6, 9, 4); scene.add(d);
    const d2 = new T.DirectionalLight(0x9db8ff, .5); d2.position.set(-5, -3, -4); scene.add(d2);
  }
  _M(color, opt){   /* 材质缓存(按颜色),几何体随物品销毁 */
    const key = color + JSON.stringify(opt||{});
    if(!this._matCache[key]) this._matCache[key] = new this.T.MeshStandardMaterial({ color, roughness:.55, metalness:.12, flatShading:true, ...(opt||{}) });
    return this._matCache[key];
  }
  _itemMesh(kind){
    const T = this.T;
    const g = new T.Group();
    const add = (geo, m, x=0, y=0, z=0, r=[0,0,0], s=[1,1,1])=>{
      const ms = new T.Mesh(geo, m);
      ms.position.set(x,y,z); ms.rotation.set(...r); ms.scale.set(...s);
      g.add(ms); return ms;
    };
    const sph = (r,seg=18)=>new T.SphereGeometry(r, seg, Math.max(8, seg>>1));
    switch(kind){
      case "meteor":{   /* 陨石:顶点扰动岩石 */
        const geo = new T.IcosahedronGeometry(.52, 1);
        const pa = geo.attributes.position;
        for(let i=0;i<pa.count;i++){
          const k = 1 + (Math.random()-.5)*.42;
          pa.setXYZ(i, pa.getX(i)*k, pa.getY(i)*(1+(Math.random()-.5)*.3), pa.getZ(i)*k);
        }
        geo.computeVertexNormals();
        add(geo, this._M(0x8a7866));
        break;
      }
      case "rocket":{   /* 火箭 */
        add(new T.CylinderGeometry(.14,.18,.62,10), this._M(0xe8ecf2), 0,.06,0);
        add(new T.ConeGeometry(.15,.3,10), this._M(0xd8443c), 0,.5,0);
        for(let i=0;i<3;i++){ const a=i*2.094;
          add(new T.BoxGeometry(.05,.24,.14), this._M(0xd8443c), Math.cos(a)*.17, -.22, Math.sin(a)*.17); }
        add(new T.ConeGeometry(.09,.16,8), this._M(0xffb347), 0,-.36,0, [Math.PI,0,0]);
        break;
      }
      case "satellite":{  /* 卫星 */
        add(new T.BoxGeometry(.32,.32,.32), this._M(0xc9a86a));
        add(new T.BoxGeometry(.66,.02,.26), this._M(0x22335e), .48,0,0);
        add(new T.BoxGeometry(.66,.02,.26), this._M(0x22335e), -.48,0,0);
        add(new T.CylinderGeometry(.02,.02,.2,6), this._M(0x9aa4b0), 0,.24,0);
        break;
      }
      case "astronaut":{  /* 宇航员 */
        add(sph(.19,14), this._M(0xf2f4f8), 0,.32,0);
        add(sph(.12,12), this._M(0x2a3646), 0,.32,.1);
        add(new T.CylinderGeometry(.16,.2,.34,10), this._M(0xf2f4f8), 0,.02,0);
        add(new T.BoxGeometry(.24,.28,.12), this._M(0xb9c2cc), 0,.06,-.16);
        add(new T.BoxGeometry(.09,.26,.1), this._M(0xf2f4f8), .2,-.06,0, [0,0,.3]);
        add(new T.BoxGeometry(.09,.26,.1), this._M(0xf2f4f8), -.2,-.06,0, [0,0,-.3]);
        break;
      }
      case "whale":{    /* 鲸 */
        add(sph(.3,16), this._M(0x4a6a8a), 0,0,0, [0,0,0], [1.7,.75,.65]);
        add(sph(.14,10), this._M(0x3c5a78), 0,.12,-.5, [0,0,0], [.3,1,.9]);
        add(sph(.12,10), this._M(0x3c5a78), 0,.1,-.62, [0,0,0], [.1,.9,.7]);
        add(sph(.1,10), this._M(0xf0f4f8), 0,-.02,.42, [0,0,0], [.9,.5,1.2]);
        break;
      }
      case "elephant":{ /* 象 */
        add(sph(.28,14), this._M(0x9aa0a8), 0,.02,0, [0,0,0], [1.25,1,.85]);
        add(sph(.17,12), this._M(0x9aa0a8), .3,.16,0);
        add(new T.CylinderGeometry(.045,.06,.3,8), this._M(0x8a9098), .44,.02,0, [0,0,-.5]);
        add(new T.CylinderGeometry(.13,.15,.03,10), this._M(0x8a9098), .28,.2,.13, [.4,0,0]);
        add(new T.CylinderGeometry(.13,.15,.03,10), this._M(0x8a9098), .28,.2,-.13, [-.4,0,0]);
        for(const [lx,lz] of [[.16,.12],[.16,-.12],[-.16,.12],[-.16,-.12]])
          add(new T.CylinderGeometry(.055,.06,.2,8), this._M(0x8a9098), lx,-.18,lz);
        break;
      }
      case "dino":{     /* 恐龙 */
        add(sph(.26,14), this._M(0x5f8a5a), 0,0,0, [0,0,0], [1.15,1,.8]);
        add(new T.CylinderGeometry(.07,.11,.34,8), this._M(0x5f8a5a), .24,.26,0, [0,0,-.5]);
        add(new T.BoxGeometry(.16,.12,.2), this._M(0x547951), .4,.42,0);
        add(new T.ConeGeometry(.09,.44,8), this._M(0x547951), -.36,.02,0, [0,0,1.35]);
        for(const lx of [.1,-.1])
          add(new T.CylinderGeometry(.05,.06,.18,8), this._M(0x547951), lx,-.2,.05);
        break;
      }
      case "tower":{    /* 大厦(程序化窗户贴图) */
        if(!this._winTex){
          const c = document.createElement("canvas"); c.width = c.height = 64;
          const x = c.getContext("2d");
          x.fillStyle = "#cfd6de"; x.fillRect(0,0,64,64);
          x.fillStyle = "#35507a";
          for(let i=0;i<8;i++) for(let j=0;j<8;j++) if((i*7+j*3)%5<3) x.fillRect(i*8+2, j*8+2, 4, 5);
          this._winTex = new T.CanvasTexture(c);
        }
        const m = this._towerMat ||= new T.MeshStandardMaterial({ map:this._winTex, roughness:.5, metalness:.1 });
        add(new T.BoxGeometry(.4,.86,.4), m, 0,.08,0);
        add(new T.BoxGeometry(.46,.06,.46), this._M(0x8a94a0), 0,.55,0);
        add(new T.CylinderGeometry(.015,.015,.3,6), this._M(0x8a94a0), 0,.62,0);
        break;
      }
    }
    return g;
  }
  /* 时空之兜:爱因斯坦嵌入图 —— 网格平面被质量压出"兜",物品沿面滚落被吞 */
  _buildField(){
    const T = this.T;
    this.fieldScene = new T.Scene();
    this._addLights(this.fieldScene);
    this.fUni = { uWell:{value:3.8}, uTheme:{value:0}, uFade:{value:0} };
    const gridGeo = new T.PlaneGeometry(64, 64, 96, 96);
    gridGeo.rotateX(-Math.PI/2);
    const gridMat = new T.ShaderMaterial({
      uniforms: this.fUni, transparent: true, depthWrite: false, side: T.DoubleSide,
      vertexShader: `uniform float uWell; varying vec2 vUv; varying float vR;
        void main(){ vUv = uv; vec3 p = position; float r = length(p.xz); vR = r;
          p.y += -uWell/(r+1.1);
          gl_Position = projectionMatrix*modelViewMatrix*vec4(p,1.0); }`,
      fragmentShader: `uniform float uTheme, uFade; varying vec2 vUv; varying float vR;
        float gline(float f, float w){ return 1.0 - smoothstep(0.0, w, min(f, 1.0-f)); }
        void main(){
          vec3 ink = mix(vec3(.93,.93,.96), vec3(.10,.10,.11), uTheme);
          vec2 f = fract(vUv*32.0);
          float line = max(gline(f.x,.05), gline(f.y,.05));
          float mask = smoothstep(1.4, 2.4, vR) * (1.0 - smoothstep(19.0, 31.0, vR));
          float a = line*mask*uFade*.85;
          if(a < .012) discard;
          gl_FragColor = vec4(ink, a);
        }`,
    });
    this.fGrid = new T.Mesh(gridGeo, gridMat);
    this.fieldScene.add(this.fGrid);
    this.fSphereMat = new T.MeshBasicMaterial({ color:0x020204, transparent:true, opacity:0 });
    this.fSphere = new T.Mesh(new T.SphereGeometry(.9, 40, 28), this.fSphereMat);
    this.fieldScene.add(this.fSphere);
    this.fRings = new T.Group();
    for(const [r, w] of [[2.5, .06], [2.95, .045]]){
      const rm = new T.Mesh(new T.RingGeometry(r-w, r+w, 72),
        new T.MeshBasicMaterial({ color:0x111114, transparent:true, opacity:0, side:T.DoubleSide }));
      rm.rotation.x = -Math.PI/2;
      this.fRings.add(rm);
    }
    this.fieldScene.add(this.fRings);
    this.fPulse = 0;
  }
  sheetY(r){ return -this.fUni.uWell.value/(r+1.1); }
  /* --- 投放路由:写实模式物品飞入引力场;引力场模式物品在网格兜上滚落 --- */
  spawnItemFromRay(origin, dir){
    const kind = ITEM_KINDS[(Math.random()*ITEM_KINDS.length)|0];
    if(this.lineMixTarget > .5){
      /* 点击射线与兜面(y=sheetY 平面)求交,物品落在点击处滚向兜底 */
      let t = dir.y !== 0 ? -(origin.y + 1.1)/dir.y : -1;
      let px, pz;
      if(t > 0){ px = origin.x + dir.x*t; pz = origin.z + dir.z*t; }
      else { const a = Math.random()*6.283; px = Math.cos(a)*10; pz = Math.sin(a)*10; }
      let r = Math.max(Math.hypot(px, pz), 2.6);
      const a2 = Math.atan2(pz, px);
      this._spawnFieldItem(kind, r, a2);
      return;
    }
    const p = origin.clone().addScaledVector(dir, 11.5);
    if(p.lengthSq() < 1e-6 || !isFinite(p.x)) return;
    const tangent = new this.T.Vector3(-p.z, 0, p.x).normalize();
    const speed = Math.sqrt(20/Math.max(p.length(), 2))*(.8+Math.random()*.3);
    const v = tangent.multiplyScalar(speed)
      .addScaledVector(p.clone().normalize(), -(.7+Math.random()*.6))
      .add(new this.T.Vector3((Math.random()-.5)*.5, (Math.random()-.5)*.3, (Math.random()-.5)*.5));
    this._spawnRealItem(kind, p, v);
  }
  spawnAmbientItem(){
    const kind = ITEM_KINDS[(Math.random()*ITEM_KINDS.length)|0];
    if(this.lineMixTarget > .5){
      this._spawnFieldItem(kind, 7 + Math.random()*5, Math.random()*6.283);
      return;
    }
    const az = Math.random()*Math.PI*2, rad = 10 + Math.random()*4;
    const p = new this.T.Vector3(Math.cos(az)*rad, (Math.random()-.5)*3, Math.sin(az)*rad);
    const tangent = new this.T.Vector3(-p.z, 0, p.x).normalize();
    const v = tangent.multiplyScalar(Math.sqrt(20/rad)*(.8+Math.random()*.3))
      .addScaledVector(p.clone().normalize(), -(.5+Math.random()*.6));
    this._spawnRealItem(kind, p, v);
  }
  tickAmbient(dt, want){
    if(!want) return;
    this.itemT -= dt;
    if(this.itemT <= 0){ this.itemT = 4 + Math.random()*3; this.spawnAmbientItem(); }
  }
  _spawnRealItem(kind, p, v){
    if(this.items.length >= 8){
      const old = this.items.shift();
      this.itemScene.remove(old.g); this._disposeGroup(old.g);
    }
    const g = this._itemMesh(kind);
    g.position.copy(p);
    const size = .8 + Math.random()*.45;
    g.scale.setScalar(size);
    this.itemScene.add(g);
    this.items.push({ g, vel:v.clone(), size, spin:(Math.random()-.5)*2.4, seed:Math.random()*10 });
  }
  _spawnFieldItem(kind, r, ang){
    if(this.fieldItems.length >= 8){
      const old = this.fieldItems.shift();
      this.fieldScene.remove(old.g); this._disposeGroup(old.g);
    }
    const g = this._itemMesh(kind);
    const size = 1.5 + Math.random()*.7;   /* 兜上物品放大,保证可读性 */
    g.scale.setScalar(size);
    const white = this.white > .5;
    const rr = white ? Math.max(r*.22, 1.7) : r;   /* 白洞:从兜心喷出 */
    g.position.set(Math.cos(ang)*rr, this.sheetY(rr)+.18, Math.sin(ang)*rr);
    this.fieldScene.add(g);
    this.fieldItems.push({ g, r:rr, ang, size, spin:(Math.random()-.5)*1.6,
      vr: white ? 1.4+Math.random()*1.2 : .35+Math.random()*.3, seed:Math.random()*10 });
  }
  _disposeGroup(g){ g.traverse(o=>{ if(o.geometry) o.geometry.dispose(); }); }
  clearItems(){
    for(const it of this.items){ this.itemScene.remove(it.g); this._disposeGroup(it.g); }
    for(const it of this.fieldItems){ this.fieldScene.remove(it.g); this._disposeGroup(it.g); }
    this.items.length = 0; this.fieldItems.length = 0;
  }
  _updateItems(dt){
    const T = this.T;
    /* --- 写实模式:准牛顿 plunge + 潮汐拉伸(沿指向奇点的 z 轴撕长) --- */
    const heatCol = this.white > .5 ? this.uni.uColWhiteA.value : this.uni.uColDiskA.value;
    for(let i=this.items.length-1; i>=0; i--){
      const it = this.items[i], p = it.g.position, v = it.vel;
      const r = Math.max(p.length(), .8);
      const gsign = this.white > .5 ? 1 : -1;
      v.addScaledVector(p.clone().normalize(), gsign*this.lens*30/(r*r)*dt);
      if(this.white < .5) v.multiplyScalar(1 - Math.min(.4, .10*dt*(4/r)));
      p.addScaledVector(v, dt);
      const r2 = Math.max(p.length(), .8);
      const s = Math.min(2.4, 5.0/(r2*r2));
      it.g.lookAt(0,0,0);
      it.g.rotateZ(it.spin*dt);
      it.g.scale.set(it.size/(1+s*.5), it.size/(1+s*.5), it.size*(1+s));
      let gone = false;
      if(this.white > .5){ if(r2 > 26) gone = true; }
      else if(r2 < 1.45){
        this.feedFlash = 1;
        const pr = p.clone().project(this.persp);
        this.spawnRipple(pr.x/this.aspect, pr.y);
        gone = true;
      }
      if(gone){ this.itemScene.remove(it.g); this._disposeGroup(it.g); this.items.splice(i,1); }
    }
    /* --- 引力场模式:物品在网格兜上滚落(白洞:被兜心喷出甩飞) --- */
    const white = this.white > .5;
    for(let i=this.fieldItems.length-1; i>=0; i--){
      const it = this.fieldItems[i];
      it.vr += (white ? 1.2 : this.lens*2.6)/Math.max(it.r*it.r, .5)*dt;   /* 兜越深滚越快 */
      it.r += it.vr*dt*(white ? 1 : -1);
      it.ang += dt*(white ? .3 : 1.4)/Math.max(it.r, .8);
      const gone = white ? it.r > 18 : it.r < 1.22;
      if(gone){
        if(!white){ this.fPulse = 1; }
        this.fieldScene.remove(it.g); this._disposeGroup(it.g); this.fieldItems.splice(i,1);
        continue;
      }
      it.g.position.set(Math.cos(it.ang)*it.r, this.sheetY(it.r)+.18, Math.sin(it.ang)*it.r);
      const s = Math.min(2.2, white ? 0 : 4.5/(it.r*it.r));
      it.g.lookAt(0, it.g.position.y, 0);
      it.g.rotateZ(it.spin*dt);
      it.g.scale.set(it.size/(1+s*.5), it.size/(1+s*.5), it.size*(1+s));
    }
  }
  setTier(t, silent){
    if(!TIERS[t]) return;
    this.tier = t;
    const cfg = TIERS[t];
    this.renderer.setPixelRatio(this.dpr*cfg.scale);
    this.uni.uSteps.value = cfg.steps;
    this._buildPoints(cfg.pts);
    this.ptUni.uPx.value = this.dpr*cfg.scale;
    if(!silent) this.resize();
  }
  setStyle(name){
    const s = STYLES[name]; if(!s) return;
    this.style = name;
    this.uni.uColDiskA.value.set(s.bh[0]); this.uni.uColDiskB.value.set(s.bh[1]);
    this.uni.uColWhiteA.value.set(s.wh[0]); this.uni.uColWhiteB.value.set(s.wh[1]);
  }
  resize(){
    const w = innerWidth, h = innerHeight;
    this.renderer.setSize(w, h);
    this.aspect = w/h;
    this.uni.uAspect.value = w/h;
    this.persp.aspect = w/h; this.persp.updateProjectionMatrix();
  }
  spawnRipple(nx, ny){
    const v = this.rip[this.ripI++ % this.rip.length];
    v.set(nx, ny, 0, 1);
  }
  frame(dt, t){
    /* 时间积分:时间流速 × 视界附近时间膨胀 × reduced-motion 降速 */
    const dila = 1 - .68*smoothstep(6.5, 2.8, this.cam.r);
    this.simT += dt * this.timeScale * dila * (RM ? .12 : 1);
    /* 形态/主题/线稿渐变 */
    this.white += (this.whiteTarget - this.white) * Math.min(1, dt*2.6);
    this.themeMix += (this.themeMixTarget - this.themeMix) * Math.min(1, dt*3.2);
    this.lineMix += (this.lineMixTarget - this.lineMix) * Math.min(1, dt*4);
    /* 相机:惯性 + 视差 */
    const c = this.cam;
    c.azim += c.azimV; c.azimV *= Math.pow(.06, dt);
    const par = this.parallax ? 1 : 0;
    const px = this.ptr.x*par*.045, py = -this.ptr.y*par*.03;
    const r = c.r, az = c.azim + px + t*.008*(RM?.25:1), el = clamp(c.elev + py, .04, 1.2);
    const cp = new this.T.Vector3(r*Math.cos(el)*Math.sin(az), r*Math.sin(el), r*Math.cos(el)*Math.cos(az));
    const cf = cp.clone().negate().normalize();
    const cr = new this.T.Vector3().crossVectors(cf, new this.T.Vector3(0,1,0)).normalize();
    const cu = new this.T.Vector3().crossVectors(cr, cf);
    /* 指针手势衰减 */
    this.ptr.k += (this.ptr.kTarget - this.ptr.k)*Math.min(1, dt*5);
    this.ptr.kTarget *= Math.pow(.35, dt);
    this.feedFlash *= Math.pow(.04, dt);
    /* uniforms */
    this.uni.uTime.value = this.simT;
    this.uni.uCamPos.value.copy(cp); this.uni.uCamF.value.copy(cf);
    this.uni.uCamR.value.copy(cr); this.uni.uCamU.value.copy(cu);
    this.uni.uWhite.value = this.white; this.uni.uTheme.value = this.themeMix;
    this.uni.uLens.value = this.lens; this.uni.uGlowK.value = this.glowK;
    this.uni.uLineMix.value = this.lineMix;
    this.uni.uDiskGain.value = .55 + .45*this.densK;
    this.uni.uPointer.value.set(this.ptr.x, this.ptr.y); this.uni.uPointerK.value = this.ptr.k;
    this.uni.uFeedFlash.value = this.feedFlash;
    for(const v of this.rip) v.z += dt;
    this.ptUni.uTime.value = this.simT; this.ptUni.uWhite.value = this.white;
    this.ptUni.uGrav.value = this.lens; this.ptUni.uDens.value = this.densK;
    this.ptUni.uTheme.value = this.themeMix;
    this.ptUni.uPointerK.value = this.ptr.k;   /* 数字型 uniform 不共享引用,需逐帧同步 */
    this.ptUni.uCamR.value.copy(cr); this.ptUni.uCamU.value.copy(cu);
    this.persp.position.copy(cp); this.persp.lookAt(0,0,0);
    this._updateItems(dt);
    /* 时空之兜 uniforms / 融合 */
    this.fUni.uWell.value = 3.8*this.lens*(1 - 1.8*this.white);   /* 黑洞下陷 / 白洞外凸 */
    this.fUni.uTheme.value = this.themeMix;
    this.fUni.uFade.value = this.lineMix;
    this.fSphereMat.color.setScalar(.02 + .96*this.white);
    this.fSphereMat.opacity = this.lineMix;
    this.fSphere.scale.setScalar(1 + .3*this.fPulse);
    this.fPulse *= Math.pow(.04, dt);
    this.fSphere.position.y = -this.fUni.uWell.value/1.1 + .9;
    this.fRings.position.y = this.sheetY(2.72) + .05;
    this.fRings.scale.setScalar(Math.max(this.lens, .4));
    for(const rm of this.fRings.children){
      rm.material.opacity = .8*this.lineMix;
      rm.material.color.setScalar(.07 + .86*this.themeMix);   /* 浅色墨环 / 深色白环 */
    }
    /* 渲染:写实(quad+粒子+物品)按 lineMix 淡出,时空之兜淡入; clearColor 跟主题走 */
    if(!this._cc){ this._cc = new this.T.Color(); this._cA = new this.T.Color(0x0c0d11); this._cB = new this.T.Color(0xf9f8f4); }
    this._cc.copy(this._cA).lerp(this._cB, this.themeMix);
    this.renderer.setClearColor(this._cc);
    const R = this.renderer;
    R.clear();
    if(this.lineMix < .999) R.render(this.quadScene, this.quadCam);
    if(this.lineMix < .6){ R.clearDepth(); R.render(this.ptScene, this.persp); }
    if(this.lineMix < .5){ R.clearDepth(); R.render(this.itemScene, this.persp); }
    if(this.lineMix > .001){ R.clearDepth(); R.render(this.fieldScene, this.persp); }
  }
  destroy(){
    removeEventListener("resize", this._onResize);
    this.renderer.dispose();
  }
}

/* ---------------- 着色器 ---------------- */
/* 黑洞主体:史瓦西时空光线步进(光子测地线近似 d²x/dλ² = -3/2·h²·x/r⁵),
   吸积盘在 y=0 面程序化生成,泛光直接烘焙(无后处理),uWhite 单一参数做黑洞↔白洞形态渐变;
   uLineMix 切换爱因斯坦纯黑白引力场线稿(屏幕空间弯曲网格 + 内流引力线) */
const FRAG = `
varying vec2 vUv;
uniform float uTime, uAspect, uTanFov, uWhite, uTheme, uLens, uGlowK, uSteps, uFeedFlash, uDiskGain;
uniform vec3 uCamPos, uCamF, uCamR, uCamU;
uniform vec3 uColDiskA, uColDiskB, uColWhiteA, uColWhiteB, uColBgDark, uColBgLight;
uniform vec4 uRip[6];
uniform vec2 uPointer;
uniform float uPointerK;
uniform vec2 uCenterOff;
#define R_IN 2.2
#define R_OUT 7.6
float h12(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
vec3 h33(vec3 p){ p = fract(p*vec3(443.897,441.423,437.195)); p += dot(p,p.yxz+19.19); return fract((p.xxy+p.yxx)*p.zyx); }
float vn2(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
  return mix(mix(h12(i),h12(i+vec2(1.,0.)),f.x), mix(h12(i+vec2(0.,1.)),h12(i+vec2(1.,1.)),f.x), f.y); }
float fbm(vec2 p){ float v = 0., a = .55; for(int i=0;i<3;i++){ v += a*vn2(p); p = p*2.13+7.7; a *= .5; } return v; }
vec3 starLayer(vec3 d, float s, float th){
  vec3 q = d*s; vec3 id = floor(q); vec3 fp = fract(q)-.5;
  vec3 h = h33(id);
  float br = smoothstep(th, 1.0, h.x);
  vec3 off = (h33(id+7.1)-.5)*.55;
  float dd = length(fp-off);
  float tw = .65+.35*sin(uTime*(1.5+h.y*2.0)+h.z*40.0);
  vec3 scol = mix(vec3(.72,.82,1.0), vec3(.13,.21,.44), uTheme);   /* 浅色:深藏青星点 */
  return scol * (1.0-smoothstep(0.0,.20,dd)) * br * tw * 1.6;
}
vec3 background(vec3 d){
  vec3 col = mix(uColBgDark, uColBgLight, uTheme);
  /* 银河带:倾斜大圆 + 沿带湍流,给背景第一层景深 */
  vec3 bn = normalize(vec3(.34, 1.0, .18));
  float bandD = dot(d, bn);
  float band = exp(-bandD*bandD*9.0);
  float mb = fbm(d.xz*2.6 + d.y*1.3);
  vec3 bandT = mix(uColDiskB, uColDiskA, .4);
  bandT = mix(bandT, mix(uColBgLight, uColDiskB, .40), uTheme);
  col = mix(col, mix(col, bandT, .34), band*(.25+.75*mb)*mix(.55, .95, uTheme));
  /* 双色星云:主色 + 补色 */
  float neb = fbm(d.xy*2.3 + d.z*1.7 + 3.1);
  vec3 nebT = mix(uColDiskB*.20 + vec3(.012,.02,.05), mix(uColBgLight, uColDiskB, .38), uTheme);
  col = mix(col, nebT, neb*neb*.6);
  float neb2 = fbm(d.zy*1.7 - d.x*1.1 + 9.7);
  vec3 neb2T = mix(vec3(.05,.03,.09), mix(uColBgLight, vec3(.45,.35,.85), .40), uTheme);
  col = mix(col, neb2T, neb2*neb2*.45);
  /* 三层星场:远近错落出视差 */
  col += starLayer(d, 26.0, .90);
  col += starLayer(d, 61.0, .94)*.6;
  col += starLayer(d, 113.0, .96)*.4;
  return col;
}
vec3 diskCol(vec3 pc, vec3 dir, out float alpha){
  float r = length(pc.xz);
  float x = smoothstep(R_IN, R_IN+.55, r) * (1.0-smoothstep(R_OUT-3.2, R_OUT, r));
  float a = atan(pc.z, pc.x);
  float w = uTime*1.6/pow(max(r,1.0),1.5)*3.0;
  vec2 cs = vec2(cos(a-w), sin(a-w));
  float n = fbm(cs*r*.85 + r*.4);
  float dens = x*(.3+.7*n)*uDiskGain;
  vec3 tang = normalize(vec3(-pc.z, 0.0, pc.x));
  float dop = 1.0 + .62*dot(tang, -dir);
  float bright = min(pow(max(dop,.3), 3.0) * (R_IN*1.15/max(r,.5)), 4.0);
  /* 色彩纵深:内缘白热 → 外缘深色;多普勒色移:近侧偏冷、远侧偏暖 */
  float heat = 1.0 - smoothstep(R_IN, R_OUT, r);
  vec3 cin  = mix(uColDiskB, uColDiskA, heat);
  cin = mix(cin, vec3(1.0,.97,.90), pow(heat,3.0)*.75);
  vec3 cwh  = mix(uColWhiteB, uColWhiteA, heat);
  cwh = mix(cwh, vec3(.98,.99,1.0), pow(heat,3.0)*.75);
  vec3 shift = mix(vec3(1.10,.90,.80), vec3(.90,.96,1.08), clamp(dot(tang,-dir)*.5+.5, 0.0, 1.0));
  alpha = clamp(dens*1.6, 0.0, 1.0)*mix(.85, 1.0, uWhite);
  return mix(cin, cwh, uWhite) * shift * dens * bright * 1.6;
}
/* 爱因斯坦时空之兜:真 3D 场景在 JS 侧构建(网格平面下陷 + 墨线着色),着色器只保留写实渲染 */
void main(){
  vec2 ndc = vUv*2.0-1.0;
  vec2 q0 = ndc;
  /* 引力波涟漪:屏幕空间环形扰动(非等比空间,与投放坐标一致) */
  for(int i=0;i<6;i++){
    vec4 rp = uRip[i];
    if(rp.w > .003){
      vec2 d = ndc - rp.xy; float ds = length(d)+1e-4;
      float ring = sin(ds*20.0-rp.z*8.0)*exp(-ds*3.2)*exp(-rp.z*2.0)*rp.w;
      ndc += (d/ds)*ring*.05;
    }
  }
  vec2 an = vec2(ndc.x*uAspect, ndc.y);
  /* 指针引力手势:局部时空放大 */
  vec2 pp = vec2(uPointer.x*uAspect, uPointer.y);
  vec2 dp = an - pp;
  an = mix(an, pp, exp(-dot(dp,dp)*2.5)*.13*uPointerK);
  an -= uCenterOff;                 /* 构图:奇点略低于画面中心 */
  vec3 rd = normalize(uCamF + uCamR*an.x*uTanFov + uCamU*an.y*uTanFov);
  vec3 p = uCamPos, v = rd;
  /* 像素级初始抖动:把体积采样的阶梯条带打散成细噪 */
  float jit = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898,78.233)))*43758.5453);
  p += v * jit * .18;
  vec3 cr0 = cross(p, v);
  float h2 = dot(cr0,cr0)*uLens;
  float trans = 1.0, glow = 0.0, halo = 0.0;
  float pMin = length(uCamPos);      /* 射线近点:软边影 */
  vec3 acc = vec3(0.0);
  for(int i=0;i<260;i++){
    if(float(i) >= uSteps) break;
    float r2 = dot(p,p); float r = sqrt(r2);
    pMin = min(pMin, r);
    if(r < 1.02){ break; }
    if(r2 > 1200.0 && dot(p,v) > 0.0) break;
    /* 强场区小步长防隧穿;盘包围域内步长减半抗条带 */
    float inDisk = (r2 < 130.0 && abs(p.y) < 1.4) ? 1.0 : 0.0;
    float dt = clamp((r-.9)*.14, .018, .5);
    if(inDisk > .5) dt = min(dt, .14);
    float gd = (r-2.6)*1.05;                          /* 光子环:阴影外侧 r≈2.6(调柔) */
    glow = min(glow + dt*exp(-gd*gd), 1.6);
    float gd2 = (r-3.6)*.6;
    halo = min(halo + dt*exp(-gd2*gd2), 2.0);
    v += -1.5*h2*p/(r2*r2*r)*dt;
    vec3 pn = p + v*dt;
    /* 盘包围域内的体积大气:垂直高斯连续发光,给吸积盘厚度与包裹感 */
    if(r2 < 130.0 && abs(p.y) < 1.4){
      float rr = r;
      if(rr > 1.9 && rr < R_OUT){
        float h2v = .16 + .028*rr;              /* 薄大气:远景保住薄盘剪影,近景仍有包裹感 */
        float yv = p.y/h2v;
        float body = smoothstep(1.9, R_IN+.6, rr)*(1.0-smoothstep(R_OUT-3.6, R_OUT, rr));
        float angA = atan(p.z, p.x);
        float wA = uTime*1.6/pow(max(rr,1.0),1.5)*3.0;
        vec2 csA = vec2(cos(angA-wA), sin(angA-wA));
        float nA = fbm(csA*rr*.85 + rr*.4);
        float densA = body*exp(-yv*yv)*(.25+.75*nA)*uDiskGain;
        float heatA = pow(clamp(1.0-(rr-R_IN)/(R_OUT-R_IN), 0.0, 1.0), 1.5);
        vec3 cA = mix(uColDiskB*.5, uColDiskA, heatA);
        cA = mix(cA, uColWhiteA, uWhite*.85);
        acc += cA * densA * dt * .6 * trans;
        trans *= (1.0 - clamp(densA*dt*.7, 0.0, .5));
      }
    }
    if(p.y*pn.y < 0.0){
      float f = p.y/(p.y-pn.y);
      vec3 pc = mix(p, pn, f);
      float rc = length(pc);
      if(rc > R_IN && rc < R_OUT){
        float aA; vec3 dc = diskCol(pc, normalize(v), aA);
        acc += dc*trans;
        trans *= (1.0-aA*.9);
      }
    }
    float jr = length(p.xz);
    float jetA = atan(p.z, p.x);
    float jn = fbm(vec2(jetA*1.6, p.y*.5 - uTime*.6));
    float jet = exp(-jr*jr*1.4)*exp(-abs(p.y)*.28)*step(.7, abs(p.y));
    acc += uColWhiteA*(jet*(0.55+jn*.9)*uWhite)*dt*1.4;   /* 白洞双极喷流(湍流增艳) */
    if(uWhite > .01){                                      /* 白洞:周期性外扩冲击环 */
      float ringR = mod(uTime*1.8, 10.0);
      float shell = exp(-pow(r-ringR, 2.0)*5.0)*exp(-ringR*.2);
      acc += uColWhiteA*shell*uWhite*dt*.9;
    }
    if(trans < .04) break;                                 /* 已被盘完全不透明遮挡,省步数 */
    p = pn;
  }
  vec3 col = acc + background(normalize(v))*trans;
  /* 捕获分类:近点 < 光子球半径(≈1.5)的射线必然坠入;步数耗尽时 pMin 停在 1.0~1.5 也归入捕获,
     根治"步数预算耗尽导致阴影泛褐噪"的问题 */
  float captured = 1.0 - smoothstep(1.02, 1.5, pMin);
  col = mix(col, vec3(0.0), captured*(1.0-uWhite));
  col += uColWhiteA*captured*uWhite*(1.0 + 1.05*min(glow,1.4));   /* 白洞亮核(调柔) */
  float surv = 1.0 - captured*(1.0-uWhite);
  /* 光子环:窄亮主环 + 平方锐化,整体调柔(反馈:光圈太亮);宽域光晕瓣提供空间层次 */
  col += mix(uColDiskB, uColWhiteA, uWhite)*(glow*.13 + glow*glow*.24)*(1.0+uFeedFlash*3.0)*uGlowK*surv;
  col += mix(uColDiskB*.7, uColWhiteA*.8, uWhite)*halo*.10*uGlowK*surv;
  col = 1.0 - exp(-col*1.3);                         /* 曝光压缩 */
  col *= 1.0 - .34*pow(dot(q0,q0)*.55, 1.4);         /* 暗角 */
  gl_FragColor = vec4(col, 1.0);
}`;

/* 物质流粒子:position=(r0,角0,倾角) 打包;坠落与喷发两套轨迹按 uWhite 混合,指针手势做屏幕空间牵引 */
const PT_VERT = `
attribute vec2 aExtra;
uniform float uTime, uWhite, uGrav, uDens, uPx, uTanFov, uTheme;
uniform vec3 uCamR, uCamU, uColIn, uColOut, uColInW, uColOutW;
uniform vec2 uPointer;
uniform float uPointerK;
varying vec3 vCol; varying float vA;
void main(){
  float seed = aExtra.x, sz = aExtra.y;
  float sp = (.05 + .09*fract(seed*7.31))*uGrav;
  float t = fract(uTime*sp*(.6+.8*fract(seed*3.7)) + seed);
  float r0 = position.x, a0 = position.y, incl = position.z;
  float rIn = mix(r0, 1.35, pow(t, 1.6));
  float om = 2.4/pow(max(rIn,1.2), 1.5);
  float ang = a0 - uTime*om*2.0;
  vec3 pin = vec3(cos(ang)*rIn, sin(incl*6.28)*rIn*.07*(1.0-t), sin(ang)*rIn);
  float rEj = mix(1.5, r0*1.55, pow(t, .8));
  float ang2 = a0 + uTime*.15;
  vec3 pout = vec3(cos(ang2)*rEj, sign(incl-.5)*pow(t,1.5)*r0*.95, sin(ang2)*rEj);
  vec3 p = mix(pin, pout, uWhite);
  vec4 mv = modelViewMatrix*vec4(p, 1.0);
  /* 指针引力手势(屏幕空间近似牵引) */
  vec2 ndc = (projectionMatrix*mv).xy/max((projectionMatrix*mv).w, .001);
  vec2 dpv = uPointer - ndc;
  float pull = exp(-dot(dpv,dpv)*6.0)*uPointerK;
  p += (uCamR*dpv.x + uCamU*dpv.y)*(length(mv.xyz)*uTanFov)*pull*.8;
  mv = modelViewMatrix*vec4(p, 1.0);
  float rc = mix(rIn, rEj, uWhite);
  float heat = 1.0 - smoothstep(1.7, r0, rc);
  vCol = mix(mix(uColOut, uColIn, heat), mix(uColOutW, uColInW, heat), uWhite);
  float aIn = smoothstep(1.42, 1.85, rIn)*smoothstep(0.0, .06, t);
  float aOut = (1.0 - smoothstep(.72, 1.0, t));
  vA = mix(aIn, aOut, uWhite)*.85*uDens*mix(1.0, .68, uTheme0);
  gl_PointSize = clamp(sz*uPx*(120.0/max(-mv.z,.1))*(1.0+heat*.7), 1.0, 46.0);
  gl_Position = projectionMatrix*mv;
}`;
const PT_FRAG = `
varying vec3 vCol; varying float vA;
void main(){
  vec2 d = gl_PointCoord - .5;
  float a = exp(-dot(d,d)*10.0)*vA;
  if(a < .015) discard;
  gl_FragColor = vec4(vCol*a, a);
}`;

/* ============================================================
 * 以下为页面编排:设置/HUD/交互(与渲染核心的接缝仅限 ABYSS 实例)
 * ============================================================ */
const $ = s=>document.querySelector(s);
const KEY = "humanoid-abyss-settings-v1";
const DEFAULTS = { form:"auto", mode:"realistic", style:"amber", glow:100, lens:100, time:100,
  parallax:true, drag:true, items:true, hum:false, clean:false, quality:"auto", panelOpen:true };
let settings = { ...DEFAULTS };
try{ Object.assign(settings, JSON.parse(localStorage.getItem(KEY)) || {}); }catch(e){}
settings.lens = clamp(settings.lens, 50, 150);   /* 旧存档兼容:透镜滑条上限已从 200 收到 150 */
const save = ()=>{ try{ localStorage.setItem(KEY, JSON.stringify(settings)); }catch(e){} };

let ABYSS = null, THREE_ = null;
let arcDark = false;          // 深色主题:白洞形态
let lastT = 0, running = true;
let camTarget = { r: 13.5, e: .18 };
const portraitFit = ()=> innerHeight > innerWidth ? 19.5 : 13.5;   /* 竖屏默认拉远 */
let userElev = 0;
let idleAcc = 0;

function themeName(){ try{ return localStorage.getItem("site-theme") || "light"; }catch(e){ return "light"; } }
function applyTheme(){
  const t = themeName();
  arcDark = t === "dark";
  document.documentElement.setAttribute("data-theme", t);
  document.body.setAttribute("data-theme", t);
  $("#sgThemeBtn").textContent = t === "dark" ? "☀" : "☾";
  if(ABYSS) ABYSS.themeMixTarget = t === "light" ? 1 : 0;
  refreshWhite();
}
function refreshWhite(){
  if(!ABYSS) return;
  if(settings.form === "bh") ABYSS.whiteTarget = 0;
  else if(settings.form === "wh") ABYSS.whiteTarget = 1;
  else ABYSS.whiteTarget = arcDark ? 1 : 0;
}
function applyMode(){
  const field = settings.mode === "field";
  if(ABYSS) ABYSS.lineMixTarget = field ? 1 : 0;
  $("#sgGrpStyle").style.display = field ? "none" : "";
  $("#sgRowGlow").style.display = field ? "none" : "";
}
function applySettings(){
  if(!ABYSS) return;
  ABYSS.glowK = settings.glow/100;
  ABYSS.lens = settings.lens/100;
  ABYSS.timeScale = settings.time/100;
  ABYSS.parallax = settings.parallax;
  ABYSS.setStyle(settings.style);
  if(settings.quality !== "auto") ABYSS.setTier(settings.quality);
  document.body.classList.toggle("sg-clean", !!settings.clean);
  $("#sgPanel").classList.toggle("closed", !settings.panelOpen);
  applyMode();
  updateHum();
  refreshWhite();
  save();
}
function loop(t){
  requestAnimationFrame(loop);
  if(!running || !ABYSS) return;
  const dt = Math.min((t - lastT)/1000 || .016, .05); lastT = t;
  ABYSS.cam.r += (camTarget.r - ABYSS.cam.r)*Math.min(1, dt*3);
  ABYSS.cam.elev += (camTarget.e + userElev - ABYSS.cam.elev)*Math.min(1, dt*3);
  ABYSS.frame(dt, t/1000);
  tickFps(t);
  if(humOn) humFrame();
  /* 天外来客:环境自动投放(路由由渲染核心按当前模式决定) */
  ABYSS.tickAmbient(dt, settings.items && !RM);
  /* 闲置 5s:HUD 淡出 */
  idleAcc += dt;
  if(idleAcc > 5 && !document.body.classList.contains("sg-idle")) document.body.classList.add("sg-idle");
}

/* ---- FPS 表与自动画质 ---- */
let fpsN = 0, fpsT = 0, probe = { n:0, t:0, done:false };
function tickFps(t){
  fpsN++;
  if(!probe.done){ probe.n++; probe.t ||= t;
    if(probe.n >= 55){
      probe.done = true;
      const fps = probe.n/((t-probe.t)/1000);
      if(settings.quality === "auto"){
        const tier = fps > 48 ? "high" : fps > 28 ? "mid" : "low";
        ABYSS.setTier(tier);
      }
    }
  }
  if(t - fpsT > 600){
    $("#sgFps").textContent = Math.round(fpsN*1000/(t-fpsT)) + " FPS · " +
      (settings.quality === "auto" ? "自动·" : "") + (TIERS[ABYSS.tier]?.name || ABYSS.tier);
    fpsN = 0; fpsT = t;
  }
}

/* ---- 低频嗡鸣:WebAudio 合成,零素材 ---- */
let humCtx = null, humOsc = null, humGain = null, humOn = false;
function updateHum(){
  const want = !!settings.hum;
  if(want && !humCtx){
    try{
      humCtx = new (window.AudioContext||window.webkitAudioContext)();
      humGain = humCtx.createGain(); humGain.gain.value = 0;
      const lp = humCtx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 220;
      humOsc = humCtx.createOscillator(); humOsc.type = "sine"; humOsc.frequency.value = 42;
      const o2 = humCtx.createOscillator(); o2.type = "sine"; o2.frequency.value = 43.6;
      humOsc.connect(lp); o2.connect(lp); lp.connect(humGain); humGain.connect(humCtx.destination);
      humOsc.start(); o2.start();
    }catch(e){ settings.hum = false; }
  }
  if(humCtx){
    if(humCtx.state === "suspended") humCtx.resume();
    humGain.gain.setTargetAtTime(want ? .05 : 0, humCtx.currentTime, .3);
  }
  humOn = want && !!humCtx;
}
function humFrame(){
  if(!humCtx) return;
  const prox = 1 - smoothstep(3.5, 15, ABYSS.cam.r);
  humGain.gain.setTargetAtTime(.03 + .06*prox, humCtx.currentTime, .2);
  humOsc.frequency.setTargetAtTime(42 - 14*prox, humCtx.currentTime, .25);
}

/* ---- 画布交互:拖拽环视 / 点击投放 / 指针手势 / 滚轮缩放 ---- */
function bindStage(canvas){
  let down = null, moved = 0, lastX = 0, lastY = 0, lastMoveT = 0, velX = 0;
  const toNDC = e=>({ x:(e.clientX/innerWidth)*2-1, y:1-(e.clientY/innerHeight)*2 });
  canvas.addEventListener("pointerdown", e=>{
    down = { x:e.clientX, y:e.clientY, t:performance.now() };
    moved = 0; velX = 0; lastX = e.clientX; lastY = e.clientY; lastMoveT = down.t;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove", e=>{
    const n = toNDC(e);
    ABYSS.ptr.x = n.x; ABYSS.ptr.y = n.y;
    ABYSS.ptr.kTarget = Math.min(1, ABYSS.ptr.kTarget + .06);
    if(!down) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    moved += Math.abs(dx) + Math.abs(dy);
    const now = performance.now(), mdt = Math.max(now - lastMoveT, 8);
    if(settings.drag){
      ABYSS.cam.azim -= dx*.005;
      userElev = clamp(userElev + dy*.0022, -.35, .35);
      velX = -dx/mdt;
    }
    lastX = e.clientX; lastY = e.clientY; lastMoveT = now;
  });
  const end = e=>{
    if(!down) return;
    const quick = performance.now() - down.t < 320 && moved < 7;
    if(quick){
      const n = toNDC(e);
      ABYSS.spawnRipple(n.x, n.y);
      ABYSS.spawnItemFromRay(ABYSS.uni.uCamPos.value.clone(), rayFromNDC(n.x, n.y));
      if(!RM){ document.body.classList.remove("sg-shake"); void document.body.offsetWidth; document.body.classList.add("sg-shake"); }
    }else{
      ABYSS.cam.azimV = clamp(velX*.012, -.09, .09);
    }
    down = null;
  };
  canvas.addEventListener("pointerup", end);
  canvas.addEventListener("pointercancel", ()=>{ down = null; });
  canvas.addEventListener("wheel", e=>{
    e.preventDefault();
    camTarget.r = clamp(camTarget.r*(1 + e.deltaY*.001), 4.5, 20);
  }, { passive:false });
}
function rayFromNDC(x, y){
  const u = ABYSS.uni;
  const d = new THREE_.Vector3()
    .addScaledVector(u.uCamF.value, 1)
    .addScaledVector(u.uCamR.value, x*u.aspect*u.uTanFov.value);
  d.addScaledVector(u.uCamU.value, y*u.uTanFov.value).normalize();
  return d;
}

/* ---- 面板 / HUD 绑定 ---- */
function bindUI(canvas){
  const panel = $("#sgPanel");
  $("#sgFab").addEventListener("click", ()=>{
    if(settings.clean){
      settings.clean = false;
      document.body.classList.remove("sg-clean");
      document.querySelectorAll('.sg-tgl[data-k="clean"]').forEach(t=>t.classList.remove("on"));
    }
    settings.panelOpen = true;
    panel.classList.remove("closed");
    save();
  });
  $("#sgCollapse").addEventListener("click", ()=>{
    settings.panelOpen = false;
    panel.classList.add("closed");
    save();
  });
  document.querySelectorAll(".sg-seg").forEach(seg=>{
    seg.addEventListener("click", e=>{
      const b = e.target.closest("button"); if(!b) return;
      seg.querySelectorAll("button").forEach(x=>x.classList.toggle("on", x===b));
      const k = seg.dataset.k, v = b.dataset.v;
      if(k === "form"){ settings.form = v; refreshWhite(); }
      else if(k === "quality"){ settings.quality = v; if(v !== "auto") ABYSS.setTier(v); }
      else if(k === "mode"){
        settings.mode = v;
        ABYSS.clearItems();                       /* 换模式清场:两种模式的物品分属两个世界 */
        if(v === "field"){                        /* 兜要俯视才看得到:切到偏高机位 */
          camTarget.e = .5;
          userElev = Math.min(userElev, .12);
        }else{
          camTarget.e = .18;
        }
        applyMode();
      }
      else settings[k] = v;
      save();
    });
  });
  document.querySelectorAll(".sg-tgl").forEach(tg=>{
    tg.addEventListener("click", ()=>{
      const k = tg.dataset.k;
      settings[k] = !settings[k];
      tg.classList.toggle("on", settings[k]);
      if(k === "clean") document.body.classList.toggle("sg-clean", settings.clean);
      if(k === "hum") updateHum();
      save();
    });
  });
  document.querySelectorAll("input[type=range]").forEach(inp=>{
    inp.addEventListener("input", ()=>{
      const k = inp.dataset.k;
      settings[k] = +inp.value;
      document.querySelector(`output[data-o="${k}"]`).textContent = inp.value + "%";
      if(k === "time") ABYSS.timeScale = settings.time/100;
      if(k === "lens") ABYSS.lens = settings.lens/100;
      if(k === "glow") ABYSS.glowK = settings.glow/100;
      save();
    });
  });
  $("#sgReset").addEventListener("click", ()=>{
    settings = { ...DEFAULTS };
    save();
    location.reload();
  });
  /* 初始控件状态回填 */
  document.querySelectorAll(".sg-seg").forEach(seg=>{
    seg.querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.v === String(settings[seg.dataset.k])));
  });
  document.querySelectorAll(".sg-tgl").forEach(tg=>tg.classList.toggle("on", !!settings[tg.dataset.k]));
  document.querySelectorAll("input[type=range]").forEach(inp=>{
    inp.value = settings[inp.dataset.k];
    document.querySelector(`output[data-o="${inp.dataset.k}"]`).textContent = settings[inp.dataset.k] + "%";
  });
  /* 主题切换(写全站键,其他页面同步) */
  $("#sgThemeBtn").addEventListener("click", ()=>{
    const t = themeName() === "dark" ? "light" : "dark";
    try{ localStorage.setItem("site-theme", t); }catch(e){}
    applyTheme();
  });
  addEventListener("storage", e=>{ if(e.key === "site-theme") applyTheme(); });
  /* 键盘:H 纯净 / 空格 凝固 / R 复位 */
  addEventListener("keydown", e=>{
    if(e.target.tagName === "INPUT") return;
    if(e.key === "h" || e.key === "H"){
      settings.clean = !settings.clean;
      document.body.classList.toggle("sg-clean", settings.clean);
      document.querySelectorAll('.sg-tgl[data-k="clean"]').forEach(t=>t.classList.toggle("on", settings.clean));
      save();
    }
    if(e.code === "Space"){ e.preventDefault(); ABYSS.timeScale = ABYSS.timeScale === 0 ? (settings.time/100 || 1) : 0; }
    if(e.key === "r" || e.key === "R"){ userElev = 0; ABYSS.cam.azimV = 0; camTarget = { r: portraitFit(), e: .18 }; ABYSS.cam.azim = .6; }
    if(e.key === "Escape"){ settings.panelOpen = false; panel.classList.add("closed"); save(); }
  });
  /* 闲置检测:任何输入唤醒 HUD */
  ["pointermove","pointerdown","keydown","wheel"].forEach(ev=>
    addEventListener(ev, ()=>{ idleAcc = 0; document.body.classList.remove("sg-idle"); }, { passive:true }));
  /* 离屏暂停(站内纪律) */
  document.addEventListener("visibilitychange", ()=>{
    running = !document.hidden;
    if(running){ lastT = performance.now(); }
  });
  bindStage(canvas);
}

/* ---- 启动 ---- */
async function boot(){
  const canvas = $("#sgStage");
  let T = null;
  try{ T = await OrbitKit.loadThree($("#sgLoadTxt")); }
  catch(e){
    $("#sgLoader").classList.add("hide");
    $("#sgFail").style.display = "block";
    return;
  }
  THREE_ = T;
  try{ ABYSS = new Abyss(canvas, T); }
  catch(e){
    $("#sgLoader").classList.add("hide");
    $("#sgFail").style.display = "block";
    return;
  }
  window.ABYSS = ABYSS;   /* ← API 边界:未来提取 abyss.js 后由首页以低强度待机模式复用 */
  applyTheme();
  applySettings();
  if(innerWidth < 700){   /* 小屏默认收回控制台(不写入记忆,桌面端不受影响) */
    $("#sgPanel").classList.add("closed");
  }
  camTarget.r = portraitFit();
  ABYSS.cam.r = camTarget.r;
  bindUI(canvas);
  $("#sgLoader").classList.add("hide");
  lastT = performance.now();
  requestAnimationFrame(loop);
}
boot();
</script>
