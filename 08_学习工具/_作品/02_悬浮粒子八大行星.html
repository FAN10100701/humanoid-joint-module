<!DOCTYPE html>
<!-- 个人作品 · 悬浮粒子八大行星:粒子球体绕日,点击行星弹出玻璃物理讲解面板 -->
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>悬浮粒子八大行星 · 个人作品台</title></head>
<body>
<canvas id="stage"></canvas>
<div class="hud hud-top"><a href="../14_个人作品台.html">‹ 作品台</a>
<span class="hud-title">悬浮粒子八大行星<small>POINTS PARTICLES · 点击行星看物理</small></span><span id="state"></span>
<button id="orbitBtn">⏸ 暂停公转</button></div>
<div class="hud hud-panel" id="panel"><h4 id="pName"></h4><div id="pBody"></div></div>
<div class="hud hud-bottom">拖动环视 · 滚轮缩放 · 点击任一行星弹出玻璃讲解卡</div>
<div id="loader"><div class="ring"></div><div id="loadTxt">加载中…</div></div>
<script src="../../_assets/orbit-kit.js"></script>
<script type="module">
const K = window.OrbitKit; K.hud();
const $ = (id)=>document.getElementById(id);
const DATA = [
  { n:"水星 Mercury", r:2.6, size:0.34, hue:0x9c8f7f, d:"公转 88 天 · 表面温差 -173~427℃ · 无大气层保热,昼夜温差全太阳系最大。物理梗:靠「潮汐锁定」3:2 自转共振,每自转 3 圈恰好公转 2 圈。" },
  { n:"金星 Venus", r:3.4, size:0.5, hue:0xe8c37a, d:"自转方向与众不同(逆行)且一天比一年还长(自转 243 天 > 公转 225 天)。90 倍地球气压的 CO₂ 浓汤造就 465℃ 超级温室效应。" },
  { n:"地球 Earth", r:4.3, size:0.52, hue:0x5fa8ff, d:"目前已知唯一有液态水海洋与板块运动的行星。磁场是隐形护盾:偏转太阳风带电粒子,才留住了大气与生命。" },
  { n:"火星 Mars", r:5.2, size:0.4, hue:0xe0714a, d:"奥林帕斯山高约 22km,是珠峰的 2.5 倍——因为没有板块运动,热点喷发可以原地堆几亿年。重力仅地球 38%,跳起来是地球的 2.6 倍高。" },
  { n:"木星 Jupiter", r:6.8, size:0.95, hue:0xd8a06a, d:"质量是其余七颗行星总和的 2.5 倍。大红斑是持续 350+ 年的反气旋风暴。物理梗:它用引力「清扫」彗星,充当内太阳系的保镖。" },
  { n:"土星 Saturn", r:8.2, size:0.85, hue:0xe6d3a3, d:"光环主要由水冰碎块组成,厚度平均仅 10~1000m,直径却 28 万 km——按比例比 A4 纸还薄。平均密度 0.687 g/cm³,比水还轻。" },
  { n:"天王星 Uranus", r:9.5, size:0.65, hue:0x9be3e3, d:"躺着自转:自转轴倾角 98°,可能源于早期一次巨大撞击。季节各长达 21 年,极夜持续地球的 42 年。" },
  { n:"海王星 Neptune", r:10.8, size:0.63, hue:0x4f74e8, d:"风速可达 2100 km/h,全太阳系最快——离太阳最远反而风最狂,能量来源仍是未解之谜。它先被数学算出来,再被望远镜看到。" }
];
try{
  const THREE = await K.loadThree($("loadTxt"));
  const renderer = new THREE.WebGLRenderer({ canvas:$("stage"), antialias:true });
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x04060c, 0.02);
  const cam = new THREE.PerspectiveCamera(56, 1, 0.1, 300);
  K.fit(renderer, cam);
  scene.add(new THREE.AmbientLight(0x334466, 1.2));
  const sun = new THREE.PointLight(0xfff0d8, 500, 120, 1.7); scene.add(sun);

  /* 太阳:发光粒子球 */
  function particleSphere(radius, count, color, size){
    const pos = new Float32Array(count*3);
    for(let i = 0; i < count; i++){
      const u = Math.random()*2-1, th = Math.random()*Math.PI*2, rr = radius*Math.cbrt(0.75+Math.random()*0.25);
      const s = Math.sqrt(1-u*u);
      pos[i*3] = rr*s*Math.cos(th); pos[i*3+1] = rr*u; pos[i*3+2] = rr*s*Math.sin(th);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    return new THREE.Points(g, new THREE.PointsMaterial({ color, size, transparent:true, opacity:0.85, blending:THREE.AdditiveBlending, depthWrite:false }));
  }
  scene.add(particleSphere(0.9, 2600, 0xffdca8, 0.045));
  /* 星尘背景 */
  const bg = particleSphere; /* reuse factory for random cloud */
  (function(){
    const pos = new Float32Array(1500*3);
    for(let i = 0; i < 1500; i++){
      const r = 40 + Math.random()*80, u = Math.random()*2-1, th = Math.random()*Math.PI*2, s = Math.sqrt(1-u*u);
      pos[i*3] = r*s*Math.cos(th); pos[i*3+1] = r*u*0.6; pos[i*3+2] = r*s*Math.sin(th);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color:0x8fb7e8, size:0.35, transparent:true, opacity:0.5 })));
  })();

  /* 八大行星:粒子球 + 轨道环 */
  const planets = [];
  const orbitGroup = new THREE.Group(); scene.add(orbitGroup);
  DATA.forEach(function(d, i){
    const pts = particleSphere(d.size, 900, d.hue, d.size*0.09);
    orbitGroup.add(pts);
    /* 轨道细环 */
    const seg = 128, arr = new Float32Array(seg*3);
    for(let k = 0; k < seg; k++){
      const a = k/seg*Math.PI*2;
      arr[k*3] = Math.cos(a)*d.r; arr[k*3+1] = 0; arr[k*3+2] = Math.sin(a)*d.r;
    }
    const og = new THREE.BufferGeometry();
    og.setAttribute("position", new THREE.BufferAttribute(arr, 3));
    orbitGroup.add(new THREE.LineLoop(og, new THREE.LineBasicMaterial({ color:d.hue, transparent:true, opacity:0.16 })));
    planets.push({ d:d, mesh:pts, ang:Math.random()*Math.PI*2, speed:0.5/Math.sqrt(d.r) });
  });

  /* 相机 */
  let yaw = 0.7, pitch = 0.5, dist = 17, tY = yaw, tP = pitch, tD = dist, drag = false, px = 0, py = 0;
  $("stage").addEventListener("pointerdown", e=>{ drag = true; px = e.clientX; py = e.clientY; });
  addEventListener("pointermove", e=>{ if(!drag) return; tY += (e.clientX-px)*0.005; tP = Math.max(-0.2, Math.min(1.3, tP+(e.clientY-py)*0.004)); px = e.clientX; py = e.clientY; });
  addEventListener("pointerup", ()=> drag = false);
  addEventListener("wheel", e=>{ tD = Math.max(6, Math.min(40, tD + e.deltaY*0.01)); }, { passive:true });

  /* 点击行星 → 玻璃讲解 */
  const ray = new THREE.Raycaster(); ray.params.Points.threshold = 0.5;
  let orbiting = true;
  $("stage").addEventListener("click", function(e){
    const m = new THREE.Vector2((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1);
    ray.setFromCamera(m, cam);
    let best = null, bd = 1e9;
    planets.forEach(function(p){
      const wp = new THREE.Vector3(); p.mesh.getWorldPosition(wp);
      const dist2 = wp.distanceToSquared(ray.ray.origin);
      const toV = wp.clone().sub(ray.ray.origin);
      const proj = toV.dot(ray.ray.direction);
      if(proj < 0) return;
      const perp = toV.sub(ray.ray.direction.clone().multiplyScalar(proj)).length();
      if(perp < p.d.size*1.6 && dist2 < bd){ bd = dist2; best = p; }
    });
    if(best){
      $("pName").textContent = best.d.n;
      $("pBody").textContent = best.d.d;
      $("panel").classList.add("open");
    }else{
      $("panel").classList.remove("open");
    }
  });
  $("orbitBtn").onclick = function(){ orbiting = !orbiting; $("orbitBtn").textContent = orbiting ? "⏸ 暂停公转" : "▶ 恢复公转"; };

  let last = performance.now(), fr = 0, ft = last;
  (function loop(now){
    requestAnimationFrame(loop);
    const dt = Math.min((now-last)/1000, 0.05); last = now;
    if(orbiting) planets.forEach(function(p){ p.ang += dt*p.speed; });
    planets.forEach(function(p){
      p.mesh.position.set(Math.cos(p.ang)*p.d.r, Math.sin(p.ang*0.9)*0.3, Math.sin(p.ang)*p.d.r);
    });
    yaw += (tY-yaw)*0.07; pitch += (tP-pitch)*0.07; dist += (tD-dist)*0.08;
    if(!drag) tY += dt*0.03;
    cam.position.set(Math.cos(yaw)*Math.cos(pitch)*dist, Math.sin(pitch)*dist, Math.sin(yaw)*Math.cos(pitch)*dist);
    cam.lookAt(0,0,0);
    renderer.render(scene, cam);
    fr++;
    if(now-ft > 1000){ $("state").textContent = fr + " fps · 8 行星"; fr = 0; ft = now; }
  })(last);
  $("loader").classList.add("hide");
}catch(err){
  $("loadTxt").innerHTML = "three.js 加载失败:" + (err&&err.message||err) + "<br>请用本地服务器访问";
}
</script></body></html>
