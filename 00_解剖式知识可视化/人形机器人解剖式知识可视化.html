*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;overflow:hidden}
:root{
--bg1:#eef1f6;--bg2:#dde3ec;--bg3:#f7f9fc;
--ink:#1a1d23;--muted:#5a6270;--faint:#8a94a4;
--rule:rgba(0,0,0,.07);--rule2:rgba(0,0,0,.12);
--accent:#0066cc;--accent2:#3b8bef;--accent-g:rgba(0,102,204,.12);
--metal1:#f0f2f6;--metal2:#d8dde5;--metal3:#b8c0cc;--metal4:#8a94a4;
--dark:#2c323d;--dark2:#3d4452;
--ok:#16a34a;--warn:#d97706;--bad:#dc2626;
--sh1:0 2px 8px rgba(0,0,0,.06);--sh2:0 8px 30px rgba(0,0,0,.12);--sh3:0 20px 60px rgba(0,0,0,.18);
--r:10px;--mono:"SF Mono",ui-monospace,"Cascadia Code",Menlo,Consolas,monospace;
}
body{background:radial-gradient(ellipse at 40% 30%,#fff 0%,var(--bg1) 50%,var(--bg2) 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}

/* ===== 顶栏 ===== */
.tb{height:54px;display:flex;align-items:center;padding:0 20px;gap:16px;background:rgba(255,255,255,.85);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border-bottom:1px solid var(--rule);position:relative;z-index:100}
.logo{font-size:15px;font-weight:700;letter-spacing:-.2px;display:flex;align-items:center;gap:8px}
.logo .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent-g),0 0 0 3px rgba(0,102,204,.12)}
.sep{width:1px;height:20px;background:var(--rule)}
.msw{display:flex;gap:2px;background:rgba(0,0,0,.04);border-radius:10px;padding:2px}
.msw button{border:none;background:transparent;color:var(--muted);font-size:12.5px;font-weight:600;padding:6px 14px;border-radius:8px;cursor:pointer;transition:.16s;font-family:inherit}
.msw button:hover{color:var(--ink)}.msw button.on{background:#fff;color:var(--accent);box-shadow:var(--sh1)}
.tbr{margin-left:auto;display:flex;gap:6px}
.vb{border:1px solid var(--rule);background:rgba(255,255,255,.9);color:var(--muted);font-size:12px;padding:6px 12px;border-radius:8px;cursor:pointer;transition:.14s;font-family:inherit;display:flex;align-items:center;gap:5px;font-weight:500}
.vb:hover{color:var(--ink);background:#fff;box-shadow:var(--sh1)}.vb.on{color:#fff;background:var(--accent);border-color:var(--accent)}

/* ===== 三栏布局（高度减去顶栏54px+底部栏44px） =====
   列宽用 CSS 变量：侧边栏拖宽功能通过 JS 修改变量并持久化到 localStorage */
:root{--nav-w:250px;--det-w:360px}   /* 左导航/右详情栏默认宽度（拖宽范围见 JS 宏 NAV_W_MIN/MAX、DET_W_MIN/MAX） */
.app{display:grid;grid-template-columns:var(--nav-w) 1fr var(--det-w);height:calc(100vh - 54px - 44px)}
/* 桌面端侧边栏收起：点击顶栏 ◀ ▶ 按钮切换（仅桌面生效，移动端走抽屉） */
@media(min-width:861px){
  body.nav-off .app{grid-template-columns:0 1fr var(--det-w)}
  body.nav-off .nav{display:none}
  body.det-off .app{grid-template-columns:var(--nav-w) 1fr 0}
  body.det-off .det{display:none}
  body.nav-off .rz-nav,body.det-off .rz-det{display:none}   /* 收起的栏隐藏其拖宽把手 */
}
/* ===== 侧边栏拖宽把手（桌面端栏边缘，拖动调整栏宽） ===== */
/* 三栏子项显式定位（新增把手子项后避免 grid 自动放置错乱） */
.app>.nav{grid-column:1;grid-row:1}
.app>.stg{grid-column:2;grid-row:1}
.app>.det{grid-column:3;grid-row:1}
.rz{position:relative;z-index:20;background:transparent;cursor:col-resize;user-select:none;-webkit-user-select:none;touch-action:none}
.rz::after{content:'';position:absolute;top:50%;width:3px;height:34px;transform:translateY(-50%);border-radius:2px;background:var(--rule);transition:background .15s,height .15s}
.rz:hover::after,.rz.drag::after{background:var(--accent);height:52px}   /* 悬停/拖拽时把手高亮变长 */
.rz-nav{grid-column:1;grid-row:1;justify-self:end;width:7px;margin-right:-7px}   /* 贴在导航栏右缘 */
.rz-det{grid-column:3;grid-row:1;justify-self:start;width:7px;margin-left:-7px}  /* 贴在详情栏左缘 */
.nav{border-right:1px solid var(--rule);overflow-y:auto;padding:14px 10px;background:rgba(255,255,255,.4)}
.nav::-webkit-scrollbar{width:3px}.nav::-webkit-scrollbar-thumb{background:var(--rule);border-radius:2px}
.nt{font-size:10.5px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.8px;padding:6px 8px 10px}
/* 导航搜索框：快速定位部件/知识点 */
.nav-search{width:100%;margin:0 0 8px;padding:7px 10px;border:1px solid var(--rule);border-radius:8px;background:rgba(255,255,255,.7);color:var(--ink);font-size:12.5px;font-family:inherit;outline:none}
.nav-search:focus{border-color:var(--accent)}
body[data-theme="dark"] .nav-search{background:rgba(20,28,42,.7);color:var(--ink)}
.ng{margin-bottom:2px}
.ngh{display:flex;align-items:center;gap:7px;padding:7px 8px;border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:600;transition:.12s}
.ngh:hover{background:rgba(0,0,0,.03)}.ngh .cv{width:12px;height:12px;color:var(--faint);transition:transform .18s;flex-shrink:0}
.ng.open .cv{transform:rotate(90deg)}
.ni{padding-left:10px;overflow:hidden;max-height:0;transition:max-height .3s ease}.ng.open .ni{max-height:800px}
.nit{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--muted);transition:.12s;margin:1px 0}
.nit:hover{background:rgba(0,0,0,.025);color:var(--ink)}.nit.on{background:var(--accent-g);color:var(--accent);font-weight:600}
.nd{width:6px;height:6px;border-radius:50%;background:var(--faint);flex-shrink:0}.nit.on .nd{background:var(--accent);box-shadow:0 0 6px var(--accent-g)}
/* 当前机型没有对应 3D 部件的导航项：降透明度并显示"无3D"角标，避免点击误导 */
.nit.no3d{opacity:.5}
.nit.no3d::after{content:'无3D';font-size:10px;line-height:1;color:var(--faint);border:1px solid var(--rule2);border-radius:8px;padding:2px 5px;margin-left:auto;flex-shrink:0}
.nit.no3d:hover::after{color:var(--muted)}

/* ===== 中央3D舞台 ===== */
.stg{position:relative;overflow:hidden;background:
radial-gradient(ellipse at 50% 40%,rgba(255,255,255,.9) 0%,rgba(240,244,250,.5) 60%,transparent 100%),
linear-gradient(180deg,#f8fafc 0%,#e8edf5 100%);
perspective:1800px;-webkit-perspective:1800px;perspective-origin:50% 45%}
.gbg{position:absolute;inset:0;pointer-events:none;opacity:.25;background-image:
linear-gradient(rgba(0,50,120,.04) 1px,transparent 1px),
linear-gradient(90deg,rgba(0,50,120,.04) 1px,transparent 1px);background-size:40px 40px}
.gbg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 80%,rgba(0,0,0,.08) 0%,transparent 60%)}
.sbd{position:absolute;right:18px;top:18px;z-index:10;padding:7px 15px;border-radius:20px;font-size:11.5px;font-weight:600;background:rgba(255,255,255,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--rule);color:var(--muted);box-shadow:var(--sh1)}
.sbd b{color:var(--ink);font-weight:700}
.hud{position:absolute;left:18px;bottom:18px;display:flex;gap:6px;z-index:10}
.hb{width:38px;height:38px;border-radius:10px;border:1px solid var(--rule);background:rgba(255,255,255,.9);backdrop-filter:blur(10px);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:.14s;font-size:16px;font-weight:600}
.hb:hover{color:var(--ink);background:#fff;box-shadow:var(--sh1)}.hb.on{color:var(--accent);border-color:var(--accent);background:var(--accent-g)}
.view-label{position:absolute;left:50%;top:18px;transform:translateX(-50%);z-index:10;font-size:11px;color:var(--faint);font-weight:500;letter-spacing:.5px}

/* 3D 舞台已直接使用 canvas#webgl 渲染，无需 CSS 3D 变换容器 */

/* ===== 右侧面板 ===== */
.det{border-left:1px solid var(--rule);overflow-y:auto;background:rgba(255,255,255,.5)}
.det::-webkit-scrollbar{width:4px}.det::-webkit-scrollbar-thumb{background:var(--rule);border-radius:2px}
.din{padding:20px 18px}
.crumb{font-size:11px;color:var(--faint);margin-bottom:10px;display:flex;gap:5px;align-items:center;flex-wrap:wrap}.crumb b{color:var(--muted);font-weight:500}.crumb .arr{color:var(--rule2)}
.dt1{font-size:22px;font-weight:800;letter-spacing:-.4px;margin-bottom:3px;line-height:1.2;color:var(--ink)}
.dt2{font-size:12.5px;color:var(--muted);margin-bottom:18px;letter-spacing:.3px}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:20px}
.pc{background:var(--bg3);border:1px solid var(--rule);border-radius:9px;padding:10px 12px;transition:.2s}
.pc:hover{border-color:var(--accent-g);box-shadow:0 0 0 3px var(--accent-g)}
.pv{font-size:17px;font-weight:800;color:var(--accent);letter-spacing:-.2px;line-height:1.1}
.pk{font-size:10.5px;color:var(--faint);margin-top:3px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.sec{margin-bottom:20px}
.sh{font-size:11px;font-weight:800;color:var(--faint);text-transform:uppercase;letter-spacing:.8px;margin-bottom:9px;display:flex;align-items:center;gap:7px}
.sh::before{content:"";width:3px;height:11px;background:var(--accent);border-radius:2px}
.sp{font-size:13px;color:var(--muted);line-height:1.8;margin-bottom:8px}
.sp hl{color:var(--ink);font-weight:700;background:linear-gradient(180deg,transparent 60%,rgba(0,102,204,.12) 60%);padding:0 2px;border-radius:2px}
.sp sub{font-size:10.5px;color:var(--faint);font-weight:500}
.sp code{background:rgba(0,0,0,.04);padding:1px 5px;border-radius:4px;font-family:var(--mono);font-size:11.5px;color:var(--ink);font-weight:600}
.vtg{display:flex;flex-wrap:wrap;gap:6px}
.vt{font-size:10.5px;font-weight:600;padding:4px 10px;border-radius:6px;background:rgba(0,0,0,.03);color:var(--muted);border:1px solid var(--rule);transition:.12s}
.vt.m{background:var(--accent-g);color:var(--accent);border-color:transparent}
.vt:hover{background:rgba(0,0,0,.05);color:var(--ink)}
.anim-box{background:linear-gradient(135deg,#f8fafc 0%,#eef2f8 100%);border:1px solid var(--rule);border-radius:var(--r);padding:14px;margin-bottom:16px}
.anim-canvas{width:100%;height:110px;background:#fff;border-radius:8px;border:1px solid var(--rule);margin-bottom:10px;overflow:hidden;position:relative}
.anim-ctrl{display:flex;gap:6px}
.ab{flex:1;padding:7px;border-radius:7px;border:1px solid var(--rule);background:#fff;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;transition:.12s;font-family:inherit}
.ab:hover{color:var(--ink);border-color:var(--rule2)}.ab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.tip{font-size:11px;color:var(--faint);padding:8px 12px;background:rgba(0,102,204,.05);border-radius:8px;border-left:3px solid var(--accent);margin-bottom:16px;line-height:1.6}

/* ===== 拆解零件详情卡片（点击零件后右侧弹出的详解卡片） ===== */
#tdCard{position:relative;margin-bottom:16px;border-radius:10px;overflow:hidden;border:1px solid var(--rule2);background:linear-gradient(135deg,rgba(0,102,204,.07),rgba(0,102,204,.02));box-shadow:0 2px 10px rgba(0,0,0,.07)}
#tdCard .tdc-head{display:flex;align-items:center;gap:8px;padding:9px 12px;background:rgba(0,102,204,.09);border-bottom:1px solid var(--rule2)}
#tdCard .tdc-ic{font-size:15px;line-height:1}
#tdCard .tdc-name{font-size:12.5px;font-weight:700;color:var(--ink);flex:1;line-height:1.4}
#tdCard .tdc-x{cursor:pointer;color:var(--muted);font-size:11px;padding:2px 7px;border-radius:5px;transition:.12s;white-space:nowrap}
#tdCard .tdc-x:hover{color:var(--ink);background:rgba(0,0,0,.08)}
#tdCard .tdc-body{padding:10px 12px;font-size:11.5px;line-height:1.75;color:var(--muted)}
#tdCard .tdc-tag{display:inline-block;font-size:10px;padding:1px 9px;border-radius:10px;background:var(--accent);color:#fff;margin-bottom:7px;letter-spacing:.5px}
body[data-theme="dark"] #tdCard{background:linear-gradient(135deg,rgba(59,155,255,.10),rgba(59,155,255,.03));box-shadow:0 2px 10px rgba(0,0,0,.35)}
body[data-theme="dark"] #tdCard .tdc-head{background:rgba(59,155,255,.14)}
body[data-theme="dark"] #tdCard .tdc-x:hover{background:rgba(255,255,255,.10)}

/* ===== 主题：暗色 / 高对比 ===== */
body[data-theme="dark"]{
  --bg1:#0a0e17;--bg2:#050810;--bg3:#101724;
  --ink:#e9eef6;--muted:#9aa6b8;--faint:#687388;
  --rule:rgba(255,255,255,.10);--rule2:rgba(255,255,255,.18);
  --accent:#3b9bff;--accent2:#67b0ff;--accent-g:rgba(59,155,255,.20);
  --metal1:#1b2434;--metal2:#222d40;--metal3:#2c3a52;--metal4:#3a4a64;
  --dark:#0e1422;--dark2:#161f30;
  --ok:#2bd47a;--warn:#f0a73a;--bad:#ff5d5d;
  --sh1:0 2px 10px rgba(0,0,0,.45);--sh2:0 8px 32px rgba(0,0,0,.55);--sh3:0 20px 60px rgba(0,0,0,.65);
}
body[data-theme="dark"]{background:radial-gradient(ellipse at 40% 30%,#101826 0%,#0a0e17 50%,#050810 100%);color:var(--ink)}
body[data-theme="dark"] .tb{background:rgba(13,18,30,.85);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px)}
body[data-theme="dark"] .nav{background:rgba(13,18,30,.5)}
body[data-theme="dark"] .det{background:rgba(13,18,30,.55)}
body[data-theme="dark"] .stg{background:radial-gradient(ellipse at 50% 40%,rgba(30,40,58,.85) 0%,rgba(10,14,23,.9) 60%,transparent 100%),linear-gradient(180deg,#0c111c 0%,#070b13 100%)}
body[data-theme="dark"] .msw{background:rgba(255,255,255,.06)}
body[data-theme="dark"] .vb{background:rgba(20,28,42,.85);border-color:var(--rule);color:var(--muted)}
body[data-theme="dark"] .vb.on{color:#fff}
body[data-theme="dark"] .hb{background:rgba(20,28,42,.85);border-color:var(--rule);color:var(--muted)}
body[data-theme="dark"] .sbd{background:rgba(13,18,30,.8);border-color:var(--rule);color:var(--muted)}
body[data-theme="dark"] .pc{background:rgba(255,255,255,.04)}
body[data-theme="dark"] .tip{background:rgba(59,155,255,.08);border-left-color:var(--accent)}
body[data-theme="dark"] .anim-box{background:linear-gradient(135deg,#101724 0%,#0c111c 100%)}

body[data-theme="dark"] .vt{background:rgba(255,255,255,.05);color:var(--muted)}
body[data-theme="dark"] .ngh:hover,body[data-theme="dark"] .nit:hover{background:rgba(255,255,255,.05)}
body[data-theme="dark"] .logo .dot{box-shadow:0 0 14px var(--accent-g),0 0 0 3px rgba(59,155,255,.18)}

/* ===== 3D（WebGL）默认启用 ===== */
#webgl{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:5;touch-action:none}
#webglLbl{position:absolute;left:50%;top:18px;transform:translateX(-50%);z-index:8;font-size:11px;color:var(--faint);font-weight:500;letter-spacing:.5px;display:block}
#webglLbl b{color:var(--accent)}

/* ===== 实时状态胶囊 ===== */
.status{position:absolute;right:18px;top:56px;z-index:10;display:flex;align-items:center;gap:7px;padding:6px 13px;border-radius:20px;font-size:11px;font-weight:600;background:rgba(255,255,255,.9);border:1px solid var(--rule);color:var(--muted);box-shadow:var(--sh1);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.status b{color:var(--ink)}
.status .sdot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 1.8s infinite}
body[data-theme="dark"] .status{background:rgba(13,18,30,.8);border-color:var(--rule);color:var(--muted)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(22,163,74,.55)}70%{box-shadow:0 0 0 7px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}

/* ===== 顶栏附加按钮 ===== */
.vb.theme{padding:6px 11px}
.ham{display:none;width:38px;height:38px;border-radius:9px;border:1px solid var(--rule);background:rgba(255,255,255,.9);color:var(--muted);font-size:18px;cursor:pointer;align-items:center;justify-content:center;transition:.14s;font-family:inherit}
.ham:hover{color:var(--ink);background:#fff;box-shadow:var(--sh1)}

/* ===== 移动端抽屉 + 底部 Tab ===== */
.navbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:90;opacity:0;pointer-events:none;transition:opacity .25s}
.drw{position:fixed;left:0;right:0;bottom:56px;z-index:96;background:var(--bg3);border-top:1px solid var(--rule);transform:translateY(110%);transition:transform .28s cubic-bezier(.2,.8,.3,1);padding:14px;display:none;flex-wrap:wrap;gap:8px;box-shadow:var(--sh2)}
.drw .vb,.drw .hb{font-size:13px;padding:10px 14px}
.btab{display:none}
@media(max-width:860px){
  .tb{padding:0 12px;gap:10px}
  .tb .sep,.msw,.tbr{display:none}
  .ham{display:flex}
  .rz{display:none!important}   /* 移动端走抽屉模式，隐藏桌面端拖宽把手 */
  .app{grid-template-columns:1fr;height:calc(100vh - 54px - 56px)}
  .stg{height:100%}
  .nav{position:fixed;left:0;top:54px;bottom:56px;width:80%;max-width:320px;z-index:95;background:var(--bg3);border-right:1px solid var(--rule);transform:translateX(-106%);transition:transform .28s cubic-bezier(.2,.8,.3,1);box-shadow:var(--sh2);padding-top:8px}
  body.drawer-nav .nav{transform:none}
  .det{position:fixed;right:0;top:54px;bottom:56px;width:88%;max-width:380px;z-index:95;background:var(--bg3);border-left:1px solid var(--rule);transform:translateX(106%);transition:transform .28s cubic-bezier(.2,.8,.3,1);box-shadow:var(--sh2)}
  body.drawer-det .det{transform:none}
  .navbg{display:block}
  body.drawer-nav .navbg,body.drawer-det .navbg,body.drawer-model .navbg,body.drawer-view .navbg{opacity:1;pointer-events:auto}
  .drw{display:flex}
  body.drawer-model .drw.mdl{transform:none}
  body.drawer-view .drw.view{transform:none}
  .btab{display:flex;position:fixed;left:0;right:0;bottom:0;height:56px;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--rule);align-items:stretch}
  .btab button{flex:1;border:none;background:transparent;color:var(--muted);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;font-family:inherit;padding:0}
  .btab button .ic{font-size:18px;line-height:1}
  .btab button.on,.btab button:active{color:var(--accent)}
  body[data-theme="dark"] .btab{background:rgba(13,18,30,.94)}
  body[data-theme="dark"] .nav,body[data-theme="dark"] .det,body[data-theme="dark"] .drw{background:var(--bg3)}
}

/* ===== 拆解爆炸度滑杆栏 ===== */

<script>
/* 本地优先/CDN回退逻辑：通过sessionStorage标记避免无限循环 */
(function(){
  var USE_CDN = sessionStorage.getItem('__three_cdn__')==='1';
  var imports = USE_CDN
    ? {"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}
    : {"three":"./lib/three.module.js","three/addons/":"./lib/addons/"};
  document.write('<script type="importmap">'+JSON.stringify({imports:imports})+'<\/script>');
  if(!USE_CDN){
    /* 监听模块加载错误，自动切换到CDN并刷新（仅一次） */
    window.addEventListener('error',function(e){
      var msg=(e&&e.message)?String(e.message):'';
      if(msg.indexOf('three')>=0 || msg.indexOf('Failed to resolve module')>=0 || msg.indexOf('Importing a module')>=0){
        if(!sessionStorage.getItem('__three_cdn__')){
          sessionStorage.setItem('__three_cdn__','1');
          console.log('[3D] 本地Three.js加载失败，自动切换到CDN...');
          location.reload();
        }
      }
    },true);
  }else{
    console.log('[3D] 使用CDN模式加载Three.js');
  }
})();
</script>

whole:{title:'人形机器人整机系统',sub:'Humanoid Robot Full-Stack System',params:[],sections:[
{h:'系统总览',p:'人形机器人是集<hl>机械结构、伺服驱动、实时控制、环境感知、AI决策</hl>于一体的极端复杂系统。从技术栈角度可分为三层：<hl>感知决策层</hl>（激光雷达+深度相机+IMU+算力平台运行SLAM/导航/大模型）、<hl>通信总线层</hl>（EtherCAT/CAN-FD实时工业以太网，周期≤1ms）、<hl>执行层</hl>（关节模组：无框力矩电机+谐波减速器+双编码器+FOC驱动器一体化）。'},
{h:'核心矛盾与挑战',p:'人形机器人设计面临几大核心矛盾：①<hl>大扭矩 vs 轻重量</hl>——要支撑身体并跳跃，扭矩密度是核心指标；②<hl>高刚性 vs 高反驱</hl>——支撑需要刚性，碰撞检测和力控需要反驱透明；③<hl>高带宽 vs 低噪声</hl>——响应要快但不能振动；④<hl>高集成度 vs 可维护性</hl>——关节要小但要能修；⑤<hl>高算力 vs 低功耗</hl>——机载电池容量有限。'},
{h:'全球技术格局',p:'人形机器人关节方案目前分为几大流派：①<hl>谐波减速+无框力矩电机</hl>（宇树/Figure 等主流方案，扭矩密度最高；特斯拉 Optimus 旋转关节用谐波、直线关节用行星滚柱丝杠，属混合方案）；②<hl>行星减速+高转速电机</hl>（部分工业方案，刚性高但反驱差）；③<hl>准直驱QDD</hl>（MIT Mini Cheetah开创，低减速比，反驱极透明但扭矩密度低，多用于四足）；④<hl>串联弹性SEA</hl>（传统双足如HRP/Atlas早期，力控好但带宽低）；⑤<hl>液压驱动</hl>（Boston Dynamics Atlas，功率密度极高但成本/噪声/维护问题突出）。'},
{h:'供应链核心环节',p:'关节模组上游核心零部件：①<hl>谐波减速器</hl>（哈默纳科垄断~70%，国产绿的谐波/来福谐波替代）；②<hl>无框力矩电机</hl>（Kollmorgen/Allied Motion/T-Motor/国产昊志）；③<hl>磁编码器</hl>（RLS/ams-OSRAM/多摩川/国产瑞列格）；④<hl>驱动器芯片</hl>（TI/ST/英飞凌的MCU+栅极驱动+MOSFET）；⑤<hl>交叉滚子轴承</hl>（THK/IKO/国产洛轴）。整机集成的核心壁垒在于<hl>驱控算法（FOC+阻抗/导纳控制+全身MPC）</hl>和<hl>量产一致性</hl>。'}],

head:{title:'头部 · 感知计算中枢',sub:'Head Perception & Computing Unit',
params:[['核心传感器','LiDAR + 深度相机'],['计算平台','x86/ARM SoC'],['颈部DOF','2~3'],['重量','~1.5 kg'],['水平FOV','360°(LiDAR)'],['算力','20~100 TOPS']],sections:[
{h:'感知套件详解',p:'头部是人形机器人的"五官"所在。典型配置：①<hl>激光雷达LiDAR</hl>——宇树H1搭载大疆览沃Livox MID-360（非重复扫描360°×59°，测距40m，点云密度20万点/秒），用于SLAM建图、避障和导航；②<hl>深度相机</hl>——Intel RealSense D435i/奥比中光Gemini 2，提供RGB-D彩色点云，用于物体识别、三维重建、手眼协调；③<hl>鱼眼相机阵列</hl>——4颗广角相机环视，用于视觉定位和图像识别；④<hl>IMU</hl>——头部通常内置6轴或9轴IMU（加速度计+陀螺仪+磁力计），与腿部IMU融合做姿态估计；⑤<hl>麦克风阵列</hl>——4~6麦环形阵列，用于语音识别和声源定位。'},
{h:'计算平台架构',p:'头部内部载有主计算单元，主流方案：①<hl>x86平台</hl>（Intel NUC 12/13代 i5/i7，CPU算力强，兼容性好，功耗28-45W）；②<hl>ARM平台</hl>（NVIDIA Jetson Orin NX/AGX，GPU算力100-275TOPS，适合跑AI大模型和视觉算法，功耗10-60W）；③<hl>专用ASIC</hl>（特斯拉FSD/自研芯片，功耗低算力强但生态封闭）。计算平台运行<hl>ROS 2</hl>机器人操作系统，部署SLAM、目标检测（YOLO）、语义分割、路径规划、大模型对话等算法。'},
{h:'结构与散热设计',p:'头部外壳通常采用<hl>碳纤维复合材料</hl>或<hl>铝合金CNC</hl>轻量化设计，重量控制在1.5kg以内以减小颈部关节负载。内部高算力芯片需要主动散热，通常采用<hl>热管+涡轮风扇</hl>或<hl>均热板+散热鳍片</hl>方案。头部外壳设计需兼顾传感器视野（雷达和相机不能被遮挡）、EMC电磁屏蔽（驱动板大电流会干扰传感器）、以及防护等级（IP54以上防泼溅）。'},
{h:'颈部关节配置',p:'颈部通常2~3自由度：①<hl>偏航Yaw</hl>（左右转头±90°）；②<hl>俯仰Pitch</hl>（抬头低头±30°~−45°）；③<hl>侧倾Roll</hl>（左右歪头±20°，部分机型省略）。颈部关节采用<hl>微型谐波减速器</hl>（减速比100:1）+小尺寸无框电机+双磁编码器，输出扭矩8-15Nm，重量控制在200g以内，重复定位精度±0.01°。'}],

{h:'电池系统设计',p:'人形机器人普遍采用<hl>高压动力锂电池组</hl>。宇树H1使用12串2并（12S2P）21700电芯配置，额定电压44.4V（满电50.4V），也有方案使用16S（67.2V）或更高电压以减小电流。电池组包含：①<hl>电芯组</hl>——三星50S/LG M50LT等高倍率21700电芯（持续放电15A以上）；②<hl>BMS电池管理系统</hl>——监测每串电压/温度，实现过充过放过温保护、被动/主动均衡、SOC估算（精度±3%）、SOH健康度评估；③<hl>继电器/熔断器</hl>——主回路通断和短路保护；④<hl>预充电路</hl>——防止上电瞬间电容充电大电流打火。'},
{h:'电源分配架构',p:'电池高压（48V/67V）直接供给关节电机驱动器（大扭矩时电流可达20-40A/关节），同时通过<hl>DC-DC降压模块</hl>产生：①<hl>24V/12V</hl>给风扇、传感器、散热系统；②<hl>5V/3.3V</hl>给MCU、编码器逻辑电路、通信芯片。电源分配板需要处理大电流走线（铜厚2oz以上）、EMI滤波（π型LC滤波）、以及防反接/防浪涌保护。H1整机峰值功率可达2-3kW（跳跃/奔跑瞬间），平均行走功率约200-400W。'},
{h:'躯干结构设计',p:'躯干是整机的承载"脊梁"，采用<hl>铝合金一体压铸</hl>或<hl>碳纤维板+铝合金骨架</hl>三明治结构。内部划分为：电池仓、计算单元仓、电源管理仓、IMU安装基准面（需要极高的平面度和刚性）。躯干外侧安装双臂髋关节的安装法兰，底部安装腰部旋转关节。结构设计的核心是<hl>刚度重量比</hl>——既要有足够刚性防止行走时躯干晃动（影响IMU精度），又要尽可能轻。'},
{h:'热管理系统',p:'躯干内有多个热源：电池（大电流放电发热）、计算单元（30-80W持续发热）、DC-DC电源模块。热管理方案：①<hl>电池</hl>——通常被动散热（贴壳体导热垫），低温环境需要加热膜预热（锂电池0°C以下不能大电流放电）；②<hl>计算单元</hl>——热管+风扇主动散热，进风口设防尘网；③<hl>躯体内腔</hl>——设计风道从底部进风、顶部出风，利用烟囱效应辅助散热。部分防水机型采用全密封+导热凝胶+外壳散热的无风扇方案。'}],

params:[['自由度','2~3'],['峰值扭矩','8~15 Nm'],['旋转范围','±45°~±90°'],['重量','~200 g'],['减速比','80:1~100:1'],['重复精度','±0.01°']],sections:[
{h:'结构特点',p:'<hl>颈部关节</hl>连接头部与躯干，虽然负载较小（头部重量约1~2kg），但需要实现头部灵活转动以配合视觉传感器扫描环境。通常采用<hl>微型谐波减速器</hl>（CSF-8/11系列）搭配小功率无框力矩电机或空心杯电机，以最大限度减轻重量并缩小体积。'},
{h:'走线设计',p:'颈部是头部线缆（电源线、EtherCAT网线、摄像头数据线、雷达数据线）通往躯干的必经之路，因此关节中心必须设计<hl>中空走线孔</hl>（直径约8~15mm）。所有线缆通过中空孔穿过，避免旋转时缠绕。高端设计会在颈部采用<hl>滑环</hl>（Slip Ring）实现无限旋转，但人形机器人颈部通常限制在±90°~±180°范围内，因此直接走线即可。'},
{h:'视觉协同控制',p:'颈部关节与视觉感知深度耦合：①<hl>目标跟踪</hl>：头部跟随移动目标转动，保持目标在视野中央；②<hl>扫描建图</hl>：头部按预定轨迹转动，配合激光雷达/深度相机完成环境3D重建；③<hl>视线交互</hl>：社交场景中通过头部运动表达"注意力"方向。颈部控制带宽通常设为5~10Hz，足够流畅跟踪人体动作。'}],

params:[['自由度','1 (偏航Yaw)'],['峰值扭矩','80~150 Nm'],['转速','30~60 rpm'],['重量','0.8~1.5 kg'],['旋转范围','±45°~±90°'],['减速比','80:1~120:1']],sections:[
{h:'功能意义',p:'腰部偏航关节实现躯干相对于髋部的<hl>左右旋转</hl>，虽然只有1个自由度，但对人形机器人的操作能力和步态质量至关重要：①<hl>扩展双臂工作空间</hl>——转身拿取侧面物体时不需要移动脚步；②<hl>步态辅助</hl>——行走时躯干反方向扭转可以补偿角动量，减少脚部的偏航摩擦力矩（人类行走时天然会扭腰摆臂）；③<hl>摔倒防护</hl>——摔倒时通过腰部扭转调整着地姿态。'},
{h:'机械结构方案',p:'腰部关节需要承受整个上半身重量（约25-30kg）加上手臂操作时的动态力，通常采用：①<hl>谐波减速器</hl>（CSG/SHG-25/32系列，减速比100:1）+无框力矩电机；②<hl>交叉滚子轴承</hl>（CRBH系列）作为主轴承，同时承受径向力、轴向力和倾覆力矩；③<hl>中空走线设计</hl>——关节中心有通孔，躯干的电源线和通信线从中穿过，避免走线外露缠绕。输出法兰连接躯干，定子端连接髋部支架。'},
{h:'控制要点',p:'腰部关节在行走时主要起<hl>角动量补偿</hl>作用，而非位置跟踪。控制策略上通常采用<hl>阻抗控制</hl>（Impedance Control）而非纯位置控制，让腰部有一定的"柔性"以吸收冲击和协调双臂运动。在操作任务中，腰部需要与双臂做<hl>协调运动规划</hl>（Whole-Body Control），将末端执行器的目标位置分解为腰部+肩部+肘部的协同关节角度。'}],

{h:'三自由度构型',p:'人类肩关节是全身最灵活的球窝关节，人形机器人肩关节通常采用<hl>3自由度正交布置</hl>：①<hl>屈伸Pitch</hl>（前后摆臂±180°）；②<hl>内收外展Roll</hl>（侧平举±180°）；③<hl>旋转Yaw</hl>（大臂自转±90°）。三个关节轴线必须交汇于一点（球心），否则会产生运动耦合奇异。部分先进机型采用更复杂的<hl>差分双肩关节</hl>（两个电机驱动三个自由度的差动机构），可以在相同重量下获得更大扭矩和更紧凑的结构。'},
{h:'负载与驱动',p:'肩关节承受手臂自重（3-5kg）+末端负载（5-20kg）的大力矩，且需要较宽的运动范围。H1肩部采用<hl>M107关节模组的缩比版本</hl>（或M88），输出扭矩约80-120Nm。部分先进设计将电机和驱动器后置到躯干内，通过<hl>连杆/绳索传动</hl>驱动肩关节，有效减轻手臂重量、降低转动惯量（这对安全交互和快速运动很重要）。肩部轴承需要承受大的倾覆力矩，多采用交叉滚子轴承或YRT转台轴承。'},
{h:'工作空间与奇异点',p:'3自由度球铰肩关节的工作空间近似为半球面，但存在<hl>万向节死锁</hl>（Gimbal Lock）奇异点——当大臂竖直向上时Pitch和Yaw轴重合，丢失一个自由度。运动规划算法需要避开这些奇异点，或在奇异点附近进行路径优化。肩关节和肘关节的协调运动决定了<hl>末端可达工作空间</hl>，典型人形手臂可达半径约60-80cm。'}],

elbow:{title:'肘关节',sub:'Elbow Joint',
params:[['自由度','1 (屈伸)'],['峰值扭矩','30~60 Nm'],['最大转速','120~200 rpm'],['重量','0.3~0.6 kg'],['屈曲角度','0°~150°'],['减速比','80:1~100:1']],sections:[
{h:'结构设计',p:'肘关节是单自由度铰链关节，实现<hl>前臂屈伸</hl>（典型范围0°~150°，0°为伸直）。肘关节空间非常紧凑，需要将电机、谐波减速器、双编码器、FOC驱动板、制动器全部集成在直径约50-60mm、长度约80-100mm的圆柱空间内。宇树等厂商采用<hl>驱控一体化</hl>设计——FOC驱动板直接贴装在电机背部，用SPI总线与编码器通信，通过EtherCAT总线与上位机通信，减少了外部布线（仅需电源线+EtherCAT网线穿过关节中空孔）。'},
{h:'力控与柔顺交互',p:'在接触式操作任务（握手、擦桌子、装配、搀扶）中，肘关节需要精确的<hl>力矩感知与力控制</hl>能力。主流方案有三种：①<hl>无传感器力矩估算</hl>（Sensorless）——通过电机相电流乘以转矩常数估算输出力矩，成本低但精度差（误差15-25%），且无法检测外力摩擦；②<hl>串联弹性SEA</hl>——在输出端加弹性体（弹簧），通过弹簧形变测力矩，精度高但增加体积和复杂度；③<hl>力矩传感器</hl>——在输出法兰贴应变片或使用光学/电容式六维力传感器，精度最高（误差<5%）但成本高、抗过载能力差。'},
{h:'制动器与安全',p:'肘关节（以及所有关节）通常配备<hl>永磁制动器</hl>或<hl>弹簧制动器</hl>——断电时自动抱闸锁定关节，防止机器人断电时手臂砸下来造成危险。制动器安装在电机后端，制动力矩通过减速箱放大后可在输出端产生足够的保持力矩。安全标准ISO 13482要求个人护理机器人在断电后必须能保持姿态或缓慢释放，不能自由下落。'}],

wrist:{title:'腕关节与末端执行器',sub:'Wrist & End Effector',
params:[['腕DOF','2~3'],['手DOF','6~20 (灵巧手)'],['腕峰值扭矩','8~20 Nm'],['指尖力','5~20 N/指'],['腕重复精度','±0.02°'],['末端负载','3~10 kg']],sections:[
{h:'腕关节构型',p:'腕关节连接前臂和末端执行器（手/夹爪），通常具备2~3个自由度：①<hl>俯仰Pitch</hl>（上下摆腕±60°）；②<hl>偏摆Yaw</hl>（左右摆腕±40°）；③<hl>旋转Roll</hl>（前臂自转±180°，部分机型将这个自由度放在前臂末端）。腕关节空间极其紧凑，且距离末端负载最近，对重量和体积最敏感。多采用<hl>微型谐波减速器+扁平无框电机</hl>，或采用<hl>腱传动/绳索传动</hl>将电机后置到前臂，手腕处只有滑轮和腱线，可大幅减轻腕部重量。'},
{h:'灵巧手技术',p:'人形机器人末端执行器主要有三类：①<hl>平行夹爪</hl>（2指）——结构简单可靠，成本低，适合工业抓取，但无法做精细操作；②<hl>三指/四指欠驱动手</hl>——通过少量电机（1-3个）配合腱绳和弹簧实现自适应抓取，结构简单但能抓取多种形状物体；③<hl>仿人灵巧手</hl>（5指6-20自由度）——如Shadow Hand（24DOF气动）、宇树Dex3-1（7DOF三指，重710g）、特斯拉Optimus手（多指灵巧手，可拿鸡蛋）。灵巧手核心难点是<hl>小空间内的驱动+传感+传动集成</hl>，以及<hl>触觉传感</hl>。'},
{h:'触觉传感',p:'要实现类人操作（如拿纸杯不捏碎、用钥匙开门、打字），机器人需要<hl>指尖触觉传感器</hl>。主流技术路线：①<hl>电容式</hl>（阵列电容变化测压力，分辨率高但易受电磁干扰）；②<hl>压阻式</hl>（导电橡胶/压阻材料，成本低但非线性和迟滞大）；③<hl>光学式</hl>（GelSight类，通过摄像头拍摄弹性体形变，精度极高但体积大）；④<hl>气压式</hl>（气压变化测接触力，柔性好但响应慢）。宇树Dex3灵巧手集成了指尖触觉传感器，可实现力控抓取。'},
{h:'快换接口',p:'部分人形机器人手腕设计有<hl>工具快换接口</hl>（Tool Changer），可以自动切换夹爪、灵巧手、电动螺丝刀、吸盘等不同末端工具，扩展应用场景。快换接口需要集成：机械锁紧机构、电源触点（给末端工具供电）、通信总线（CAN/EtherCAT/USB）、气路接口（吸盘需要压缩空气）。'}],
vendors:[{n:'宇树科技',r:'Dex3 灵巧手',m:1},{n:'Shadow Robot',r:'Shadow Dexterous Hand'},{n:'特斯拉',r:'Optimus 6DOF手'},{n:'因时机器人',r:'RH56DFX/RH8'},{n:'因时/帕西尼',r:'指尖触觉传感器'},{n:'GelSight',r:'光学触觉传感器'}]},

hip:{title:'髋关节',sub:'Hip Joint',
params:[['自由度','3'],['峰值扭矩','120~360 Nm'],['最大转速','60~120 rpm'],['重量','1.0~1.8 kg'],['屈曲范围','−45°~+120°'],['轴承类型','交叉滚子/YRT']],sections:[
{h:'核心地位',p:'髋关节是双腿与躯干的连接枢纽，是<hl>全身输出扭矩最大、负载要求最高</hl>的关节，直接决定了机器人的行走、跑步、跳跃能力。行走时单侧髋关节需要支撑整个人体重量（47-70kg）加上动态冲击载荷（跑步时地面冲击力可达体重2-3倍，即1000N以上），对输出扭矩、结构刚性、抗冲击能力要求极高。'},
{h:'三自由度配置',p:'髋关节为球铰式3自由度，三个轴线正交交汇于髋臼中心：①<hl>屈伸Pitch</hl>（前后抬腿，行走主运动，范围−30°~+120°）；②<hl>内收外展Roll</hl>（侧摆腿，重心转移，范围±45°）；③<hl>内旋外旋Yaw</hl>（大腿自转，转向与步态调整，范围±30°）。三个自由度通常由三个独立的关节模组组成，其中屈伸自由度扭矩最大（使用M107级别关节），外展和旋转自由度扭矩稍小（使用M88级别关节）。'},
{h:'宇树M107关节模组与H1关节扭矩',p:'<hl>M107</hl>是宇树自研的旗舰级人形机器人关节电机：最大扭矩<hl>360N·m</hl>，整重约<hl>1.9kg</hl>，扭矩密度<hl>189N·m/kg</hl>（全球顶尖水平），采用低惯量高速内转子永磁同步电机+定制谐波减速器+<hl>双编码器</hl>+中空走线设计。H1各关节极限扭矩（宇树官方数据）：<hl>膝关节约360N·m、髋关节约220N·m、踝关节约59N·m、手臂关节约75N·m</hl>。'},
{h:'轴承与抗冲击',p:'髋关节轴承是关键安全部件。行走时地面冲击力通过腿部传递到髋关节，轴承需要同时承受：<hl>径向力</hl>（体重支撑，数百牛）、<hl>轴向力</hl>（侧向力，数十牛）、<hl>倾覆力矩</hl>（身体重心偏离关节中心时产生，可达100Nm以上）。普通球轴承无法同时承受这三种载荷，必须使用<hl>交叉滚子轴承</hl>（Crossed Roller Bearing）或<hl>YRT转台轴承</hl>，这类轴承的滚子呈90°交叉排列，可同时承受多方向大载荷，且具有极高的旋转精度和刚性。'}],
vendors:[{n:'宇树科技',r:'M107 关节模组',m:1},{n:'哈默纳科',r:'SHG/SHF-25/32/40',m:1},{n:'绿的谐波',r:'LHSG/LHG大扭矩',m:1},{n:'THK/IKO',r:'CRBH/CRBF交叉滚子轴承'},{n:'T-Motor',r:'AK80/AK10大扭矩电机'}]},

knee:{title:'膝关节',sub:'Knee Joint',
params:[['自由度','1 (屈伸)'],['峰值扭矩','120~360 Nm'],['最大转速','120~240 rpm'],['重量','1.0~1.8 kg'],['屈曲角度','0°~150°'],['峰值功率','>1 kW']],sections:[
{h:'运动特点',p:'膝关节是单自由度铰链关节，实现<hl>小腿屈伸</hl>（0°伸直~150°屈曲）。膝关节是人体中最复杂、受力最大的关节之一，在<hl>行走、跑步、跳跃、下蹲</hl>中承受巨大的冲击和扭矩。奔跑时膝关节峰值功率可达1-2kW（加速蹬地瞬间），是全身能量消耗最大的关节。与髋关节不同，膝关节运动范围主要在屈曲方向（不能反屈），但在行走的支撑相需要有一定的"柔性"以吸收冲击。'},
{h:'技术挑战与矛盾',p:'膝关节设计面临几大尖锐矛盾：①<hl>大扭矩 vs 高转速</hl>——支撑相需要300Nm以上大扭矩（减速比要大），但摆动相需要快速摆腿（最高200+rpm，减速比要小）；②<hl>高刚性 vs 反驱透明</hl>——支撑期需要刚性（不能软塌），摆动期和碰撞时需要反驱透明（外力能推动，实现柔顺和碰撞检测）；③<hl>抗冲击 vs 轻量化</hl>——落地冲击可达体重3-5倍，但关节不能太重。这些矛盾使得膝关节成为人形机器人关节设计难度最大的关节之一。'},
{h:'驱动方案对比',p:'①<hl>谐波减速+无框电机</hl>（宇树H1/Optimus/Figure主流）：扭矩密度极高，刚性好，反驱性尚可但不如QDD，谐波柔轮在大冲击下有寿命隐患；②<hl>准直驱QDD/Proprioceptive Actuation</hl>（MIT Cheetah/宇树Go2四足）：减速比仅6-10，反驱极透明（可通过电流精确感知外力），带宽极高，但扭矩密度低，做成人形大小重量会太大；③<hl>行星减速+高转速电机</hl>：刚性极高，抗冲击好，但反驱差，力控困难，噪声大；④<hl>串联弹性SEA</hl>（HRP-2/Atlas早期）：输出端加弹簧实现固有柔顺，力控精度高，但带宽低（弹簧储能限制响应速度），弹簧刚度选择困难（硬了没效果，软了振荡）；⑤<hl>液压驱动</hl>（Atlas原版）：功率密度最高，抗冲击极强，但系统复杂、噪声大、维护难、成本极高，适合实验室展示不适合量产。'},
{h:'四连杆机构',p:'值得注意的是，很多双足机器人（包括宇树H1）的膝关节并非电机直接驱动，而是采用<hl>四连杆机构</hl>或<hl>丝杠推杆</hl>方案：电机安装在大腿或髋部，通过连杆/滚珠丝杠/同步带驱动膝关节弯曲。这种方案的优势是<hl>把电机重量上移</hl>（降低小腿转动惯量，有利于快速摆动），且可以通过连杆曲线优化膝关节运动学（更接近人体瞬心轨迹），但增加了机械复杂度和关节间隙。'}],
vendors:[{n:'宇树科技',r:'M107 膝关',m:1},{n:'哈默纳科',r:'CSG/SHG轻量化谐波',m:1},{n:'Maxon',r:'行星减速箱方案'},{n:'MIT Biomimetic',r:'准直驱QDD理论奠基'},{n:'Moog',r:'液压伺服阀(Atlas)'}]},

ankle:{title:'踝关节',sub:'Ankle Joint',
params:[['自由度','2 (俯仰+侧倾)'],['峰值扭矩','50~120 Nm'],['最大转速','60~120 rpm'],['重量','0.6~1.2 kg'],['跖屈/背屈','+45°/−45°'],['内翻/外翻','±20°']],sections:[
{h:'功能作用',p:'踝关节连接小腿与足部，是行走时<hl>唯一与地面接触的终端关节</hl>，负责：①支撑期的姿态调整（保持身体直立，适应地面坡度）；②摆动期的足端定位（控制脚落地位置和角度，避免绊倒）；③推进力生成（跖屈蹬地提供前进动力）；④冲击吸收（落地时通过踝关节柔顺控制缓冲地面反力）。踝关节的控制质量直接决定了行走的稳定性、能量效率和地面适应性。'},
{h:'两自由度配置',p:'典型踝关节2自由度正交布置：①<hl>跖屈/背屈Pitch</hl>（勾脚/绷脚±45°）——沿左右方向的水平轴，主要承担行走推进和支撑，扭矩要求大；②<hl>内翻/外翻Roll</hl>（左右倾斜±20°）——沿前后方向的水平轴，主要适应不平地面和侧向平衡调节。部分机器人简化为1自由度（仅Pitch），但在不平整地面行走能力大幅下降。两个自由度电机通常后置到小腿下部，通过<hl>连杆/锥齿轮/丝杠</hl>传动到踝关节，以减小脚踝体积和重量。'},
{h:'六维力传感器',p:'高端人形机器人踝关节（或足底）配备<hl>六维力/力矩传感器</hl>（6-axis F/T Sensor），可实时测量足底三个方向的力（Fx/Fy/Fz，垂直力+前后/左右剪切力）和三个方向的力矩（Mx/My/Mz），采样频率1-5kHz。这是<hl>ZMP零力矩点平衡控制</hl>、地面反力估计、柔顺力控制、地形感知的核心传感器。H1、Optimus、Atlas均配备。主流供应商：美国ATI（工业级黄金标准，单价数万元）、瑞士Bota Systems、国产坤维科技/宇立仪器（价格大幅降低）。'},
{h:'足部设计',p:'机器人足部不是简单的平板：①<hl>足底材料</hl>——通常覆盖橡胶/聚氨酯弹性垫，增加摩擦系数（μ>0.6）、吸收高频冲击振动、适应地面微小不平整；②<hl>足弓结构</hl>——部分仿人设计加入弹性足弓（类似人类足弓的弹簧储能机制），可在行走时储存和释放能量，提高能量效率；③<hl>多触点设计</hl>——4个脚垫（前掌2个+后跟2个），每个脚垫可加装压力传感器检测接触状态；④<hl>IMU</hl>——足部可额外加装IMU检测足端落地冲击和零速度修正（ZUPT），提高状态估计精度。'}],
vendors:[{n:'宇树科技',r:'自研踝关节+力传感器',m:1},{n:'ATI Industrial',r:'Mini40/Omega六维力'},{n:'Bota Systems',r:'MiniONE六维力'},{n:'坤维科技',r:'国产六维力传感器',m:1},{n:'哈默纳科',r:'SHG-14/17微型谐波'}]},

foot:{title:'足部 · 足端结构',sub:'Foot Structure',
params:[['尺寸','~26×12 cm(成人)'],['结构','平板/弹性足弓'],['足底材质','橡胶/聚氨酯'],['传感器','六维力/IMU/压力垫'],['重量','0.5~1.0 kg/只'],['摩擦系数','μ>0.6']],sections:[
{h:'结构设计要点',p:'足部是行走时唯一与地面接触的部件，设计需考虑：①<hl>抓地力</hl>——足底橡胶材质和花纹设计要保证在木地板、瓷砖、地毯、水泥地、湿滑地面等多种材质上都有足够摩擦力（静摩擦系数μ>0.6）；②<hl>冲击缓冲</hl>——足底弹性垫（硬度Shore 40-60A）吸收落地时的高频振动（这些振动如果直接传到IMU会严重干扰姿态估计）；③<hl>轻量化</hl>——足部重量增加会显著提高腿部摆动惯量，降低行走效率和响应速度；④<hl>着地面积</hl>——足够大的支撑多边形面积保证静止和行走时的稳定裕度。'},
{h:'传感配置',p:'完整的足部传感系统包括：①<hl>六维力传感器</hl>（踝关节处，测量地面反力的完整矢量）；②<hl>足底压力阵列</hl>（4-16个压力传感单元/脚垫，检测接触位置和压力分布，判断重心位置）；③<hl>IMU</hl>（6轴或9轴，检测足部加速度和角速度，用于落地检测和ZUPT零速度修正）；④<hl>接近/触觉传感器</hl>（检测脚与地面的距离，辅助落脚控制）。'},
{h:'被动弹性与能量效率',p:'人类行走的能量效率极高（比任何双足机器人都高），部分原因在于<hl>足部和小腿的弹性结构储能</hl>——跟腱和足弓在支撑相末期像弹簧一样储存能量，在蹬地时释放，相当于"免费"的推进力。一些研究型机器人（如Cornell Ranger、MIT Hermes）在足部加入弹簧钢板或复合材料弹性弓，可显著降低行走能耗（降低20-40%），但量产人形机器人考虑到复杂性和可靠性，目前多使用简单的橡胶缓冲垫而非复杂的弹性足弓。'}],

hand:{title:'柔性手部 · 末端执行器',sub:'Dexterous Hand & End Effector',

{h:'手部技术路线对比',p:'人形机器人手部主要分为三类：①<hl>平行夹爪</hl>（2指1-2DOF）——结构简单、成本低、抓取力大，但只能做简单夹持；②<hl>欠驱动灵巧手</hl>（3-6DOF）——用少量电机通过腱绳+弹簧联动实现自适应抓取，能抓取多种形状物体，是当前量产人形机器人的主流方案（如宇树Dex3、特斯拉Optimus手）；③<hl>全驱动仿人灵巧手</hl>（10-20DOF）——每个关节独立驱动，可操作精细物体（打字、系鞋带），但成本高、控制复杂、可靠性低（如Shadow Hand 24DOF气动）。'},
{h:'宇树Dex3-1灵巧手参数',p:'宇树Dex3-1是G1可选配的三指力控灵巧手：<hl>7个自由度</hl>（拇指3+食指2+中指2，7个关节=6个微型无刷力控关节直驱+1个齿轮传动），重量约<hl>710g</hl>，整手33个触觉传感器（9个阵列），指尖重复定位精度±2mm，最大负载约500g，支持力位混合控制（可拿鸡蛋、纸杯不碎）。采用腱绳传动，电机后置在手腕处减轻手部重量。手部外壳为<hl>黑色哑光橡胶包胶</hl>（防滑、增加摩擦、保护被抓物体），指骨为铝合金+碳纤维复合材料。'},
{h:'触觉传感技术',p:'要实现精细操作，机器人需要触觉：①<hl>电容式触觉阵列</hl>（分辨率高，易受电磁干扰）；②<hl>压阻式</hl>（成本低，迟滞大）；③<hl>光学式GelSight</hl>（精度最高，体积大）；④<hl>气压/柔性电子皮肤</hl>（柔性好但响应慢）。触觉信息用于：检测接触、测量接触力、识别物体材质纹理、检测滑动（实现滑移检测自动加力）。'},
{h:'快换与工具接口',p:'工业场景人形机器人手腕常配<hl>工具快换器</hl>（Tool Changer），可自动切换夹爪、吸盘、电动螺丝刀、焊枪等工具。快换接口集成：机械锁紧（钢珠锁紧机构）、电源（24V/48V）、通信（CAN/EtherCAT）、气路（真空吸盘需要）。未来家庭场景可能采用标准化接口，类似"机器人App Store"的工具生态。'}],

{h:'激光雷达LiDAR',p:'宇树H1/G1头部搭载<hl>大疆览沃Livox MID-360</hl>：非重复扫描方式，360°水平×59°垂直FOV，测距范围0.5-40m（反射率10%目标），点云速率20万点/秒，重量仅260g，功耗约2W。MID-360采用<hl>棱镜旋转扫描</hl>而非传统机械旋转，比传统360°机械雷达更紧凑、更耐振，适合机器人运动场景。主要用于：SLAM实时建图定位、障碍物检测避障、三维环境重建、导航路径规划。'},
{h:'深度相机RGB-D',p:'常用<hl>Intel RealSense D435i</hl>或国产替代（奥比中光Gemini 2）：提供彩色RGB图像+深度图像（双目红外+结构光/主动立体视觉），深度分辨率1280×720@30fps，测距范围0.1-10m。D435i内置IMU（BMI055），可做VIO视觉惯性里程计。用途：物体识别检测（YOLO）、三维场景理解、手眼协调（抓取时识别物体位置姿态）、人体姿态估计、语义分割。部分高端机型开始用<hl>固态激光雷达</hl>或<hl>事件相机</hl>（Event Camera，微秒级响应，适合高速运动场景）。'},
{h:'IMU惯性测量单元',p:'IMU是机器人的"内耳"，通常配置<hl>6轴</hl>（3轴加速度计+3轴陀螺仪）或<hl>9轴</hl>（加磁力计）。H1在多个位置安装IMU：①<hl>躯干IMU</hl>（安装在躯干几何中心靠近重心处，高精度BMI088，用于全身姿态估计）；②<hl>头部IMU</hl>（与雷达/相机刚性连接，用于VIO融合和头部稳定）；③<hl>足部IMU</hl>（检测落地冲击，做ZUPT零速度修正）。IMU采样率通常200-1000Hz，是状态估计（ESKF/UKF滤波融合）的核心传感器。陀螺仪测量角速度（精度0.005-0.05°/h），加速度计测量线加速度和重力方向。'},
{h:'力与触觉传感器',p:'①<hl>六维力/力矩传感器</hl>（踝/腕关节）：测量Fx/Fy/Fz+Mx/My/Mz六个分量，是ZMP平衡控制和力控操作的核心，采样率1-5kHz；②<hl>关节电流环力矩感知</hl>：通过电机相电流估算关节输出力矩（无额外传感器成本，但精度受减速器摩擦影响）；③<hl>足底压力传感器</hl>：4-16点阵列检测ZMP位置和接触状态；④<hl>指尖触觉</hl>：检测接触力和滑动。'},
{h:'多传感器融合',p:'单一传感器都有缺陷：LiDAR在玻璃/烟尘环境失效、相机在黑暗/强光下失效、IMU有累积漂移。因此采用<hl>多传感器融合</hl>（ESKF误差状态卡尔曼滤波或因子图优化）将LiDAR SLAM、视觉VIO、IMU预积分、腿式里程计（关节编码器+运动学）融合，获得鲁棒的实时位姿估计。特斯拉Optimus强调不依赖LiDAR纯视觉方案（类似FSD），但主流机器人厂商（宇树、波士顿动力、Figure）仍采用<hl>LiDAR+相机+IMU</hl>多模态融合以保证安全可靠。'}],

foc:{title:'FOC 磁场定向控制',sub:'Field-Oriented Control · 关节驱动核心算法',
params:[['电流环带宽','1~3 kHz (GaN可至5-20kHz)'],['开关频率','20~50 kHz'],['控制对象','d/q轴电流 id,iq'],['控制算法','PI (不用D)'],['整定方法','零极点对消 Ti=L/R'],['调制方式','SVPWM空间矢量']],sections:[
{h:'FOC 基本原理',p:'<hl>磁场定向控制（FOC）</hl>，又称矢量控制，是目前永磁同步电机（PMSM）和无刷直流电机（BLDC）最高效、最精确的驱动控制算法。核心思想是通过<hl>Clarke变换</hl>（三相静止abc→两相静止αβ）和<hl>Park变换</hl>（两相静止αβ→两相旋转dq），将三相交流电流解耦为旋转坐标系下的两个直流分量：<hl>d轴电流id</hl>（励磁分量，控制磁场强弱，表贴式电机常设id=0以最大化扭矩）和<hl>q轴电流iq</hl>（转矩分量，与输出扭矩成正比）。解耦后，交流电机的控制问题就转化为类似直流电机的两个独立直流分量控制问题，实现了转矩与磁通的完全解耦。'},
{h:'电流环——为什么只用PI不用PID',p:'电流环是三环最内环，直接控制dq轴电流。业界<hl>几乎无争议地使用PI控制器，绝不加D（微分）项</hl>。原因：①电流环采样频率极高（1-3kHz，GaN方案可达5-20kHz），采样噪声大，D项会<hl>放大PWM开关噪声</hl>，导致电流纹波剧增、发热和啸叫；②电流环被控对象是RL一阶电路（定子电感L+电阻R），理论上PI即可无静差跟踪，D项无必要。'},
{h:'电流环PI参数整定——零极点对消法',p:'电流环PI参数有成熟的工程整定方法——<hl>零极点对消法</hl>：令积分时间常数 <code>Ti = L/R</code>（L为定子d/q轴电感，R为定子相电阻），PI控制器引入的零点恰好抵消电机电气时间常数 <code>τe = L/R</code> 引入的极点，将电流环校正为典型的一阶惯性环节，闭环响应可整定到PWM周期的3-5倍。这也是为什么电流环通常由驱动器厂家在出厂时<hl>根据电机参数自动标定</hl>，用户层一般不调电流环。'},
{h:'硬件实现与SVPWM',p:'FOC硬件链路：①<hl>电流采样</hl>——3路mΩ级shunt电阻+运放（如INA240）采样三相电流（或下桥母线单电阻采样），送MCU的12-16bit ADC；②<hl>坐标变换</hl>——MCU在PWM下溢中断中执行Clarke+Park+PI+反Park+SVPWM运算，STM32G4/H7或TI C2000系列带CORDIC和三角函数加速器，单次FOC运算约2-5μs；③<hl>栅极驱动</hl>——TI DRV83xx/ST L63xx系列将3.3V PWM放大为10-15V驱动6颗N-MOSFET；④<hl>SVPWM调制</hl>——根据Vd/Vq计算三相占空比，比传统SPWM直流母线电压利用率<hl>高15.47%</hl>（可输出√3倍线电压），谐波更小。开关频率通常20-50kHz（硅MOSFET）或50-100kHz（GaN HEMT），需在开关损耗与电流纹波之间折中。'},
{h:'GaN时代的电流环带宽突破',p:'传统硅MOSFET方案电流环带宽典型1-3kHz，工程上限一般不超过PWM频率的1/5。随着GaN（氮化镓）功率器件普及，开关频率可推至100kHz以上，配合专用控制ASIC（如CT-2001B将PID运算延时压缩到0.2ns级），电流环带宽可突破<hl>20kHz甚至50kHz</hl>，为高带宽力控和阻抗控制提供硬件基础。'}],
vendors:[{n:'Texas Instruments',r:'C2000/DRV83xx/GaN方案',m:1},{n:'STMicroelectronics',r:'STM32G4 + STSPIN830'},{n:'Infineon 英飞凌',r:'XMC系列/GaN iMOTION'},{n:'Trinamic',r:'TMC4671 硬件FOC芯片'},{n:'航顺/极海',r:'国产MCU FOC方案',m:1}]},

loop:{title:'三环控制架构',sub:'Three-Loop Cascade Control · 电流PI→速度PI→位置P/PD',
params:[['电流环(内环)','PI控制 / 1-3kHz'],['速度环(中环)','PI控制 / 200-500Hz'],['位置环(外环)','P或PD控制 / 50-100Hz'],['带宽约束','内环≥外环5-10倍'],['整定顺序','电流环→速度环→位置环'],['人形特征','位置环去积分I']],sections:[
{h:'级联结构与带宽铁律',p:'经典伺服级联控制从内到外依次为<hl>电流环 → 速度环 → 位置环</hl>。三环带宽必须严格递进：<hl>内环带宽至少是外环的5-10倍</hl>，这是稳定的硬性约束。原因是外环将内环的响应当作"理想执行器"——如果内外环带宽接近，内环还没响应到位外环就开始调整，必然振荡发散。工程整定铁律：<hl>先调内环（电流环，出厂已标），再调中环（速度环，从低增益开始），最后调外环（位置环）</hl>，从内向外逐级整定，切不可反过来。'},
{h:'🔴 电流环（最内环）：PI，几乎无争议',p:'控制对象：dq旋转坐标系下的id、iq。算法：<hl>PI控制</hl>（不用D），输出Vd、Vq电压指令经SVPWM驱动逆变桥。典型带宽：<hl>1kHz~3kHz</hl>，GaN+优化采样可推到5kHz甚至20kHz。参数整定：零极点对消法，令 <code>Ti = L/R</code> 抵消电气时间常数极点。💡 电流环通常由驱动器厂家在出厂时根据电机L/R参数自动标定，用户层一般不调。'},
{h:'🟢 速度环（中环）：PI为主，少数场景加D',p:'控制对象：电机实际转速（编码器位置差分获得）。算法：<hl>PI控制为主</hl>，输出q轴电流指令 <code>iq_ref</code>。典型带宽：<hl>200Hz~500Hz</hl>，工业常见500Hz左右，高精度系统可做到1kHz以上。速度环带宽的<hl>硬天花板是机械谐振频率</hl>——一般不超过谐振频率的1/3~1/5，否则会激发机械结构共振，引发啸叫甚至发散振荡。为什么通常不加D：速度本身已经是位置的一阶微分（已具备"预测"性质），再加D等于二阶微分，会<hl>剧烈放大编码器量化噪声</hl>。但在负载惯量变化大的场合（机器人不同姿态下有效惯量差异可达数十倍），速度环增益不能调太高，常配合增益调度（Gain Scheduling）或扰动观测器使用。'},
{h:'🔵 位置环（最外环）：P或PD居多，I经常被去掉——人形机器人与工业伺服的关键差异',p:'控制对象：关节实际输出角度。算法：人形机器人关节位置环以<hl>纯P或PD控制</hl>为主，<hl>很多关节彻底去除积分项I</hl>。典型带宽：<hl>50-100Hz</hl>（传统伺服），高动态系统可做到1kHz。为什么去积分（这是人形机器人与工业CNC伺服最大的区别）：①上层运动规划已经给出平滑的参考轨迹（带速度前馈/加速度前馈），<hl>无需位置环积分来消除稳态误差</hl>；②积分项在电机饱和（扭矩/速度达到上限）时会造成<hl>积分饱和（Integral Windup）</hl>——到位后积分器累积的误差会导致反向冲出、严重超调，这对人形机器人是严重安全隐患（可能造成跌倒或碰撞）；③位置环积分容易引入低频振荡和相位滞后，降低系统稳定裕度。工业伺服之所以保留积分，是因为CNC/机床要对抗恒定切削力实现零稳态误差；人形机器人更多是动态跟踪，用前馈+重力/摩擦补偿替代积分更合理。'},
{h:'前馈控制——提升跟踪精度的利器',p:'在三环PI/P基础上加入<hl>速度前馈和加速度前馈（Torque Feedforward）</hl>，可在不提高位置环增益的前提下大幅减小轨迹跟踪误差。原理是利用已知的参考轨迹速度和加速度，提前注入对应的电流指令（<code>iq_ff = J·α + B·ω + G·cosθ</code>，J为惯量、B为阻尼、G为重力矩），让位置环P只需要补偿未建模扰动。宇树、MIT等先进人形机器人的关节普遍采用<hl>PD+重力补偿+摩擦力补偿</hl>的位置控制架构。'},
{h:'力控模式下的三环旁路',p:'在力控/阻抗控制模式下（如腿部接触地面、手臂接触物体），位置环和速度环被<hl>旁路（Bypass）</hl>，上位机直接给电流环发送 <code>iq_ref</code> 力矩指令，实现零延迟力矩响应。准直驱（QDD）方案甚至进一步简化为<hl>双环架构：电流环PI + 位置环PD</hl>，省去速度环，以获得最高的反驱透明度和力控带宽。'}],

ctrl:{title:'控制算法演进趋势',sub:'From PID to ADRC/MPC/RL · 智能关节节点时代',
params:[['当前主流','电流PI+速度PI+位置PD'],['电流环趋势','ASIC硬件化 / 450kHz级'],['新兴算法','ADRC/MPC/RL+MPC'],['关节形态','智能节点(自诊断)'],['减速器趋势','弱化/电机强化'],['总线演进','EtherCAT→GMSL2/TSN']],sections:[
{h:'趋势一：外层算法升级——PID → 观测器/MPC/RL',p:'传统PID三环在面对非线性摩擦、负载惯量剧烈变化、外界冲击扰动时力不从心。业界正在进行的升级：①<hl>ADRC（自抗扰控制）</hl>——韩京清先生提出，核心是<hl>扩张状态观测器（ESO）</hl>实时估计系统"总扰动"（包括未建模非线性、外部扰动、参数变化）并动态补偿，将复杂系统补偿为"积分器串联型"，已被应用于直线电驱动关节，克服传统PID在非线性和不确定性系统中的局限；②<hl>改进MPC（模型预测控制）</hl>——在高精度机电伺服中，引入带状态观测器和自适应权重的MPC，建立考虑关节摩擦和负载扰动的扩展状态方程，有研究显示负载突变下位置恢复时间仅<hl>0.28秒</hl>，稳态误差<hl>±0.08mm</hl>；③<hl>RL+MPC融合</hl>——规划与控制软件融合模型驱动的MPC和数据驱动的强化学习（RL）及具身智能大模型（VLA），结合ADRC抗扰机制，这是当前头部厂商（特斯拉/波士顿动力/宇树/Figure）的核心路线。'},
{h:'趋势二：三环被"压缩"和"重构"',p:'①<hl>电流环硬件化</hl>——专用控制ASIC（如CT-2001B）将PID硬件运算延时压缩到<hl>0.2ns级</hl>，电流环最高可达<hl>450kHz</hl>，集成ADRC自动补偿齿槽转矩，三环整定由芯片自动完成，MCU从FOC运算中解放出来做更高层策略；②<hl>位置环被PD模式替代</hl>——在强化学习框架下，策略网络直接输出目标位置，底层PD执行跟踪，PD既是控制律也是物理阻抗（弹簧-阻尼系统）；③<hl>双环架构兴起</hl>——准直驱路线（MIT Mini Cheetah/宇树Go2）下，<hl>"电流环（力矩）+ 位置环PD"</hl>双环成为高动态腿部关节的标配，省去速度环以最大化反驱透明度和力控带宽。'},
{h:'趋势三：关节向"智能节点"演进',p:'关节不再是被动执行器，而是具备自诊断与局部控制能力的<hl>智能节点</hl>：①<hl>自诊断</hl>——实时监测绕组温度、驱动器温度、编码器状态、轴承振动、电流异常，本地判断故障并执行保护策略；②<hl>局部控制闭环</hl>——部分轨迹规划和力控算法下沉到关节MCU执行，减轻主控制器负担；③<hl>标准化组件</hl>——从"深度定制"转向"标准化组件"，这是人形机器人规模量产与降本的关键；④<hl>减速器角色弱化、电机强化</hl>——准直驱路线用高极数无框电机+低减速比（6:1~10:1）替代传统谐波（100:1），新型材料（PEEK复合材料齿轮）打破重量与成本边界；⑤<hl>一体化融合</hl>——电机、减速器、双编码器、驱动器、制动器、通信接口彻底融合为单模组，仅需电源+网线即可工作。'},
{h:'趋势四：带宽持续推高',p:'各环节带宽都在快速提升：电流环从1-3kHz → <hl>5-20kHz（GaN+专用ASIC）</hl>；速度环从500Hz → <hl>2-5kHz</hl>；位置环从100Hz → <hl>1kHz及以上</hl>；通信总线从CAN（1Mbps）→ EtherCAT（100Mbps，同步精度1μs级）→ 未来TSN（时间敏感网络）或GMSL2（千兆级串行链路）。带宽提升的意义是：关节响应更快、力控带宽更高、全身MPC控制频率可以从目前的200-500Hz提升到1-5kHz，双足行走的动态性能和抗扰能力将迎来质的飞跃。'},
{h:'工程选型建议',p:'按执行器路线选择：①<hl>上肢/精密操作</hl> → 刚性谐波 + 完整三环（电流PI / 速度PI / 位置P或PD）+ 前馈+重力补偿；②<hl>腿部/高动态</hl> → 准直驱QDD + 双环（电流PI / 位置PD）+ 扰动观测器 + 摩擦力补偿；③<hl>服务/交互</hl> → 弹性关节SEA + 三环 + 阻抗控制 + 力矩传感器。按发展阶段：原型验证→经典PID三环（位置环去I）；量产优化→PID三环+ADRC补偿+专用ASIC硬件加速；高端路线→改进MPC/RL+ADRC+智能关节节点。一句话：<hl>当前主流是"电流环PI+速度环PI+位置环P/PD"的三环级联，位置环去积分是人形机器人的关键特征；未来3-5年三环不会被推翻，但外层将被ADRC/MPC/RL重构，电流环将被ASIC硬件化，关节将进化为具备自诊断能力的智能节点。</hl>'}],

harmonic:{title:'谐波减速器原理',sub:'Harmonic Drive Strain Wave Gearing',
params:[['减速比','30:1~320:1'],['效率','70%~90%'],['背隙','<1 arcmin (<0.017°)'],['扭矩密度','极高'],['核心部件','波发生器/柔轮/刚轮'],['寿命','8000~20000h']],sections:[
{h:'三大核心部件',p:'<hl>谐波减速器（Harmonic Drive / Strain Wave Gear）</hl>由美国发明家C.W. Musser于1957年发明，因其核心零件（柔轮）在运动中产生可控的弹性形变波而得名。它由三个同心部件组成：①<hl>波发生器Wave Generator</hl>——一个椭圆形的薄壁滚珠轴承，内孔与电机轴连接，是输入端（高速）；②<hl>柔轮Flexspline</hl>——一个薄杯形/帽形弹性金属齿轮，外径比刚轮略小（少2个齿），开口端外齿与刚轮内齿啮合，底部法兰是输出端（低速）；③<hl>刚轮Circular Spline</hl>——一个刚性内齿圈，固定在减速器壳体上，齿数比柔轮多2个。'},
{h:'工作原理（神奇的齿差传动）',p:'当波发生器（椭圆凸轮）装入柔轮内壁时，柔轮被撑成椭圆形。椭圆长轴两端的柔轮外齿与刚轮内齿完全啮合，短轴方向的齿完全脱开，其余区域处于逐渐啮合/逐渐脱开的过渡状态。电机带动波发生器旋转时，椭圆长轴位置跟着旋转，柔轮的啮合区域也随之转动。关键在于：<hl>刚轮比柔轮多2个齿</hl>——波发生器每转1圈（360°），柔轮相对于刚轮反方向转过2个齿的角度。如果柔轮有200齿、刚轮有202齿，减速比就是200:2=100:1。也就是说：<hl>输入（波发生器）转100圈，输出（柔轮）反向转1圈</hl>。这就是谐波减速器高减速比的奥秘——仅用一级齿轮就能实现50:1到320:1的减速，而普通行星齿轮需要3-5级串联才能达到同样减速比。'},
{h:'核心优势',p:'谐波减速器之所以成为人形机器人关节的绝对主流，是因为它几乎完美契合了关节需求：①<hl>极高扭矩密度</hl>——同体积下扭矩是行星减速器的2-3倍，因为同时啮合的齿数多达总齿数的15-25%（普通齿轮仅1-2对齿同时啮合）；②<hl>零背隙/近零背隙</hl>——利用柔轮弹性形变实现无侧隙啮合，回程间隙<1角分（0.017°），这对机器人关节的精确定位至关重要；③<hl>同轴输入输出</hl>——电机轴和输出法兰在同一轴线上，关节外形是圆柱形，非常适合集成进机器人关节；④<hl>零部件极少</hl>——仅3个核心零件（波发生器+柔轮+刚轮+交叉滚子轴承），可靠性高。'},
{h:'局限性与失效模式',p:'谐波减速器也有缺点：①<hl>柔轮疲劳寿命</hl>——柔轮反复弹性变形（每秒几十次），存在金属疲劳问题，典型寿命8000-20000小时（依负载和转速而定）；②<hl>扭转刚度非线性</hl>——低扭矩区柔轮弹性变形较大，刚度呈非线性，影响力控精度；③<hl>反驱力矩较大</hl>——从输出端反向转动需要克服波发生器轴承摩擦和柔轮变形力，这使得纯谐波方案的"反驱透明度"不如准直驱方案（但通过电流环力控可部分补偿）；④<hl>柔轮不能承受大径向力</hl>——需要外部交叉滚子轴承来承受径向/倾覆载荷。'}],
vendors:[{n:'哈默纳科 Harmonic Drive',r:'CSG/SHF/SHD系列(日本，创始者)',m:1},{n:'绿的谐波 Leaderdrive',r:'LHSG/LHG/Y系列(国产龙头)',m:1},{n:'来福谐波 Laifual',r:'LHD/LSD系列(国产)'},{n:'日本新宝 Nidec-Shimpo',r:'WPS系列'},{n:'Harmonic Drive AG',r:'德国子公司'}]},

encoder:{title:'编码器 · 关节的"视网膜"',sub:'Encoder · Position Sensing',
params:[['类型','磁编码器/光编码器'],['分辨率','14~23 bit (0.02°~0.0004°)'],['精度','±0.01°~±0.05°'],['通信接口','SPI/BiSS-C/EnDat'],['刷新率','10~40 kHz'],['工作温度','−40°C~+125°C']],sections:[
{h:'为什么需要双编码器',p:'高性能人形机器人关节普遍采用<hl>双编码器方案</hl>：①<hl>电机端编码器（高速端）</hl>——安装在电机转子轴上，转速高（3000-6000rpm），需要高刷新率（10-40kHz），用于FOC电流换相和速度闭环；②<hl>输出端编码器（低速端）</hl>——安装在谐波减速器输出法兰侧（经过减速后的位置），直接测量关节实际输出角度，用于消除减速器背隙/柔轮弹性变形带来的误差，提供精确的关节位置反馈。双编码器方案可以：补偿谐波减速器的迟滞和柔性、实现更精确的位置控制、检测关节碰撞（输出端位置偏差异常）。'},
{h:'磁编码器原理',p:'<hl>磁编码器</hl>是目前人形机器人关节的主流选择（相比光编码器抗振、抗污染、成本低）。原理：在电机轴/输出轴上安装一个<hl>多极磁环</hl>（径向充磁的永磁环，通常32对极或64对极），磁环前方1-2mm处安装<hl>霍尔/磁阻传感器芯片</hl>（如ams-OSRAM的AS5047/AS5311、RLS的AksIM、瑞列格的RM44）。芯片内部集成4个Hall元件或TMR/AMR磁阻元件，检测磁环旋转时的磁场分布变化，通过内部DSP计算出绝对角度位置。19bit磁编码器单圈分辨率达524,288个计数（约0.0007°），精度±0.02°~±0.05°。'},
{h:'光编码器原理',p:'<hl>光电编码器</hl>精度更高但更娇气：在码盘上刻有精密光栅（玻璃/金属盘），LED发光穿过光栅被光电二极管接收，通过计算莫尔条纹得到角度。光编码器分辨率可达23bit（800万线/圈），精度±0.005°，但对油污、粉尘、振动敏感，成本高。高端工业机器人（如KUKA/ABB）和部分人形机器人的输出端使用光编码器，电机端仍使用磁编码器。增量式编码器只输出相对位置（需要找零），绝对式编码器上电即知位置（无需回零），人形机器人关节必须使用<hl>绝对式编码器</hl>（否则每次上电都要校准姿态，非常危险）。'},
{h:'编码器在FOC中的关键作用',p:'FOC算法对位置信息的依赖极强：①<hl>电角度计算</hl>——需要知道转子磁钢的精确位置（误差<5°电角度）才能正确换相，否则电机效率骤降甚至剧烈振动；②<hl>速度估计</hl>——通过位置差分计算转速（M法/T法/M/T法测速），用于速度闭环；③<hl>位置闭环</hl>——精确的关节输出位置是机器人运动控制的基础。编码器延迟或噪声会直接导致电流环振荡、电机啸叫、力矩波动等严重问题，因此编码器与MCU之间的通信（SPI通常在10-20MHz）需要严格的PCB布线和信号完整性设计。'}],

comm:{title:'通信总线 · 关节的神经网络',sub:'Communication Bus Architecture',
params:[['主流总线','EtherCAT'],['通信周期','0.5~1 ms'],['同步精度','<1 μs (DC同步)'],['传输速率','100 Mbps'],['拓扑结构','线型/树型'],['从站数量','理论65535']],sections:[
{h:'为什么需要实时总线',p:'人形机器人有20-40个关节电机，必须保证所有关节<hl>在同一时刻执行指令</hl>（同步误差<10μs），否则机械臂运动轨迹会偏离、双足行走会抖动甚至摔倒。普通的USB、TCP/IP以太网、CAN 2.0A都无法满足这种硬实时需求：USB轮询机制有不确定延迟；TCP/IP有协议栈开销和重传机制；CAN 2.0最高1Mbps带宽且每帧最多8字节，20个关节1kHz周期需要20000帧/秒，容易拥塞。因此工业级人形机器人（包括宇树H1）普遍使用<hl>EtherCAT实时工业以太网</hl>。'},
{h:'EtherCAT工作原理',p:'<hl>EtherCAT（Ethernet for Control Automation Technology）</hl>由德国Beckhoff公司2003年开发，是目前性能最强的工业以太网总线之一。其核心创新是<hl>"On-the-Fly"处理机制</hl>：主站发送一帧以太网数据包，这个数据包像火车一样依次"穿过"所有从站（关节驱动板），每个从站在帧经过时<hl>硬件级实时提取属于自己的指令数据</hl>（不需要软件协议栈处理，延迟<1μs），同时把自己的反馈数据（当前位置/速度/电流/温度）插入到帧的对应位置。最后一个从站把帧发回，经过所有从站回到主站。整轮通信（发+收）在一个以太网帧内完成，20个关节的典型周期<250μs，同步精度<1μs（使用DC分布式时钟）。'},
{h:'CAN-FD 总线',p:'<hl>CAN-FD（CAN with Flexible Data-rate）</hl>是传统CAN总线的升级版，数据速率从1Mbps提升到5-8Mbps，每帧数据长度从8字节扩展到64字节。相比EtherCAT，CAN-FD的优势是：①<hl>布线简单</hl>——仅需2根差分线（CAN_H/CAN_L）加电源线，而EtherCAT需要专用PHY和网线（4对差分线）；②<hl>成本低</hl>——CAN-FD收发器和协议栈比EtherCAT从站控制器（ESC如LAN9252）便宜很多；③<hl>可靠性高</hl>——CAN总线在汽车行业经过几十年验证，EMC抗干扰能力强。劣势是带宽和同步精度不如EtherCAT（典型周期2-5ms）。许多中小型人形机器人和四足机器人使用CAN-FD作为关节通信总线。'},
{h:'总线拓扑与冗余',p:'人形机器人关节通信通常采用<hl>手拉手线型拓扑（Daisy Chain）</hl>：主控板EtherCAT主站→腰部→左髋→左膝→左踝→（回环到右踝）→右膝→右髋→左肩→左肘→...→最后一个关节回到主站。部分安全关键设计采用<hl>双环冗余</hl>（双向通信，一处断线可反向绕行）。EtherCAT使用标准RJ45以太网接口或工业M8/M12连接器，但机器人内部多使用<hl>紧凑板对板连接器</hl>或<hl>中空走线滑环</hl>（旋转关节处）。除了EtherCAT/CAN的运动控制总线，机器人还有单独的USB/PCIe/GMSL2总线连接相机和激光雷达，以及电源管理的I2C/SMBus。'}],
vendors:[{n:'Beckhoff 倍福',r:'EtherCAT 技术创始',m:1},{n:'Microchip',r:'LAN9252/LAN9253 ESC从站芯片',m:1},{n:'Intel',r:'EtherCAT主站网卡'},{n:'TI/Bosch',r:'CAN-FD收发器/控制器'},{n:'SOEM',r:'开源EtherCAT主站协议栈'}]},

sensor:{title:'传感系统 · IMU与力觉',sub:'IMU & Force/Torque Sensing',
params:[['IMU类型','6轴/9轴 MEMS'],['陀螺仪精度','1~10°/h'],['加速度计精度','mg级'],['六维力精度','0.5%~2% F.S.'],['力传感器采样','1~5 kHz'],['IMU采样','2~8 kHz']],sections:[
{h:'IMU 惯性测量单元',p:'<hl>IMU（Inertial Measurement Unit）</hl>是人形机器人的"平衡觉"器官，提供高频率（1-8kHz）的姿态角加速度和角速度信息，是<hl>状态估计</hl>（计算机器人当前身体姿态、速度、高度）和<hl>平衡控制</hl>的核心传感器。人形机器人通常在<hl>躯干中心（质心附近）</hl>安装一颗高精度IMU，在<hl>双脚</hl>各安装一颗辅助IMU。6轴IMU = 3轴加速度计 + 3轴陀螺仪；9轴IMU额外增加3轴磁力计（用于航向角修正，但室内电磁环境复杂时磁力计容易受干扰）。'},
{h:'MEMS IMU 技术',p:'目前机器人几乎全部使用<hl>MEMS（微机电系统）</hl>IMU，相比传统光纤陀螺仪（FOG）体积小、成本低、可批量生产。高端MEMS IMU：①<hl>ADI ADIS16505/16507</hl>（战术级，零偏稳定性2°/h~10°/h，单价数千元）；②<hl>Bosch BMI088/BMI090L</hl>（工业级，消费级价格，广泛用于四足和人形）；③<hl>TDK InvenSense ICM-42688</hl>（高性能6轴，消费无人机大量使用）；④<hl>Xsens MTi系列</hl>（工业级模块，内置传感器融合算法直接输出姿态角）。IMU数据通过<hl>卡尔曼滤波/互补滤波</hl>与腿式里程学（关节编码器正运动学计算的足部位置）和视觉SLAM数据融合，得到机器人完整的位姿估计。'},
{h:'六维力/力矩传感器',p:'<hl>六维力传感器（6-axis F/T Sensor）</hl>可以同时测量作用在传感器上的3个互相垂直的力分量（Fx/Fy/Fz，前后/左右/垂直方向）和3个力矩分量（Mx/My/Mz，绕三个轴的扭矩）。在人形机器人中通常安装在<hl>踝关节</hl>（测量地面反力GRF，用于ZMP平衡控制）和<hl>腕关节</hl>（测量手部接触力，用于力控操作）。核心技术是<hl>应变片测量弹性体变形</hl>——传感器内部有一个精密加工的金属弹性体（铝合金/钛合金/不锈钢），在弹性体的薄壁梁上贴有多组半导体应变片，受力时弹性体微小变形（微米级）导致应变片电阻变化，通过惠斯通电桥测量电压变化，再通过标定矩阵解耦计算出6个力/力矩分量。'},
{h:'其他传感器',p:'除了IMU和力传感器，人形机器人还配备：①<hl>温度传感器</hl>（每个关节电机绕组和驱动板上都有NTC热敏电阻，监测温度防止过热退磁或烧毁驱动板）；②<hl>电流传感器</hl>（每相电流用shunt电阻或霍尔电流传感器采样，用于FOC和力矩控制）；③<hl>电压传感器</hl>（母线电压监测，欠压/过压保护）；④<hl>触觉传感器</hl>（灵巧手指尖，检测接触力和滑动）；⑤<hl>激光雷达/深度相机/鱼眼相机</hl>（头部环境感知，属于外部传感器而非关节内部传感器）。'}],

/* ==== 三环控制策略与 ADRC ==== */
triloop:{title:'三环控制 · PI / PD / ADRC 选型',sub:'Three-Loop Control Strategy Selection',
params:[['电流环','PI @2~5kHz'],['速度环','PI @200~500Hz'],['位置环','PD+前馈 @50~150Hz'],['力控模式','电流环直通'],['ADRC适用','扰动大/模型不准'],['带宽递减','内环&gt;外环5~10倍']],sections:[
{h:'串级三环架构回顾',p:'关节伺服驱动器采用<hl>电流环→速度环→位置环</hl>串级结构，内环带宽必须远高于外环（一般5~10倍以上），这样外环设计时可以把内环近似看作理想环节。<hl>电流环</hl>直接控制电机扭矩（q轴电流正比扭矩），<hl>速度环</hl>输出电流指令，<hl>位置环</hl>输出速度指令。每一环控制器的选型，取决于<hl>被控对象特性</hl>和<hl>该环要解决的核心问题</hl>。'},
{h:'电流环：PI 是标准答案',p:'电流环的被控对象是电机绕组回路 <code>U = R·i + L·di/dt + 反电动势</code>，本质是<hl>一阶惯性环节</hl>。PI 控制器的积分项恰好补偿电阻压降、实现电流无静差跟踪，比例项提供快速响应；配合 FOC 中的<hl>前馈解耦</hl>（−ωL·iq、+ωL·id 交叉耦合补偿和反电动势 Ke·ω 补偿），PI 即可让电流环带宽达到 2~5kHz。电流环<hl>不用 D 微分项</hl>——电流采样噪声大（PWM 开关噪声+shunt 采样毛刺），微分会放大噪声导致 MOSFET 误动作；也<hl>一般不用 ADRC</hl>——电流环对象模型足够精确，ESO 观测收益小反而增加 1~2kHz 计算负担。'},
{h:'速度环：PI 为主，机器人常用 PI+滤波',p:'速度环的被控对象是转动惯量 <code>J·dω/dt = T − T负载 − B·ω</code>，是<hl>积分环节</hL>，PI 的积分项保证转速无静差。工程要点：①<hl>速度反馈噪声</hl>——编码器位置差分测速噪声大，需加二阶低通滤波（截止频率约为速度环带宽的 3~5 倍）；②<hl>积分限幅+抗饱和</hl>（Anti-Windup）防止大误差时积分饱和引起超调振荡；③人形机器人腿部关节速度环常加入<hl>扭矩前馈</hl>（重力补偿/动力学模型前馈），等效于"PI+前馈"，可把跟踪误差降低一个数量级。'},
{h:'位置环：PD + 前馈，刻意不用 I',p:'位置环几乎清一色采用 <hl>P 或 PD + 前馈</hl>，<hl>刻意不加积分项</hl>：①积分引入 90° 相位滞后，位置环带宽本来就受机械谐振限制（谐波柔轮/腿杆弹性会产生 100~300Hz 谐振），加 I 极易引发振荡；②关节的稳态保持力可由<hl>重力前馈</hL>和电流环积分承担，位置环无需自己消静差；③人形机器人全身控制下发的是 1kHz 位置+速度+扭矩前馈三元组（q_des, dq_des, τ_ff），位置环实际执行的是 <code>τ = Kp·(q_des−q) + Kd·(dq_des−dq) + τ_ff</code> 的<hl>阻抗控制</hl>形式——这正是 PD 结构。这也是宇树/特斯拉等整机厂关节接口的标准模式。'},
{h:'什么时候用 ADRC',p:'<hl>ADRC（自抗扰控制）</hl>适合两类场景：①<hl>外部扰动大且变化剧烈</hl>——如腿足关节着地瞬间的地面冲击、手臂接触操作的接触力；②<hl>对象模型不准/强非线性</hl>——谐波减速器的非线性摩擦与柔轮迟滞、负载惯量随姿态大幅变化。ADRC 不依赖精确模型，把"模型不准+外部扰动"打包成<hl>总扰动</hl>，用扩张状态观测器 ESO 实时估计并前馈补偿，等效于给系统装了一个"扰动对消器"。工程上常见组合：<hl>位置环 ADRC + 速度/电流环 PI</hl>，或把 ESO 估计的总扰动同时用于碰撞检测（扰动突增即判定碰撞）。'},
{h:'三环控制策略对比总表',p:'<table class="tbl"><tr><th>控制环</th><th>被控对象</th><th>常用策略</th><th>选型理由</th></tr><tr><td><b>电流环</b></td><td>RL 一阶电路</td><td><b>PI</b> + FOC解耦前馈</td><td>模型精确、噪声大，积分消静差，微分有害</td></tr><tr><td><b>速度环</b></td><td>转动惯量积分环节</td><td><b>PI</b> + 低通滤波 + 扭矩前馈</td><td>积分保证转速无静差，滤波抑制测速噪声</td></tr><tr><td><b>位置环</b></td><td>质量-弹簧(柔性)系统</td><td><b>PD + 前馈</b>（阻抗控制）</td><td>积分致谐振振荡，保持力靠重力前馈</td></tr><tr><td><b>位置环(重载)</b></td><td>强扰动/模型不准</td><td><b>ADRC</b>（ESO+PD）</td><td>总扰动实时估计补偿，抗冲击鲁棒</td></tr><tr><td><b>全身平衡</b></td><td>欠驱动多体系统</td><td>MPC/WBC 输出 τ_ff</td><td>预测未来轨迹，前馈给各关节 PD</td></tr></table>'},
{h:'交互仿真：位置控制 vs 阻抗控制（力控）',p:'场景：关节接到 <code>0.9 rad</code> 的位置阶跃指令，但 <code>0.55 rad</code> 处有一堵控制器"不知道"的刚性墙壁（模拟意外碰撞/接触装配）。<hl>位置控制</hl>用高刚度 PD（Kp=400）：自由空间跟踪又快又准，但撞墙瞬间产生巨大接触力尖峰，之后持续硬推墙壁（稳态接触力≈Kp×越墙指令距离）；<hl>阻抗控制</hl>用低刚度 PD（Kp=40）：自由空间跟踪稍慢、且接触后让步偏离目标，但接触力只有位置控制的约 <b>1/10</b> 且无尖峰——这正是人形机器人关节必须支持力控/阻抗模式的原因：<hl>碰撞安全与柔顺交互比极致位置精度更重要</hl>。'},{h:'力控仿真演示',p:'<div class="simbox" id="fcSimBox"><canvas id="fcCv" width="640" height="300"></canvas><div class="simlg"><span><i style="background:#8a94a4"></i>目标指令</span><span><i style="background:#2b8eff"></i>位置控制(刚性)</span><span><i style="background:#f0a73a"></i>阻抗控制(柔性)</span><span style="margin-left:auto;color:var(--faint)">上：关节角度 · 下：接触力</span></div><div class="anim-ctrl" style="margin-top:8px"><button class="ab on" id="fcRun">▶ 重新演示</button></div></div>'}],
vendors:[{n:'宇树科技',r:'M107 三环伺服',m:1},{n:'韩京清(中科院)',r:'ADRC 理论创始'},{n:'高志强(克利夫兰州立)',r:'ESO 带宽参数化'},{n:'TI C2000',r:'FOC+ADRC 参考设计'},{n:'峰岹科技',r:'国产伺服控制芯片'}]},

adrc:{title:'ADRC 自抗扰控制 · 推导与代码',sub:'Active Disturbance Rejection Control',
params:[['提出者','韩京清 1990s'],['核心部件','TD / ESO / NLSEF'],['关键参数','b0 + ωc + ωo'],['带宽关系','ωo ≈ 3~5×ωc'],['离散周期','0.5~1 ms'],['适用对象','二阶系统为主']],sections:[
{h:'一、问题出发点：把"不知道"当作扰动',p:'经典 PID 依赖精确模型整定，模型不准就振荡。ADRC 的哲学是<hl>不依赖精确模型</hl>：把对象写成标准积分器形式，所有"对不上"的部分（未建模动态、参数漂移、外部干扰）打包为<hl>总扰动 f</hl>，在线估计并补偿。只要总扰动能被"看见"（观测），控制就能做好——这是 ADRC 与 PID 的本质区别。'},
{h:'二、对象建模：二阶标准型',p:'关节位置环对象（含减速器与负载）一般可写成二阶形式：<div class="cb">ÿ(t) = f( y, ẏ, w(t), t ) + b0·u(t)\n\ny    : 关节输出角度（被控量）\nu    : 控制量（电流/扭矩指令）\nb0   : 控制增益的估计值（≈ 1/J，J 为转动惯量）\nf(·) : 总扰动 = 摩擦 + 重力 + 柔轮弹性 + 外部接触力 + 模型误差</div>关键技巧：<hl>把 f 扩张为第三个状态 x3 = f</hl>，令 x1 = y，x2 = ẏ，则系统变为线性扩张形式：<div class="cb">ẋ1 = x2\nẋ2 = x3 + b0·u      ← x3(总扰动) 直接加在加速度上\nẋ3 = ḟ ≈ 0          ← 假设扰动缓变（h 表示其变化率）</div>'},
{h:'三、ESO 扩张状态观测器推导',p:'对上面的扩张系统构造状态观测器，用<hl>输出误差 e = z1 − y</hl> 驱动三个状态的校正：<div class="cb">ė  = ż1 − z2 + β1·e\nż1 = z2 − β1·e\nż2 = z3 − β2·fal(e,α1,δ) + b0·u\nż3 = −β3·fal(e,α2,δ)\n\nfal(e,α,δ) = |e|^α·sign(e)      (|e| &gt; δ)\n             e/δ^(1−α)           (|e| ≤ δ)   ← 线性段防抖</div>z1→估计位置，z2→估计速度，<hl>z3→估计总扰动</hl>。高志强教授的<hl>带宽参数化</hl>让整定大大简化：三个增益只用一个观测器带宽 ωo 表示：<div class="cb">β1 = 3ωo    β2 = 3ωo²    β3 = ωo³\n（特征多项式 (s+ωo)³ = s³+3ωo·s²+3ωo²·s+ωo³）</div>经验取 <hl>ωo ≈ (3~5)×ωc</hl>（ωc 为控制器带宽），且 ωo 受采样频率限制（ωo &lt; fs/10）。'},
{h:'四、TD 跟踪微分器',p:'TD 解决两个问题：①安排平滑的过渡过程（避免阶跃指令激励谐振）；②高质量提取微分信号（不放大噪声）。离散形式：<div class="cb">v1(k+1) = v1(k) + h·v2(k)\nv2(k+1) = v2(k) + h·fhan(v1−r, v2, r0, h0)\n\nv1 → 跟踪目标位置 r 的平滑轨迹\nv2 → v1 的微分（高质量速度前馈）\nfhan() → 最速控制综合函数（韩京清给出解析式）</div>参数 r0 决定过渡快慢。工程简化：若上位机已下发平滑轨迹+速度前馈（人形机器人 1kHz 插补正是如此），<hl>TD 可省略</hl>，直接用指令的 v1、v2。'},
{h:'五、控制律：误差反馈 + 扰动补偿',p:'状态误差反馈（线性 LSEF 最常用）：<div class="cb">e1 = v1 − z1        （位置误差）\ne2 = v2 − z2        （速度误差）\nu0 = kp·e1 + kd·e2  （PD 控制量）\n\nkp = ωc²    kd = 2ωc    （极点配置到 −ωc）</div>最后一步是 ADRC 的灵魂——<hl>扰动补偿</hl>：<div class="cb">u = u0 − z3/b0\n\n物理意义：z3 估计出总扰动后，用 −z3/b0 的控制量\n把它"对消"掉，对象被实时改造成纯双积分器\nÿ ≈ u0，之后 PD 控制双积分器是教科书级简单问题</div>'},
{h:'六、完整 C 代码演示（STM32 可直接移植）',p:'以下代码实现二阶 ADRC（ESO 线性带宽参数化版），所有可调参数均为宏定义，带完整注释：<div class="cb"><span class="cm">/*================ ADRC 可调参数宏定义（调试用） ================*/</span>\n<span class="kw">#define</span> ADRC_DT     (<span class="num">0.001f</span>)  <span class="cm">/* 控制周期 1ms，与伺服环周期一致 */</span>\n<span class="kw">#define</span> ADRC_B0     (<span class="num">8.0f</span>)    <span class="cm">/* 控制增益估计 b0≈1/J，J为折算惯量 */</span>\n<span class="kw">#define</span> ADRC_WC     (<span class="num">60.0f</span>)   <span class="cm">/* 控制器带宽ωc(rad/s)，位置环约50~150 */</span>\n<span class="kw">#define</span> ADRC_WO     (<span class="num">240.0f</span>)  <span class="cm">/* 观测器带宽ωo=4×ωc，须&lt;采样频率/10 */</span>\n<span class="kw">#define</span> ADRC_U_MAX  (<span class="num">20.0f</span>)   <span class="cm">/* 控制量限幅(A)，对应电流环指令上限 */</span>\n\n<span class="kw">typedef struct</span> {\n    <span class="kw">float</span> z1;    <span class="cm">/* ESO状态: 位置估计 */</span>\n    <span class="kw">float</span> z2;    <span class="cm">/* ESO状态: 速度估计 */</span>\n    <span class="kw">float</span> z3;    <span class="cm">/* ESO状态: 总扰动估计 */</span>\n    <span class="kw">float</span> kp;    <span class="cm">/* PD比例增益 = ωc² */</span>\n    <span class="kw">float</span> kd;    <span class="cm">/* PD微分增益 = 2ωc */</span>\n    <span class="kw">float</span> u_prev; <span class="cm">/* 上一周期控制量u，ESO更新z2时需要 */</span>\n} ADRC_TypeDef;\n\n<span class="cm">/*---------------- ADRC 初始化 ----------------*/</span>\n<span class="kw">void</span> <span class="fn">ADRC_Init</span>(ADRC_TypeDef *p)\n{\n    p-&gt;z1 = <span class="num">0.0f</span>; p-&gt;z2 = <span class="num">0.0f</span>; p-&gt;z3 = <span class="num">0.0f</span>;\n    p-&gt;u_prev = <span class="num">0.0f</span>;              <span class="cm">/* 控制量历史值清零 */</span>\n    p-&gt;kp = ADRC_WC * ADRC_WC;      <span class="cm">/* kp = ωc² 极点配置 */</span>\n    p-&gt;kd = <span class="num">2.0f</span> * ADRC_WC;         <span class="cm">/* kd = 2ωc 临界阻尼 */</span>\n}\n\n<span class="cm">/*---------------- ADRC 主计算（每周期调用一次） ----------------\n * r  : 目标位置(rad)   y : 编码器实测位置(rad)\n * 返回: 控制量 u（电流环 q 轴指令，内部已限幅）\n *--------------------------------------------------------------*/</span>\n<span class="kw">float</span> <span class="fn">ADRC_Calc</span>(ADRC_TypeDef *p, <span class="kw">float</span> r, <span class="kw">float</span> y)\n{\n    <span class="cm">/* ESO 增益：带宽参数化 β1=3ωo β2=3ωo² β3=ωo³ */</span>\n    <span class="kw">const float</span> b1 = <span class="num">3.0f</span>*ADRC_WO;\n    <span class="kw">const float</span> b2 = <span class="num">3.0f</span>*ADRC_WO*ADRC_WO;\n    <span class="kw">const float</span> b3 = ADRC_WO*ADRC_WO*ADRC_WO;\n    <span class="kw">float</span> e, u0, u;\n\n    <span class="cm">/* 步骤1: 输出误差（用上一时刻估计值） */</span>\n    e = p-&gt;z1 - y;\n\n    <span class="cm">/* 步骤2: ESO 状态更新（前向欧拉离散） */</span>\n    p-&gt;z1 += ADRC_DT * (p-&gt;z2 - b1*e);\n    p-&gt;z2 += ADRC_DT * (p-&gt;z3 - b2*e + ADRC_B0*p-&gt;u_prev);\n    p-&gt;z3 += ADRC_DT * (-b3*e);\n\n    <span class="cm">/* 步骤3: 状态误差反馈 PD */</span>\n    u0 = p-&gt;kp*(r - p-&gt;z1) + p-&gt;kd*(<span class="num">0.0f</span> - p-&gt;z2);\n\n    <span class="cm">/* 步骤4: 扰动补偿——ADRC 的灵魂 */</span>\n    u = u0 - p-&gt;z3/ADRC_B0;\n\n    <span class="cm">/* 步骤5: 限幅防饱和 */</span>\n    <span class="kw">if</span>(u &gt; ADRC_U_MAX)  u =  ADRC_U_MAX;\n    <span class="kw">if</span>(u &lt; -ADRC_U_MAX) u = -ADRC_U_MAX;\n    p-&gt;u_prev = u;   <span class="cm">/* 保存供下一周期 ESO 使用 */</span>\n    <span class="kw">return</span> u;\n}</div>对比用的经典位置环 PI/PD 代码：<div class="cb"><span class="cm">/* 位置环 PD+前馈（阻抗控制形式，人形机器人主流） */</span>\n<span class="kw">#define</span> POS_KP  (<span class="num">60.0f</span>)   <span class="cm">/* 位置比例增益(N·m/rad) */</span>\n<span class="kw">#define</span> POS_KD  (<span class="num">1.5f</span>)    <span class="cm">/* 位置微分阻尼(N·m·s/rad) */</span>\n\n<span class="kw">float</span> <span class="fn">PosLoop_PD</span>(<span class="kw">float</span> q_des, <span class="kw">float</span> dq_des, <span class="kw">float</span> tau_ff,\n                 <span class="kw">float</span> q, <span class="kw">float</span> dq)\n{\n    <span class="cm">/* τ = Kp(qd−q) + Kd(dqd−dq) + τff(重力/动力学前馈) */</span>\n    <span class="kw">return</span> POS_KP*(q_des-q) + POS_KD*(dq_des-dq) + tau_ff;\n}</div>'},
{h:'七、整定步骤与注意事项',p:'实战整定顺序：①<hl>先估 b0</hl>——b0≈1/J，J 为电机+减速器+负载折算到输出端的总惯量，误差 3 倍以内 ESO 都能扛住；②<hl>先调 ωc</hl>——从小到大，直到出现轻微振荡再回退 30%；③<hl>再调 ωo</hl>——取 3~5 倍 ωc，过大则噪声放大、电流啸叫；④观察 z3 波形——z3 应平滑反映重力/摩擦变化，若剧烈抖动说明 ωo 过高或编码器噪声大。注意：<hl>ESO 计算量约为 PID 的 5 倍</hl>，1kHz 位置环在 STM32G4/H7 上毫无压力，但 20+ 关节全部 ADRC 时建议放在 1kHz 低速环而非 10kHz 电流环。下方仿真演示了同一对象上 PI 与 ADRC 的阶跃响应及 3 秒处突加扰动的恢复对比。'},
{h:'交互仿真：PI vs ADRC 阶跃+扰动恢复',p:'<div class="simbox" id="adrcSimBox"><canvas id="adrcCv" width="640" height="300"></canvas><div class="simlg"><span><i style="background:#8a94a4"></i>目标指令</span><span><i style="background:#2b8eff"></i>PI 响应</span><span><i style="background:#f0a73a"></i>ADRC 响应</span><span style="margin-left:auto;color:var(--faint)">3s 处施加外部冲击扰动</span></div><div class="anim-ctrl" style="margin-top:8px"><button class="ab on" id="adrcRun">▶ 重新演示</button></div></div>'}],
vendors:[{n:'韩京清',r:'自抗扰控制 ADRC 创始人',m:1},{n:'高志强 Zhiqiang Gao',r:'ESO 带宽参数化/工业推广',m:1},{n:'宇树科技',r:'关节抗扰控制实践'},{n:'TI/ST',r:'ADRC 控制库参考实现'}]},

    {n:'下肢系统',k:'leg',i:[['髋关节','hip'],['膝关节','knee'],['踝关节','ankle'],['足部','foot']]},
    {n:'核心技术',k:'tech',i:[['FOC驱动算法','foc'],['三环控制架构','loop'],['三环PI/PD/ADRC选型','triloop'],['ADRC推导+代码','adrc'],['控制算法演进','ctrl'],['谐波减速器','harmonic'],['编码器','encoder'],['通信总线','comm']]},
    {n:'拆解教学',k:'td',i:[['关节模组拆解(谐波)','td_joint'],['PowerFlow关节拆解(智元X1)','td_powerflow'],['谐波减速器拆解','td_harmonic'],['行星减速器拆解','td_planetary'],['摆线RV减速器拆解','td_cycloidal']]},
    {n:'选型参考',k:'ref',i:[['关节模组BOM对比','bom']]}
  ];
  navTree.innerHTML=G.map(function(g){
    return '<div class="ng open" data-g="'+g.k+'"><div class="ngh"><span class="cv">▸</span>'+g.n+'</div><div class="ni">'+
      g.i.map(function(it){return '<div class="nit" data-p="'+it[1]+'"><span class="nd"></span>'+it[0]+'</div>';}).join('')+

/* ========== 导航"无3D部件"标注：检测当前机型部件分组，给没有 3D 模型的导航项打标记 ==========
   背景：不同机型结构差异大（如智元 X1 无头部/颈部/灵巧手），点击这类导航项时 3D 场景
   中没有对应高亮部件，容易误导；此函数在机型加载完成后按 partGroups 实测结果标注"无3D" */
function updateNav3d(){
  var pg=(window.Robot3D&&window.Robot3D.partGroups)||{};
  /* 仅检查"实体部件类"导航项：整机总览/知识模块/拆解场景不参与标注 */
  var partKeys=['head','sensor','neck','torso','waist','shoulder','elbow','wrist','hand','hip','knee','ankle','foot'];
  document.querySelectorAll('#navTree .nit').forEach(function(el){
    var k=el.dataset.p;
    if(partKeys.indexOf(k)<0){el.classList.remove('no3d');return;}
    var has=!!(pg[k]&&pg[k].length);
    el.classList.toggle('no3d',!has);
  });
}

/* 导出当前 BOM 对比表格为 CSV 文件（供 Excel/WPS 打开） */
function exportBomCsv(){
  var tbl=document.querySelector('.tbl.bom');
  if(!tbl){alert('请先打开「选型参考 → 关节模组BOM对比」页面');return;}
  var lines=[];
  tbl.querySelectorAll('tr').forEach(function(tr){
    var vals=[];
    tr.querySelectorAll('th,td').forEach(function(c){
      var t=c.innerText.replace(/"/g,'""').replace(/\s+/g,' ').trim();
      vals.push('"'+t+'"');
    });
    lines.push(vals.join(','));
  });
  var csv='\ufeff'+lines.join('\r\n');  /* \ufeff BOM 让 Excel 正确识别中文 */
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='关节模组BOM对比.csv';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
}

function selectPart(key){
  curP=key;
  // 导航高亮
  document.querySelectorAll('.nit').forEach(function(n){n.classList.toggle('on',n.dataset.p===key);});
  // 右侧面板
  var d=DATA[key]||DATA.whole;
  var md=MODELS[curM];
  var intro=(key==='whole')?md.intro:'';
  var params=(key==='whole')?md.params:d.params;
  document.getElementById('stageP').textContent=(key==='whole')?md.stage:d.title;
  var h='<div class="crumb"><b>'+md.name+'</b> <span class="arr">›</span> '+d.title+'</div>';
  h+='<div class="dt1">'+d.title+'</div>';
  h+='<div class="dt2">'+d.sub+'</div>';
  if(intro){h+='<div class="sec"><div class="sh">机型介绍</div><div class="sp">'+intro+'</div></div>';}
  if(params&&params.length){
    h+='<div class="pg">';
    params.forEach(function(p){h+='<div class="pc"><div class="pv">'+p[1]+'</div><div class="pk">'+p[0]+'</div></div>';});
    h+='</div>';
  }
  if(d.sections)d.sections.forEach(function(sec){
    h+='<div class="sec"><div class="sh">'+sec.h+'</div><div class="sp">'+sec.p+'</div></div>';
  });
  if(d.vendors&&d.vendors.length){
    h+='<div class="sec"><div class="sh">供应链 / 参考厂商</div><div class="vtg">';
    d.vendors.forEach(function(v){h+='<span class="vt'+(v.m?' m':'')+'">'+v.n+' · '+v.r+'</span>';});
    h+='</div></div>';
  }
  // 核心技术模块加提示（拆解教学模块有自己的 3D 场景，不加此提示）
  var techKeys=['foc','loop','ctrl','harmonic','encoder','comm','sensor','triloop','adrc','td_joint','td_harmonic','td_planetary','td_cycloidal','bom'];
  if(techKeys.indexOf(key)>=0&&key.indexOf('td_')!==0){
    h='<div class="tip">💡 这是关节模组内部的核心技术知识模块，点击机器人对应部件可查看其具体结构设计。</div>'+h;
  }
  // 无3D部件提示：当前机型没有该部件的 3D 模型（导航已标"无3D"），在说明面板顶部注明，避免误导
  var navEl=document.querySelector('#navTree .nit[data-p="'+key+'"]');
  if(navEl&&navEl.classList.contains('no3d')){
    h='<div class="tip">📌 当前机型 <b>'+md.name+'</b> 没有该部件的 3D 模型（导航已标注「无3D」），以下为通用原理讲解。</div>'+h;
  }
  dIn.innerHTML=h;
  // BOM选型对比页面：在面板底部追加"导出CSV"按钮，便于把参数表存成表格文件
  if(key==='bom'){
    var eb=document.createElement('button');
    eb.className='bb-btn';
    eb.textContent='📥 导出 BOM 为 CSV';
    eb.style.marginTop='6px';
    eb.addEventListener('click',exportBomCsv);
    dIn.appendChild(eb);
  }
  // 拆解教学模块：进入/退出专属 3D 拆解场景
  if(d.td){if(window.enterTdScene)window.enterTdScene(key);}else{if(window.exitTdScene)window.exitTdScene();}
  // 同步底部栏场景下拉框（侧边栏导航与下拉框状态保持一致）
  var bbSceneSel=document.getElementById('bbSceneSel');
  if(bbSceneSel)bbSceneSel.value=(key.indexOf('td_')===0)?key:'';
  // ADRC 页面：挂载 PI vs ADRC 交互仿真
  if(key==='adrc'){if(window.hookAdrcSim)window.hookAdrcSim();}
  // 三环控制页面：挂载位置控制 vs 阻抗控制（力控）交互仿真
  if(key==='triloop'){if(window.hookForceSim)window.hookForceSim();}
  // 3D高亮（选中部件发光，其他半透明）
  if(window.Robot3D&&window.Robot3D.highlight)window.Robot3D.highlight(key);
}

function switchModel(m){
  if(m===curM)return;
  curM=m;
  // 更新所有机型切换按钮的on状态（底部栏+移动端抽屉）
  document.querySelectorAll('.bb-opt, #drwModel .vb').forEach(function(b){
    if(b.dataset.m===m){b.classList.add('on');}else{b.classList.remove('on');}
  });
  document.getElementById('stageM').textContent=MODELS[m].name;
  var dofMap={x1:'27',h1:'19',g1:'23~43'};
  var de=document.getElementById('dof'); if(de)de.textContent=dofMap[m]||'19';
  // 停止关节动画和线框模式
  if(window.Robot3D&&window.Robot3D.toggleAnimDemo){
    if(window.Robot3D.animDemo){window.Robot3D.toggleAnimDemo();updateAnimBtn(false);}
  }
  updateWireBtn(false);
  // 切换3D模型
  if(window.Robot3D&&window.Robot3D.built)window.Robot3D.setModel(m);
  // 重置选中状态到整体
  selectPart('whole');
}

  updateAutoRotBtn(autoRotateOn);
  if(window.Robot3D&&window.Robot3D.setAutoRotate)window.Robot3D.setAutoRotate(autoRotateOn);

function updateAutoRotBtn(on){

function toggleExplode(){

/* ========== 场景切换下拉（底部栏：整机/关节模组/三种减速器） ========== */
function onSceneSelChange(){
  var sel=document.getElementById('bbSceneSel');
  if(!sel)return;
  var v=sel.value;
  if(!v){
    /* 切回整机模型：退出拆解场景并回到整体视图 */
    if(window.exitTdScene)window.exitTdScene();
    selectPart('whole');
    return;
  }
  /* 进入对应拆解场景（selectPart 内部会调用 enterTdScene） */
  selectPart(v);
}

/* ========== 性能状态显示（底部栏：实时FPS + 零件数量） ========== */
var perfFrames=0,perfLastT=performance.now(); /* 帧计数与上次统计时间 */
function updatePerf(){
  perfFrames++;
  var now=performance.now();
  if(now-perfLastT>=1000){
    var fps=Math.round(perfFrames*1000/(now-perfLastT));
    perfFrames=0;perfLastT=now;
    /* 统计当前场景零件(mesh)数量 */
    var cnt=0;
    if(window.Robot3D){
      if(window.Robot3D.isTdActive()){cnt=window.Robot3D.tdMeshCount;}
      else if(window.Robot3D.built){cnt=window.Robot3D.meshCount;}
    }
    var bb=document.getElementById('bbPerf');
    if(bb)bb.textContent='📊 '+fps+' FPS · '+cnt+' 件';
  }
  requestAnimationFrame(updatePerf);
}

/* ========== 初始化（页面加载后立即进入3D模式） ========== */
function init(){

  /* ========== 侧边栏拖宽（桌面端）：拖动左右栏边缘把手调整栏宽 ========== */
  /* 拖宽范围可调参数（调试用宏，单位 px） */
  var NAV_W_MIN=180,NAV_W_MAX=460;   /* 左导航栏宽度范围 */
  var DET_W_MIN=280,DET_W_MAX=620;   /* 右详情栏宽度范围 */
  var rzNav=document.getElementById('rzNav'),rzDet=document.getElementById('rzDet');
  /* 启动时恢复上次拖宽的栏宽（localStorage 持久化） */
  try{
    var sw=localStorage.getItem('robot-nav-w');if(sw)setSidebarW('nav',parseInt(sw,10));
    var dw=localStorage.getItem('robot-det-w');if(dw)setSidebarW('det',parseInt(dw,10));
  }catch(e){}
  /* 设置栏宽：clamp 限幅后写入 CSS 变量并持久化 */
  function setSidebarW(which,w){
    if(isNaN(w))return;
    if(which==='nav'){
      w=Math.max(NAV_W_MIN,Math.min(NAV_W_MAX,w));
      document.documentElement.style.setProperty('--nav-w',w+'px');
      try{localStorage.setItem('robot-nav-w',w);}catch(e){}
    }else{
      w=Math.max(DET_W_MIN,Math.min(DET_W_MAX,w));
      document.documentElement.style.setProperty('--det-w',w+'px');
      try{localStorage.setItem('robot-det-w',w);}catch(e){}
    }
  }
  /* 绑定拖拽：鼠标 + 触摸双通道，拖动中给把手加 drag 高亮类 */
  bindRz(rzNav,'nav');bindRz(rzDet,'det');
  function bindRz(el,which){
    if(!el)return;
    var startX=0,startW=0,dragging=false;
    function down(x){dragging=true;startX=x;startW=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--'+which+'-w'),10)||0;el.classList.add('drag');document.body.style.cursor='col-resize';}
    function move(x){
      if(!dragging)return;
      /* nav 把手向右拖=加宽；det 把手向左拖=加宽（x 减小），故 det 取负增量 */
      var w=startW+((which==='nav')?(x-startX):(startX-x));
      setSidebarW(which,w);
    }
    function up(){if(!dragging)return;dragging=false;el.classList.remove('drag');document.body.style.cursor='';}
    el.addEventListener('mousedown',function(e){e.preventDefault();down(e.clientX);});
    window.addEventListener('mousemove',function(e){move(e.clientX);});
    window.addEventListener('mouseup',up);
    el.addEventListener('touchstart',function(e){if(e.touches.length)down(e.touches[0].clientX);},{passive:true});
    window.addEventListener('touchmove',function(e){if(dragging&&e.touches.length){move(e.touches[0].clientX);}},{passive:true});
    window.addEventListener('touchend',up);
  }

  var rzTimer=null;

  document.querySelectorAll('.bb-opt').forEach(function(b){

  var bps=document.getElementById('btnPoseSquat');if(bps)bps.addEventListener('click',function(){if(window.Robot3D)window.Robot3D.poseSquat();});
  var zi2=document.getElementById('zIn2');if(zi2)zi2.addEventListener('click',function(){zoomCamera(0.83);});
  var zo2=document.getElementById('zOut2');if(zo2)zo2.addEventListener('click',function(){zoomCamera(1.2);});
  var zf2=document.getElementById('zFit2');if(zf2)zf2.addEventListener('click',resetView);
  // 移动端拆解场景控制（对应桌面端底部栏按钮）：返回整机/爆炸/自动演示/顺序拆解/标签/场景切换
  var bwh2=document.getElementById('btnBackWhole2');if(bwh2)bwh2.addEventListener('click',function(){selectPart('whole');});
  var be2=document.getElementById('btnExplode2');if(be2)be2.addEventListener('click',toggleExplode);
  var bd2=document.getElementById('btnDemo2');if(bd2)bd2.addEventListener('click',toggleDemo);
  var bs2=document.getElementById('btnSeq2');if(bs2)bs2.addEventListener('click',toggleSeq);
  var bl2=document.getElementById('btnLabels2');if(bl2)bl2.addEventListener('click',toggleLabels);
  // 移动端抽屉"H1/G1 同屏对比"按钮：与底部栏 bbCompare 同一开关，高亮状态保持一致
  var bc2=document.getElementById('btnCompare2');
  if(bc2)bc2.addEventListener('click',function(){
    if(!window.Robot3D||!window.Robot3D.toggleCompare)return;  /* 3D 引擎未就绪则忽略 */
    var on=window.Robot3D.toggleCompare();   /* 返回切换后的对比开关状态 */
    bc2.classList.toggle('on',on);           /* 移动端按钮高亮 */

  });
  // 机身配色切换：桌面底部栏与移动端抽屉两个下拉互相同步，选中项持久化到 localStorage
  var bcs=document.getElementById('bbColorSel'),cs2=document.getElementById('colorSel2');
  /* 恢复上次选择的配色方案并同步两个下拉的显示（3D侧启动时也会读同一 localStorage 键） */
  var savedColor=null;
  try{savedColor=localStorage.getItem('robot-color');}catch(e){}

    if(bcs&&bcs!==src)bcs.value=k;   /* 同步另一个下拉的选中项 */
    if(cs2&&cs2!==src)cs2.value=k;
  }
  if(bcs)bcs.addEventListener('change',function(){onColorChange(bcs);});
  if(cs2)cs2.addEventListener('change',function(){onColorChange(cs2);});
  // 环境背景切换：桌面底部栏与移动端抽屉两个下拉互相同步，选中项持久化到 localStorage
  var bes=document.getElementById('bbEnvSel'),es2=document.getElementById('envSel2');
  /* 恢复上次选择的环境预设并同步两个下拉的显示（3D侧启动时也会读同一 localStorage 键） */
  var savedEnv=null;
  try{savedEnv=localStorage.getItem('robot-env');}catch(e){}
  if(bes&&savedEnv)bes.value=savedEnv;
  if(es2&&savedEnv)es2.value=savedEnv;
  function onEnvChange(src){
    var k=src.value;
    if(window.Robot3D&&window.Robot3D.setEnvPreset)window.Robot3D.setEnvPreset(k);  /* 3D侧立即切换并写 localStorage */
    if(bes&&bes!==src)bes.value=k;   /* 同步另一个下拉的选中项 */
    if(es2&&es2!==src)es2.value=k;
  }
  if(bes)bes.addEventListener('change',function(){onEnvChange(bes);});
  if(es2)es2.addEventListener('change',function(){onEnvChange(es2);});
  // 移动端机型切换
  document.querySelectorAll('#drwModel .vb').forEach(function(b){
    b.addEventListener('click',function(){switchModel(b.dataset.m);closeDrawers();});

  // 那里有拖动位移阈值判断，可避免"拖动旋转视角后松开"被误判为点击而重置视角
  // 立即初始化3D引擎（不等按钮点击，不等延迟）
  if(window.Robot3D){
    window.Robot3D.enable(function(ok){
      if(ok){
        selectPart('whole');
      }else{
        var ldtip=document.getElementById('ldtip');
        if(ldtip){ldtip.textContent='⚠ 3D引擎加载失败，请使用Chrome/Edge浏览器通过【启动教学页面.bat】打开';ldtip.classList.add('show');}
      }
    });
  }
}

   + 实体地面 + 灯光色温微调，营造"简单好看、稍微真实"的自然光/展厅氛围 */
let lightHemi=null,lightKey=null,lightFill=null;  /* 环境预设要调色的光源引用（initThree 赋值） */
let grid3d=null,gnd3d=null,gndShadowMat=null;     /* 地面网格/地面实体/透明阴影材质引用 */
let LIGHT_INIT=null;                              /* 主光+环境光初始参数（切回无环境时恢复） */
let curEnv='none';                                /* 当前环境预设键（持久化到 localStorage） */
/* 环境预设可调参数（调试用宏） */
const ENV_PRESETS={
  /* 无环境（默认）：透明背景 + 网格地面 + 原五光源，即历史默认观感 */
  none:  {name:'无环境(默认)'},
  /* 晴天自然光：天蓝→暖白渐变 + 太阳光晕 + 草地色地面 + 轻雾 */
  sky:   {name:'晴天自然光', stops:['#5fb2f0','#a8d8f8','#eef4e2'], sun:[0.68,0.16],
          fog:{color:0xdcecf8,near:160,far:520}, ground:0x8faa76, groundRough:0.95,
          keyColor:0xfff2dc, keyInt:1.35, keyPos:[30,42,20], hemiSky:0xbfe0ff, hemiInt:0.7},
  /* 黄昏暖光：橙金→暮紫渐变 + 低角度暖阳 + 暖沙色地面 + 中等雾 */
  sunset:{name:'黄昏暖光', stops:['#f7b26a','#f4845f','#4a3a5e'], sun:[0.3,0.22],
          fog:{color:0xe8b48c,near:140,far:480}, ground:0x9a7f66, groundRough:0.9,
          keyColor:0xffb070, keyInt:1.5, keyPos:[-38,18,12], hemiSky:0xffc9a0, hemiInt:0.55},
  /* 展厅：深灰渐变背景 + 深色地板 + 白光主灯（机器人类产品发布氛围） */
  studio:{name:'展厅', stops:['#3a4048','#23272e','#171a1f'], sun:null,
          fog:{color:0x23272e,near:180,far:560}, ground:0x2c3036, groundRough:0.35,
          keyColor:0xffffff, keyInt:1.6, keyPos:[16,45,26], hemiSky:0x9aa8b8, hemiInt:0.5}
};
/* 生成渐变天空 Canvas 纹理：stops 为从上到下的颜色数组，sun 为可选太阳光晕位置[x,y](0~1) */
function makeSkyTexture(stops,sun){
  var cv=document.createElement('canvas');cv.width=64;cv.height=256;   /* 窄条即可，纵向渐变横向均匀 */
  var ctx=cv.getContext('2d');
  var g=ctx.createLinearGradient(0,0,0,256);
  for(var i=0;i<stops.length;i++)g.addColorStop(i/(stops.length-1),stops[i]);
  ctx.fillStyle=g;ctx.fillRect(0,0,64,256);
  if(sun){   /* 太阳光晕：径向渐变白核+暖晕，叠在天空上部 */
    var sx=sun[0]*64,sy=sun[1]*256;
    var rg=ctx.createRadialGradient(sx,sy,2,sx,sy,42);
    rg.addColorStop(0,'rgba(255,250,230,0.95)');
    rg.addColorStop(0.35,'rgba(255,230,170,0.45)');
    rg.addColorStop(1,'rgba(255,220,150,0)');
    ctx.fillStyle=rg;ctx.fillRect(0,0,64,256);
  }
  var tex=new THREE.CanvasTexture(cv);
  tex.colorSpace=THREE.SRGBColorSpace;
  return tex;
}
/* 应用环境预设：切换背景/雾/地面/灯光；幂等可重复调用 */
function applyEnvPreset(key){
  var p=ENV_PRESETS[key];
  if(!p)return;
  curEnv=key;
  if(!scene)return;                       /* 3D 引擎未初始化（如直接打开页面未启用3D） */
  if(key==='none'){
    /* 无环境：恢复历史默认观感 */
    scene.background=null;
    scene.fog=null;
    if(grid3d)grid3d.visible=true;
    if(gnd3d){gnd3d.material=gndShadowMat;}          /* 恢复透明阴影地面 */
    if(lightKey&&LIGHT_INIT){
      lightKey.color.setHex(LIGHT_INIT.color);lightKey.intensity=LIGHT_INIT.intensity;
      lightKey.position.copy(LIGHT_INIT.pos);
      if(lightHemi){lightHemi.color.setHex(LIGHT_INIT.hemiSky);lightHemi.groundColor.setHex(LIGHT_INIT.hemiGnd);lightHemi.intensity=LIGHT_INIT.hemiInt;}
    }
  }else{
    /* 有环境：渐变天空背景 + 雾 + 实体地面 + 灯光色温调整 */
    if(!p._tex)p._tex=makeSkyTexture(p.stops,p.sun);   /* 天空纹理每预设只生成一次并缓存 */
    scene.background=p._tex;
    scene.fog=new THREE.Fog(p.fog.color,p.fog.near,p.fog.far);
    if(grid3d)grid3d.visible=false;                    /* 实体地面下隐藏网格 */
    if(gnd3d){
      if(!gnd3d.userData.envMat){                      /* 首次创建实体地面材质并缓存复用 */
        gnd3d.userData.envMat={};
      }
      var em=gnd3d.userData.envMat[key];
      if(!em){                                         /* 每个预设的地面材质只创建一次 */
        em=new THREE.MeshStandardMaterial({color:p.ground,roughness:p.groundRough,metalness:0.0});
        gnd3d.userData.envMat[key]=em;
      }
      gnd3d.material=em;                               /* ShadowMaterial 与实体材质来回切换 */
    }
    if(lightKey){
      lightKey.color.setHex(p.keyColor);lightKey.intensity=p.keyInt;
      lightKey.position.set(p.keyPos[0],p.keyPos[1],p.keyPos[2]);
    }
    if(lightHemi){lightHemi.color.setHex(p.hemiSky);lightHemi.intensity=p.hemiInt;}
  }
  try{localStorage.setItem('robot-env',key);}catch(e){}   /* 记住用户选择 */
}
/* 读取持久化的环境预设（页面启动时调用，非法值回退默认无环境） */
function restoreEnvPreset(){
  var k=null;
  try{k=localStorage.getItem('robot-env');}catch(e){}
  if(!k||!ENV_PRESETS[k])k='none';
  return k;
}
curEnv=restoreEnvPreset();           /* 启动时恢复上次选择的环境预设（无记录则默认无环境） */

function loadDeps(cb){
  if(THREE){cb(true);return;}
  /* 依次加载 three 核心 → 轨道控制器 → STL 加载器（加载官方 URDF 网格用）→ 环境贴图生成器（修复金属材质发黑） */
  import('three').then(function(M){THREE=M;return import('three/addons/controls/OrbitControls.js');})
    .then(function(O){OrbitControls=O.OrbitControls;return import('three/addons/loaders/STLLoader.js');})
    .then(function(S){STLLoader=S.STLLoader;return import('three/addons/environments/RoomEnvironment.js');})
    .then(function(R){RoomEnv=R.RoomEnvironment;cb(true);})
    .catch(function(e){console.warn('[Robot3D] 引擎加载失败:',e);cb(false);});
}
/* ==================== 高保真PBR材质系统（航空级铝合金质感） ==================== */
/* 金属主体材质：高强度7075铝合金，磨砂阳极氧化质感 */
function mat(color){
  return new THREE.MeshStandardMaterial({
    color:color,
    metalness:0.88,        /* 高金属度：真实铝合金质感 */
    roughness:0.28,        /* 低粗糙度：细腻磨砂，带微弱反光 */
    envMapIntensity:1.3    /* 环境光反射强度：增强金属质感 */
  });
}
/* 深色结构件材质：碳纤维/黑色阳极氧化 */
function darkMat(color){
  return new THREE.MeshStandardMaterial({
    color:color||0x1e2530,
    metalness:0.75,
    roughness:0.45,
    envMapIntensity:1.0
  });
}
/* 关节电机外壳材质：亮面金属 */
function jointMat(color){
  return new THREE.MeshStandardMaterial({
    color:color||0x9aa4b2,
    metalness:0.92,
    roughness:0.22,
    envMapIntensity:1.5
  });
}
/* 橡胶材质：手部/脚垫防滑橡胶 */
function rubberMat(color){
  return new THREE.MeshStandardMaterial({
    color:color||0x1a1a1a,
    metalness:0.0,
    roughness:0.85
  });
}

/* 加载进度提示条（舞台顶部 ldtip 元素） */

/* 舞台中央加载指示（加载官方模型时显示，避免中间空屏）
   showLoading(text, prog)：prog 为 0~1 的进度（可省略，只更新文字）
   hideLoading()：隐藏中央加载指示 */
function showLoading(text,prog){
