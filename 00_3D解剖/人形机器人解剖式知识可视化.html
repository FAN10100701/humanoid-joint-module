<script type="module" src="js/app.module.js"></script>
<script>
(function(){
  var body=document.body;
  // -------- 主题 --------
  /* 主题仅保留明/暗两种模式 */
  var themes=['light','dark'], ti=0;
  function applyTheme(t){
    if(t==='light')body.removeAttribute('data-theme'); else body.setAttribute('data-theme',t);
    try{localStorage.setItem('robot-theme',t);}catch(e){}
    if(window.Robot3D&&window.Robot3D.applyTheme)window.Robot3D.applyTheme(t);
  }
  function cycleTheme(){ti=(ti+1)%themes.length;applyTheme(themes[ti]);}
  var bt=document.getElementById('btnTheme'); if(bt)bt.addEventListener('click',cycleTheme);
  try{var sv=localStorage.getItem('robot-theme');if(sv&&themes.indexOf(sv)>=0){ti=themes.indexOf(sv);applyTheme(sv);}}catch(e){}

  // -------- 移动端抽屉 --------
  function openDrawer(n){['nav','det','model','view'].forEach(function(x){body.classList.toggle('drawer-'+x,x===n);});}
  function closeDrawers(){['nav','det','model','view'].forEach(function(x){body.classList.remove('drawer-'+x);});}
  var navbg=document.getElementById('navbg'); if(navbg)navbg.addEventListener('click',closeDrawers);
  var ham=document.getElementById('btnHam'); if(ham)ham.addEventListener('click',function(){body.classList.contains('drawer-nav')?closeDrawers():openDrawer('nav');});
  var btab=document.getElementById('btab');
  if(btab)btab.querySelectorAll('button').forEach(function(b){
    b.addEventListener('click',function(){
      var a=b.dataset.act;
      if(a==='theme'){cycleTheme();return;}
      if(a==='nav'){body.classList.contains('drawer-nav')?closeDrawers():openDrawer('nav');}
      else if(a==='det'){body.classList.contains('drawer-det')?closeDrawers():openDrawer('det');}
      else if(a==='model'){openDrawer('model');}
      else if(a==='view'){openDrawer('view');}
      else if(a==='diag'){closeDrawers();if(window.__TOGGLE_DIAG__)window.__TOGGLE_DIAG__();}
    });
  });
  document.querySelectorAll('#drwModel .vb').forEach(function(b){
    b.addEventListener('click',function(){
      if(window.RobotApp)window.RobotApp.switchModel(b.dataset.m);
      document.querySelectorAll('#drwModel .vb').forEach(function(x){x.classList.toggle('on',x===b);});
      closeDrawers();
    });
  });
  function bind(id,fn){var el=document.getElementById(id);if(el)el.addEventListener('click',fn);}
  /* 3D视图控制按钮（移动端抽屉） */
  bind('btnWire2',function(){if(window.RobotApp)window.RobotApp.setWire();});
  bind('btnAnim2',function(){
    if(window.Robot3D&&window.Robot3D.active){window.Robot3D.toggleAnimDemo();}
    else if(window.RobotApp){window.RobotApp.setAnim();}
  });
  bind('btnPoseReset',function(){if(window.Robot3D&&window.Robot3D.active){window.Robot3D.resetJoints();}});
  bind('zIn2',function(){if(window.RobotApp)window.RobotApp.zoomBy(1.2);});
  bind('zOut2',function(){if(window.RobotApp)window.RobotApp.zoomBy(1/1.2);});
  bind('zFit2',function(){
    if(window.Robot3D&&window.Robot3D.active){window.Robot3D.resetJoints();if(window.RobotApp)window.RobotApp.reset();}
    else if(window.RobotApp){window.RobotApp.reset();}
  });

  // -------- 底部栏收起/展开(桌面端) --------
  (function(){
    var bar=document.getElementById('bottomBar'),fold=document.getElementById('bbFold'),exp=document.getElementById('bbExpand');
    if(fold&&bar)fold.addEventListener('click',function(){bar.classList.add('collapsed');if(exp)exp.classList.add('show');});
    if(exp&&bar)exp.addEventListener('click',function(){bar.classList.remove('collapsed');exp.classList.remove('show');});
  })();

  // -------- 模型精细度切换(流畅压缩模型 ↔ 原始 STL 精细模型,切换后重载) --------
  (function(){
    var fine=!1;try{fine=localStorage.getItem('robot-fine-mode')==='1';}catch(e){}
    function sync(){
      var b=document.getElementById('bbFine');if(b)b.classList.toggle('on',fine);
      var b2=document.getElementById('btnFine2');if(b2)b2.classList.toggle('on',fine);
    }
    function toggle(){
      fine=!fine;
      if(window.Robot3D&&window.Robot3D.setFineMode)window.Robot3D.setFineMode(fine);
      else{try{localStorage.setItem('robot-fine-mode',fine?'1':'0');}catch(e){}location.reload();}
    }
    var b=document.getElementById('bbFine');if(b)b.addEventListener('click',toggle);
    var b2=document.getElementById('btnFine2');if(b2)b2.addEventListener('click',toggle);
    sync();
  })();

  // -------- 键盘控制（3D模式） --------
  window.addEventListener('keydown',function(e){
    if(/INPUT|TEXTAREA/.test(e.target.tagName))return;
    var k=e.key;
    var in3d=window.Robot3D&&window.Robot3D.active;
    if(in3d){
      if(k==='ArrowLeft'){window.Robot3D.orbit(8,0);e.preventDefault();}
      else if(k==='ArrowRight'){window.Robot3D.orbit(-8,0);e.preventDefault();}
      else if(k==='ArrowUp'){window.Robot3D.orbit(0,8);e.preventDefault();}
      else if(k==='ArrowDown'){window.Robot3D.orbit(0,-8);e.preventDefault();}
      else if(k==='+'||k==='='){window.Robot3D.dolly(0.9);e.preventDefault();}
      else if(k==='-'||k==='_'){window.Robot3D.dolly(1.1);e.preventDefault();}
    }
    if(k==='Escape'){if(window.RobotApp)window.RobotApp.selectPart('whole');}
  });
})();
</script>
<script>
/* PWA Service Worker 注册：https/http 环境启用（本地 file:// 不支持自动跳过）。
   效果：首次访问后全部模型 .gz 与库文件进入本地缓存，二次访问零网络下载秒开，
   且断网后仍可完整离线浏览 3D 教学页。缓存策略与版本号见 sw.js。 */
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  navigator.serviceWorker.register('sw.js').catch(function(e){
    console.warn('[SW] Service Worker 注册失败（不影响页面正常使用）:',e);
  });
}
</script>
<!-- 诊断面板（入口：桌面底部栏「🔧 诊断」/ 移动端底部标签栏「🔧 诊断」；引擎失败时自动弹出） -->
<div id="diagPanel"><button class="dp-close" id="diagClose" type="button" title="关闭诊断">✕</button><button class="dp-copy" id="diagCopy" type="button">复制</button><button class="dp-reset" id="diagReset" type="button" title="清除 CDN 标记并重新加载(网络恢复后回本地模式)">重置加载</button><div id="diagBody"></div></div>
<script>
/* 诊断面板:入口=桌面底部栏「🔧 诊断」/ 移动端底部标签栏「🔧 诊断」;引擎失败时自动弹出;✕ 关闭 */
/* ★ 诊断代码版本:每次修改 3D 页代码时同步更新,用于区分"部署是否已同步" */
var DIAG_VER='v7.4';  /* 2026-08-17 · 抽屉按钮上下文显隐(整机/拆解)+删除错乱姿态预设(举手礼/大字/半蹲) */
(function(){
  var panel=document.getElementById('diagPanel'),bodyEl=document.getElementById('diagBody'),copyBtn=document.getElementById('diagCopy');
  if(!panel||!bodyEl)return;
  var errs=[];
  window.addEventListener('error',function(e){
    /* 区分脚本错误与资源加载错误(资源错误 message 常为空,iOS 尤其如此) */
    var t=e&&e.target;
    var isRes=t&&t!==window&&(t.tagName==='SCRIPT'||t.tagName==='LINK'||t.tagName==='IMG');
    var desc=isRes?('资源错误:'+String((t.src||t.href)||'?').split('/').pop()):String((e&&e.message)||'脚本错误(空消息)');
    errs.push(desc.slice(0,120)); refresh();
  },true);
  window.addEventListener('unhandledrejection',function(e){ var r=(e&&e.reason)||{}; errs.push('Promise:'+String((r&&r.message)||r).slice(0,120)); refresh(); },true);
  function row(k,v,st){ return '<span style="color:var(--faint)">'+k+'</span> <span class="'+(st===1?'dp-ok':st===0?'dp-bad':'dp-wait')+'">'+(st===1?'✓':st===0?'✗':'…')+'</span> '+v+'<br>'; }
  /* 浏览器/系统识别(诊断不只针对 iOS,也覆盖 Edge/Chrome/Android 等) */
  function uaInfo(){
    var u=navigator.userAgent||'';
    var os='未知';
    if(/Windows NT 10/.test(u))os='Windows 10/11';
    else if(/Windows NT 6/.test(u))os='Windows 7/8';
    else if(/iPhone|iPad|iPod/.test(u))os='iOS';
    else if(/Android/.test(u))os='Android';
    else if(/Mac OS X|Macintosh/.test(u))os='macOS';
    else if(/Linux/.test(u))os='Linux';
    var b='未知';
    if(/Edg\//.test(u))b='Edge '+(u.match(/Edg\/([\d.]+)/)||[])[1];
    else if(/OPR\//.test(u))b='Opera '+(u.match(/OPR\/([\d.]+)/)||[])[1];
    else if(/Chrome\//.test(u))b='Chrome '+(u.match(/Chrome\/([\d.]+)/)||[])[1];
    else if(/Firefox\//.test(u))b='Firefox '+(u.match(/Firefox\/([\d.]+)/)||[])[1];
    else if(/Safari\//.test(u))b='Safari '+(u.match(/Version\/([\d.]+)/)||[])[1];
    if(/MicroMessenger/.test(u))b='微信内置浏览器('+b+')';
    else if(/QQ\//.test(u))b='QQ内置浏览器('+b+')';
    return {os:os,b:b};
  }
  var _ua=uaInfo();
  function refresh(){
    var d=window.__DIAG__||{};
    var h='';
    h+=row('诊断代码',DIAG_VER,1);
    h+=row('浏览器',_ua.b,1);
    h+=row('系统',_ua.os,1);
    h+=row('iOS 版本',d.ios||'—',1);
    h+=row('importmap',d.imp?'原生支持':'兼容补丁',d.imp?1:2);
    h+=row('WebGL',d.gl?'可用':'不可用',d.gl?1:0);
    h+=row('WASM',d.wasm?'可用':'不可用',d.wasm?1:0);
    h+=row('three.js',d.three==='ok'?'已加载':'加载中',d.three==='ok'?1:2);
    h+=row('模型引擎',d.mod==='ok'?'已启动':'等待中',d.mod==='ok'?1:2);
    h+=row('机器人渲染',window.__RENDERED__?'已渲染':'未见渲染',window.__RENDERED__?1:0);
    h+=row('Three 来源',sessionStorage.getItem('__three_cdn__')==='1'?'CDN 回退':'本地库',sessionStorage.getItem('__three_cdn__')!=='1'?1:2);
    if(window.__3D_LOAD_LOG__&&window.__3D_LOAD_LOG__.length){
      h+='<span style="color:var(--faint)">加载日志</span><br>'
        +window.__3D_LOAD_LOG__.slice(-4).map(function(s){return '· '+String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'<br>';}).join('');
    }
    if(errs.length){ h+='<span class="dp-bad">运行期错误 ×'+errs.length+'</span><br>'+errs.slice(-3).join('<br>')+'<br>'; }
    bodyEl.innerHTML=h;
  }
  function openDiag(){panel.style.display='block';refresh();}
  function closeDiag(){panel.style.display='none';}
  function toggleDiag(){var on=panel.style.display!=='block';if(on)openDiag();else closeDiag();}
  var closeBtn=document.getElementById('diagClose');
  if(closeBtn)closeBtn.addEventListener('click',closeDiag);
  var resetBtn=document.getElementById('diagReset');
  if(resetBtn)resetBtn.addEventListener('click',function(){
    try{sessionStorage.removeItem('__three_cdn__');}catch(e){}
    try{sessionStorage.removeItem('__three_cdn_ts__');}catch(e){}
    try{location.reload();}catch(e){}
  });
  var bbDiag=document.getElementById('bbDiag');
  if(bbDiag)bbDiag.addEventListener('click',toggleDiag);
  /* 暴露给移动端 btab 与失败自动弹出使用 */
  window.__TOGGLE_DIAG__=toggleDiag;
  window.__OPEN_DIAG__=openDiag;
  copyBtn.addEventListener('click',function(){
    var d=window.__DIAG__||{};
    var txt='诊断代码 '+DIAG_VER+' | 浏览器='+_ua.b+' | 系统='+_ua.os+' | iOS='+(d.ios||'—')+' | importmap='+(d.imp?'原生':'补丁')+' | WebGL='+(d.gl?'可用':'不可用')+' | WASM='+(d.wasm?'可用':'不可用')+' | three='+(d.three||'?')+' | 引擎='+(d.mod||'?')+' | 渲染='+(window.__RENDERED__?'是':'否')+' | Three来源='+(sessionStorage.getItem('__three_cdn__')==='1'?'CDN':'本地')+(errs.length?(' | 错误:'+errs.join(' ;; ')):'');
    function done(){ copyBtn.textContent='已复制'; setTimeout(function(){ copyBtn.textContent='复制'; },1500); }
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done,function(){ prompt('请手动复制以下诊断信息:',txt); done(); }); }
    else prompt('请手动复制以下诊断信息:',txt);
  });
  setInterval(function(){
    refresh();
    /* 引擎失败:自动弹出诊断面板(桌面/移动端一致,便于反馈排障) */
    if(window.__3D_FAILED__&&panel.style.display!=='block')openDiag();
  },3000);
})();
</script>
</body></html>
