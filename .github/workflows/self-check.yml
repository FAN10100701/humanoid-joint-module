name: site-self-check

# 每次 push / PR 时,在 GitHub 云端自动运行两层检查:
#   self-check: 一键自检.ps1(静态:JS 语法 / 链接 / 搜索索引 / sitemap / 版本一致性 等 37 项)
#   e2e:        浏览器端到端(Python+Playwright,真实打开页面验证搜索/错题本/主题/热力图等交互)
# 失败会标红,便于提交前发现漂移与坏链。

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  self-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run one-click self check
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File "_本地工具\一键自检.ps1"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run E2E tests
        run: |
          python "_本地工具/e2e/e2e_test.py"
