name: site-self-check

# 每次 push / PR 时,在 GitHub 云端自动运行两层检查:
#   self-check: 一键自检.ps1(静态:JS 语法 / 链接 / 搜索索引 / sitemap / 版本一致性 等 37 项)
#   e2e:        浏览器端到端(Python+Playwright,真实打开页面验证搜索/错题本/主题/热力图等交互)
# 失败会标红,便于提交前发现漂移与坏链。

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  self-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run one-click self check
        shell: powershell
        run: |
          # WHY THIS BLOCK MUST STAY PURE ASCII (root cause of this workflow being red since day one):
          # GitHub Actions writes a `run` block to a temp script encoded as UTF-8 *without BOM*.
          # Windows PowerShell 5.1 decodes a BOM-less script with the SYSTEM ANSI code page, which
          # on the English runner is CP1252 -- so a Chinese path literal written here turns into
          # mojibake, the file is never found, and the whole step fails. The check script itself is
          # ASCII-safe by design (it resolves non-ASCII paths through filesystem enumeration too);
          # only this workflow file had been missed.
          # FIX: locate the script by pure-ASCII enumeration. The returned path is a .NET string and
          # is never round-tripped through the console code page, so non-ASCII dir names are safe.
          $sc = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter '*.ps1' -File |
                Where-Object { $_.Directory.Name -like '_*' -and $_.Length -gt 20000 } |
                Sort-Object Length -Descending |
                Select-Object -First 1
          if (-not $sc) { throw '[self-check] one-click script not found under a _* directory' }
          Write-Host ('[self-check] running ' + $sc.FullName)
          & $sc.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run E2E tests
        run: |
          python "_本地工具/e2e/e2e_test.py"

      # 锚点落点专项(时序类):点一次锚点只能"一整段"滚过去,不许停下再起步/倒退/瞬移。
      # 单列一个文件是因为 e2e_test.py 由另一路会话同期在改(E2E 里只有功能断言,没有逐帧轨迹判据)。
      - name: Run anchor landing E2E
        run: |
          python "_本地工具/e2e/e2e_anchor.py"
